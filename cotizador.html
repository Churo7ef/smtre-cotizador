// ---------- Búsqueda + recomendación de componentes ----------
async function buscarYRecomendar(tipo){
  const contId = 'dis-resultado-' + tipo;
  const cont = document.getElementById(contId);
  cont.innerHTML = 'Buscando…';
  if(!SUPABASE_ACTIVO){ cont.innerHTML = '<span class="hueco">Sin conexión a Supabase.</span>'; return; }

  const provinciaPrincipal = document.getElementById('dis-provincia').value;
  const provinciaFiltro = document.getElementById('dis-filtro-provincia')?.value;
  const ciudad = document.getElementById('dis-filtro-ciudad').value.trim();
  const canton = document.getElementById('dis-filtro-canton').value;

  // Pedido de Héctor (08-ago-2026): si hay una provincia de filtro distinta
  // a la principal, buscar en AMBAS y mostrarlas juntas (antes esto solo
  // pasaba para transporte/guía; para hotel/restaurante/atractivo la
  // provincia de filtro REEMPLAZABA a la principal, perdiendo sus
  // resultados). Cada opción se etiqueta con su provincia (ver más abajo)
  // y se ordena: primero las de la provincia principal, luego las del
  // filtro — dentro de cada grupo, por nivel de confianza como ya era.
  // Pedido de Héctor (08-ago-2026): si esta búsqueda viene de un botón
  // "X aquí" de una parada de la Ruta (window._paradaActivaParaTipo[tipo]
  // no es null), buscar SOLO en la provincia de esa parada — NO combinar
  // con la "Provincia" principal del programa. Ese campo principal es solo
  // el punto de partida/nombre del programa y, una vez arma una ruta con
  // varias provincias, ya no debe filtrar nada por sí mismo (si no, cada
  // parada mostraría de más los resultados de la provincia principal,
  // aunque el recorrido nunca pase por ahí).
  const esBusquedaPorParada = (window._paradaActivaParaTipo?.[tipo] ?? null) !== null;
  let pids;
  if(esBusquedaPorParada){
    pids = [provinciasMapa[provinciaFiltro]].filter(Boolean);
  } else if(provinciaFiltro && provinciaFiltro !== provinciaPrincipal){
    pids = [provinciasMapa[provinciaPrincipal], provinciasMapa[provinciaFiltro]].filter(Boolean);
  } else {
    pids = [provinciasMapa[provinciaFiltro || provinciaPrincipal]].filter(Boolean);
  }
  // Obs. 14 (sesión 6, decisión de Héctor): la tarifa de guía ahora es por
  // jornada fija (full-day/medio día/tour/día), columnas directas de "guia"
  // (tarifa_full_day, tarifa_medio_dia, tarifa_tour, tarifa_dia) — ya no
  // por escala de pax vía guia_tarifa, así que select=* alcanza para todos
  // los tipos, sin join.
  const selectBase = 'select=*';
  let query = `${selectBase}&provincia_id=in.(${pids.join(',')})`;
  if(canton && pids.length === 1) query += `&canton_id=eq.${await idCanton(canton, pids[0])}`;

  let tabla, extra = '';
  if(tipo === 'atractivo'){ tabla = 'atractivo'; }
  else if(tipo === 'guia'){ tabla = 'guia'; }
  else {
    tabla = 'proveedor';
    const tipoId = await idTipoProveedor(TIPOS_COMPONENTE[tipo]);
    extra = `&tipo_proveedor_id=eq.${tipoId}`;
    if(tipo === 'hotel'){
      // Las casillas ✓ SOLO acotan qué categorías trae la búsqueda (para no
      // saturar la lista); ya NO se usan para etiquetar los hoteles — eso
      // ahora sale siempre del dato real vía mapaCategoriaHotelPorId().
      const marcadas = [...document.querySelectorAll('.dis-cat-hotel:checked')].map(el => el.value);
      if(marcadas.length){
        const ids = [];
        for(const m of marcadas){
          for(const nombreReal of (CATEGORIA_TIER[m] || [])){
            const cat = await idCategoriaHotel(nombreReal);
            if(cat) ids.push(cat);
          }
        }
        if(ids.length) extra += `&categoria_hotel_id=in.(${ids.join(',')})`;
      }
    }
  }
  const r = await supabaseFetch(tabla, query + extra);
  if(!r.ok || !r.data.length){
    const s = obtenerSesion();
    const necesitaSesion = tabla === 'proveedor' && !s;
    cont.innerHTML = necesitaSesion
      ? `<span class="hueco">Necesitas iniciar sesión para buscar proveedores — usa 👤 Cuenta arriba y vuelve a intentar.</span>`
      : `<span class="hueco">Sin resultados en esta provincia/filtro. ${r.ok ? '' : '('+r.motivo+')'}</span>`;
    return;
  }
  let opciones = r.data;
  if(tipo === 'hotel'){
    const mapaCat = await mapaCategoriaHotelPorId();
    opciones = opciones.map(o => ({...o, categoriaEtiqueta: mapaCat[o.categoria_hotel_id] || ''}));
  }
  if(ciudad){
    const filtradas = opciones.filter(o => (o.ciudad||'').toLowerCase().includes(ciudad.toLowerCase()));
    if(filtradas.length) opciones = filtradas;
  }
  const nombreFiltro = document.getElementById('dis-filtro-nombre')?.value.trim().toLowerCase();
  if(nombreFiltro){
    const campoNombre = tabla === 'proveedor' ? 'nombre_comercial' : 'nombre';
    opciones = opciones.filter(o => (o[campoNombre]||'').toLowerCase().includes(nombreFiltro));
  }
  // Recomendación: Alto > Medio > Bajo/null, luego VERIFICADO > PARCIAL
  const puntaje = o => (({Alto:3,Medio:2,Bajo:1})[o.nivel_confianza]||0)*10 + (o.estado_verificacion==='VERIFICADO'?2:o.estado_verificacion==='PARCIAL'?1:0);
  // Etiqueta de provincia por opción, para que quede claro a cuál
  // pertenece cuando se combinan 2 provincias (principal + filtro).
  const idAProvincia = Object.fromEntries(Object.entries(provinciasMapa).map(([nombre,id]) => [id, nombre]));
  opciones = opciones.map(o => ({...o, _provinciaNombre: idAProvincia[o.provincia_id] || ''}));
  // Orden: primero la provincia principal, luego la de filtro; dentro de
  // cada grupo, por nivel de confianza como ya era.
  opciones.sort((a,b) => {
    const grupo = x => x._provinciaNombre === provinciaPrincipal ? 0 : 1;
    const g = grupo(a) - grupo(b);
    return g !== 0 ? g : puntaje(b) - puntaje(a);
  });
  const nombreCampo = (tipo === 'atractivo' || tipo === 'guia') ? 'nombre' : 'nombre_comercial';
  const recomendado = opciones[0];

  const multiple = true; // todas las categorías admiten selección múltiple (hoteles/restaurantes distintos por tramo del tour)
  cont.innerHTML = `
    <select id="sel-${tipo}" multiple size="5" style="width:100%;padding:6px;margin-bottom:6px;" ondblclick="agregarPorDobleClic(event,'${tipo}')">
      ${opciones.map((o,i) => `<option value="${o.id}">${o[nombreCampo]}${subcategoriaProveedor(o)?' — '+subcategoriaProveedor(o):''}${o.categoriaEtiqueta?' — '+o.categoriaEtiqueta:''}${pids.length>1 && o._provinciaNombre?' — '+o._provinciaNombre:''} ${o.nivel_confianza?'· confianza '+o.nivel_confianza:''}</option>`).join('')}
    </select>
    <div style="font-size:11px;color:var(--tinta-suave);margin-bottom:6px;">Recomendado: <b>${recomendado[nombreCampo]}</b> (mejor nivel de confianza/verificación). Selecciona uno o varios con Ctrl/Cmd y presiona "Agregar selección" — o haz <b>doble clic</b> sobre un elemento para agregarlo al instante.</div>
    <button class="btn-mini" onclick="confirmarSeleccion('${tipo}')">Agregar selección</button>
  `;
  window['_opciones_'+tipo] = Object.fromEntries(opciones.map(o => [o.id, o]));
}
async function idCanton(nombre, provinciaId){
  const r = await supabaseFetch('cat_canton', `select=id&nombre=eq.${encodeURIComponent(nombre)}&provincia_id=eq.${provinciaId}`);
  return r.ok && r.data[0] ? r.data[0].id : '';
}
let _cacheIdTipo = {}, _cacheIdCategoria = {};
async function idTipoProveedor(nombre){
  if(_cacheIdTipo[nombre]) return _cacheIdTipo[nombre];
  const r = await supabaseFetch('cat_tipo_proveedor', `select=id&nombre=eq.${nombre}`);
  return _cacheIdTipo[nombre] = (r.ok && r.data[0] ? r.data[0].id : '');
}
async function idCategoriaHotel(nombre){
  if(!nombre) return '';
  if(_cacheIdCategoria[nombre]) return _cacheIdCategoria[nombre];
  const r = await supabaseFetch('cat_categoria_hotel', `select=id&nombre=eq.${encodeURIComponent(nombre)}`);
  return _cacheIdCategoria[nombre] = (r.ok && r.data[0] ? r.data[0].id : '');
}

// Doble clic sobre un elemento de la lista de resultados = agregarlo de una
// vez, sin tener que presionar "Agregar selección" (pedido de Héctor,
// ronda 11). Solo actúa si el doble clic cayó sobre una <option>; ese único
// elemento se agrega aunque haya otros marcados con Ctrl/Cmd.
function agregarPorDobleClic(evento, tipo){
  const opt = evento.target;
  if(!opt || opt.tagName !== 'OPTION') return;
  confirmarSeleccion(tipo, [opt.value]);
}

function confirmarSeleccion(tipo, idsForzados){
  const sel = document.getElementById('sel-'+tipo);
  const opciones = window['_opciones_'+tipo] || {};
  const clave = { hotel:'hoteles', restaurante:'restaurantes', transporte:'transportes', atractivo:'atractivos', guia:'guias' }[tipo];
  const elegidos = idsForzados ? idsForzados.map(id => opciones[id]).filter(Boolean) : [...sel.selectedOptions].map(o => opciones[o.value]);
  window._paradaActivaParaTipo = window._paradaActivaParaTipo || {};
  const paradaIdx = window._paradaActivaParaTipo[tipo] ?? null;
  const parada = (paradaIdx !== null && paradaIdx !== undefined) ? rutaProvincias[paradaIdx] : null;
  elegidos.forEach(item => {
    // Los transportes SÍ pueden repetirse (mismo proveedor en más de un
    // tramo del recorrido, ej. vehículo principal que sale y regresa, con
    // uno local distinto en medio) — pedido de Héctor, sesión 12. El resto
    // de categorías mantiene el bloqueo de duplicados de siempre.
    if(tipo === 'transporte' || !componentesElegidos[clave].some(x => x.id === item.id)){
      if(tipo === 'hotel' || tipo === 'restaurante') item = {...item, tipoProveedor: subcategoriaProveedor(item)};
      if(tipo === 'restaurante'){
        // Pedido de Héctor (08-ago-2026 sesión 3): ya no se precarga una sola
        // tarifa — el restaurante entra sin tipo de comida marcado, Héctor
        // marca los que aplique (Desayuno/Almuerzo/Cena/A la carta) y cada
        // uno se precarga con tarifa_alimentacion_pax de la base solo si es
        // el primer tipo marcado (ver toggleTipoComidaRestaurante).
        item = {...item, tiposComida: []};
      }
      if(tipo === 'atractivo'){
        // Pedido de Héctor (ronda 10): si el atractivo trae tarifa real en
        // Supabase (columna tarifa_adulto), precargarla aquí en vez de
        // dejar el campo en $0 esperando que la tipeen a mano. Sigue
        // siendo editable con actualizarCostoAtractivo() como antes.
        item = {...item, costoEntrada: item.tarifa_adulto ?? 0};
      }
      if(tipo === 'guia'){
        // Obs. 14 (sesión 6, decisión de Héctor): auto-cargar tarifa de guía
        // directo de la columna tarifa_full_day de "guia" (tarifa fija por
        // jornada, ya no por escala de pax). tarifaGuiaManual queda null
        // hasta que el usuario edite el chip a mano (override editable).
        item = {...item, tarifaGuiaManual: null};
      }
      if(tipo === 'hotel'){
        item = {...item,
          diaDesde: parada ? parada.diaDesde : 1,
          diaHasta: parada ? parada.diaHasta : parseInt(document.getElementById('dis-dias')?.value||'1',10),
          incluyeDesayuno:true,
          temporadaAlta:false,
          paradaIdx: paradaIdx ?? null};
      } else if(tipo === 'transporte'){
        // Pedido de Héctor (sesión 11): cada transporte se asigna a un rango
        // de días (como hoteles), para poder usar transportes distintos en
        // días distintos del mismo programa. Por defecto cubre todo el
        // programa (o la parada activa, si se eligió desde la Ruta).
        // _key (sesión 12): identifica esta instancia de selección, distinto
        // del id del proveedor — permite elegir el mismo proveedor 2+ veces
        // (ver comentario arriba) sin que ✕/edición de una afecte a la otra.
        item = {...item,
          _key: item.id + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
          diaDesde: parada ? parada.diaDesde : 1,
          diaHasta: parada ? parada.diaHasta : parseInt(document.getElementById('dis-dias')?.value||'1',10),
          paradaIdx: paradaIdx ?? null};
      } else {
        // Resto de tipos: solo se etiqueta con la parada (para mostrarlo en
        // el chip y en la lista de la ruta); no cambia el costeo, que sigue
        // usando los totales globales de días/pax.
        item = {...item, paradaIdx: paradaIdx ?? null};
      }
      componentesElegidos[clave].push(item);
    }
  });
  window._paradaActivaParaTipo[tipo] = null;
  renderChipsSeleccionados();
  if(rutaProvincias.length) renderRutaProvincias();
  if(tipo === 'hotel'){ sincronizarDesayunosItinerario(); sincronizarAlojamientosItinerario(); }
  if(tipo === 'atractivo') sincronizarAtractivosItinerario();
  recalcularCosteo();
}

function quitarComponente(clave, id){
  // _key (sesión 12) identifica la instancia exacta para transportes
  // repetidos; el resto de categorías no tiene _key, así que sigue usando id.
  componentesElegidos[clave] = componentesElegidos[clave].filter(x => (x._key ?? x.id) !== id);
  renderChipsSeleccionados();
  if(clave === 'hoteles' && rutaProvincias.length) renderRutaProvincias();
  if(clave === 'hoteles'){ sincronizarDesayunosItinerario(); sincronizarAlojamientosItinerario(); }
  if(clave === 'restaurantes') sincronizarComidasItinerario();
  if(clave === 'atractivos') sincronizarAtractivosItinerario();
  recalcularCosteo();
}

function actualizarRangoHotel(id, campo, valor){
  const h = componentesElegidos.hoteles.find(x => x.id === id);
  const camposBooleanos = ['incluyeDesayuno','incluyeChofer','incluyeGuia','temporadaAlta'];
  if(h) h[campo] = camposBooleanos.includes(campo) ? valor : parseInt(valor, 10);
  sincronizarDesayunosItinerario();
  sincronizarAlojamientosItinerario();
  recalcularCosteo();
}
function actualizarCostoAtractivo(id, valor){
  const a = componentesElegidos.atractivos.find(x => x.id === id);
  if(a) a.costoEntrada = parseFloat(valor) || 0;
  recalcularCosteo();
}
function actualizarFlagAtractivo(id, campo, valor){
  const a = componentesElegidos.atractivos.find(x => x.id === id);
  if(a) a[campo] = valor;
  recalcularCosteo();
}
// Reemplazada 08-ago-2026 (sesión 3) por toggleTipoComidaRestaurante() /
// actualizarPrecioTipoComidaRestaurante() — un restaurante ahora puede
// tener varios tipos de comida a la vez, cada uno con su propio precio,
// en vez de una sola tarifa genérica. Se deja esta función por si queda
// algún dato viejo (tarifaAlimentacionPax) sin migrar todavía.
function actualizarTarifaAlimentacionRestaurante(id, valor){
  const r = componentesElegidos.restaurantes.find(x => x.id === id);
  if(r) r.tarifaAlimentacionPax = (valor === '' ? null : parseFloat(valor) || 0);
  recalcularCosteo();
}
// Marca/desmarca un tipo de comida (Desayuno/Almuerzo/Cena/A la carta)
// para un restaurante elegido. Al marcarlo por primera vez, si es el
// primer tipo de ese restaurante y existe tarifa_alimentacion_pax real de
// la base, se precarga ahí (mismo patrón que antes); los siguientes tipos
// arrancan en 0 y Héctor los edita a mano.
function toggleTipoComidaRestaurante(id, tipo, activo){
  const r = componentesElegidos.restaurantes.find(x => x.id === id);
  if(!r) return;
  r.tiposComida = r.tiposComida || [];
  if(activo){
    if(!r.tiposComida.some(tc => tc.tipo === tipo)){
      const precioInicial = (r.tiposComida.length === 0 && r.tarifa_alimentacion_pax != null) ? r.tarifa_alimentacion_pax : 0;
      r.tiposComida.push({tipo, precio: precioInicial});
    }
  } else {
    r.tiposComida = r.tiposComida.filter(tc => tc.tipo !== tipo);
  }
  renderChipsSeleccionados();
  sincronizarComidasItinerario();
  recalcularCosteo();
}
function actualizarPrecioTipoComidaRestaurante(id, tipo, valor){
  const r = componentesElegidos.restaurantes.find(x => x.id === id);
  const entrada = r && (r.tiposComida||[]).find(tc => tc.tipo === tipo);
  if(entrada) entrada.precio = (valor === '' ? 0 : (parseFloat(valor) || 0));
  recalcularCosteo();
}
// Migración silenciosa de datos guardados con el formato viejo (una sola
// tarifaAlimentacionPax) al formato nuevo (tiposComida[]) — se llama al
// cargar cualquier programa guardado antes del 08-ago-2026 sesión 3. Nunca
// inventa un tipo: si había una tarifa vieja, se convierte en "Almuerzo"
// (el tipo más común) para no perder el dato; si no había nada, queda [].
function migrarTiposComidaRestaurante(r){
  if(!r.tiposComida || !r.tiposComida.length){
    r.tiposComida = (r.tarifaAlimentacionPax != null) ? [{tipo:'Almuerzo', precio:r.tarifaAlimentacionPax}] : [];
  }
  return r;
}
// Obs. 14 (sesión 6, decisión de Héctor): la tarifa de guía dejó de ser por
// escala de pax (guia_tarifa) — ahora es tarifa fija por jornada, columnas
// directas de "guia" (tarifa_full_day/tarifa_medio_dia/tarifa_tour/tarifa_dia).
// Costeo solo pide "Guía por día", así que se usa tarifa_full_day. Devuelve
// null si el guía no tiene esa tarifa cargada — nunca se inventa un valor.
function tarifaGuiaParaPax(item, pax){
  return (item.tarifa_full_day != null && !isNaN(item.tarifa_full_day)) ? item.tarifa_full_day : null;
}
// Obs. 16 (sesión 6): mismo mecanismo que tarifaGuiaParaPax, para
// transporte — usa la tarifa_full_day cargada en el proveedor (Costeo solo
// pide "Transporte por día"). Devuelve null si no hay tarifa cargada.
function tarifaTransporteParaDia(item){
  return (item.tarifa_full_day != null && !isNaN(item.tarifa_full_day)) ? item.tarifa_full_day : null;
}
// Rango de días por transporte (sesión 11, pedido de Héctor: transportes
// distintos en días distintos del mismo programa), mismo patrón que
// actualizarRangoHotel.
function actualizarRangoTransporte(id, campo, valor){
  const t = componentesElegidos.transportes.find(x => (x._key ?? x.id) === id);
  if(t) t[campo] = parseInt(valor, 10) || 1;
  recalcularCosteo();
}
// Override editable por transporte (mismo patrón que actualizarTarifaGuiaManual).
function actualizarTarifaTransporteManual(id, valor){
  const t = componentesElegidos.transportes.find(x => (x._key ?? x.id) === id);
  if(t) t.tarifaTransporteManual = (valor === '' ? null : parseFloat(valor) || 0);
  recalcularCosteo();
}
// Override editable por guía (pedido de Héctor 08-ago-2026, mismo patrón
// que actualizarTarifaAlimentacionRestaurante): si el usuario edita el
// campo del chip a mano, ese valor manda sobre el cálculo automático por
// escala de pax hasta que lo borre (deja el campo vacío = "").
function actualizarTarifaGuiaManual(id, valor){
  const g = componentesElegidos.guias.find(x => x.id === id);
  if(g) g.tarifaGuiaManual = (valor === '' ? null : parseFloat(valor) || 0);
  recalcularCosteo();
}
// Pedido de Héctor (01-ago): el precio de hotel viene de Supabase
// (tarifa_temporada_baja) pero debe poder ajustarse manualmente por
// programa sin tocar el dato maestro del proveedor en la base.
function actualizarTarifaHotel(id, valor){
  const h = componentesElegidos.hoteles.find(x => x.id === id);
  if(h) h.tarifa_temporada_baja = parseFloat(valor) || 0;
  recalcularCosteo();
}
// Sesión 26: mismo patrón que actualizarTarifaHotel, para la tarifa de
// temporada alta — antes existía la columna en Supabase y se podía editar
// en el catálogo, pero el motor de costeo nunca la leía (hallazgo de la
// auditoría de esa sesión). Ahora sí se usa: ver el checkbox "Temporada
// alta" en el chip del hotel y el bloque de respaldo en recalcularCosteo().
function actualizarTarifaHotelAlta(id, valor){
  const h = componentesElegidos.hoteles.find(x => x.id === id);
  if(h) h.tarifa_temporada_alta = parseFloat(valor) || 0;
  recalcularCosteo();
}

// Ronda 11 (pedido de Héctor): tarifas por tipo de habitación (simple/doble/
// triple/cuádruple), editables por programa sin tocar el dato maestro del
// proveedor, igual que ya pasa con tarifa_temporada_baja arriba.
// "familiar" no tiene una ocupación estándar universal; se asume 5 pax
// (convención común en la industria hotelera ecuatoriana) — si Héctor
// confirma que sus hoteles usan otro número, se ajusta aquí.
const OCUPACION_TIPO_HABITACION = {simple:1, doble:2, triple:3, cuadruple:4, familiar:5};
function actualizarTarifaHabitacion(id, tipo, valor){
  const h = componentesElegidos.hoteles.find(x => x.id === id);
  if(h) h['tarifa_hab_'+tipo] = parseFloat(valor) || 0;
  recalcularCosteo();
}
function actualizarTipoHabitacionHotel(id, tipo){
  const h = componentesElegidos.hoteles.find(x => x.id === id);
  if(h) h.tipoHabitacion = tipo;
  recalcularCosteo();
}
// Tipos de habitación con tarifa cargada (>0) para un hotel — solo esos se
// ofrecen para elegir y solo esos entran en el comparativo (pedido de
// Héctor: "solo generará los precios de la habitación... que tiene precio
// no con 0 valor").
function tiposHabitacionDisponibles(h){
  return Object.keys(OCUPACION_TIPO_HABITACION).filter(t => (h['tarifa_hab_'+t]||0) > 0);
}

// Regla del negocio (Héctor, 30-jul): las gratuidades se otorgan solo sobre
// pasajeros adultos. Cada 2 niños o cada 2 personas de tercera edad/
// discapacidad equivalen a 1 adulto únicamente para este cálculo (no para
// el costeo normal de cada segmento, que tiene su propia lógica).
function adultosEquivalentesParaGratuidad(){
  const adultos = parseInt(document.getElementById('dis-pax-adultos')?.value || '0', 10);
  const ninos = parseInt(document.getElementById('dis-pax-ninos')?.value || '0', 10);
  const terceraEdad = parseInt(document.getElementById('dis-pax-terceraedad')?.value || '0', 10);
  return adultos + Math.floor(ninos/2) + Math.floor(terceraEdad/2);
}

// Regla del negocio (Héctor, 27-jul; cada-N-pax configurable desde 01-ago):
// 1 gratuidad por cada N adultos-equivalentes (N-1 pagantes + 1 gratis, el
// N-ésimo pasajero). N era fijo en 16; ahora Héctor lo edita en
// "dis-gratuidad-cada" (sigue sugiriendo 16 por defecto). El campo de
// número de gratuidades sigue editable por si un proveedor puntual pacta
// otra proporción para ese programa específico.
function sugerirGratuidades(){
  const campo = document.getElementById('dis-gratuidades');
  const cada = parseInt(document.getElementById('dis-gratuidad-cada')?.value || '16', 10) || 16;
  const equivalentes = adultosEquivalentesParaGratuidad();
  if(campo) campo.value = Math.floor(equivalentes/cada);
  // Pedido de Héctor (ronda 10): esto ya se calculaba solo con cada cambio
  // de pax, pero era invisible — el número base (pax-equivalentes) nunca se
  // mostraba, solo el resultado final. Ahora se ve el detalle.
  const detalle = document.getElementById('dis-gratuidad-detalle');
  if(detalle){
    const adultos = parseInt(document.getElementById('dis-pax-adultos')?.value || '0', 10);
    const ninos = parseInt(document.getElementById('dis-pax-ninos')?.value || '0', 10);
    const terceraEdad = parseInt(document.getElementById('dis-pax-terceraedad')?.value || '0', 10);
    detalle.textContent = `Pax-equivalentes para gratuidad: ${equivalentes} (${adultos} adultos + ${ninos} niño${ninos!==1?'s':''}÷2 + ${terceraEdad} 3ra edad÷2) ÷ ${cada} = ${Math.floor(equivalentes/cada)} gratuidad${Math.floor(equivalentes/cada)!==1?'es':''}, calculado automáticamente cada vez que cambian los pax.`;
  }
}

// Descuento escalonado por tamaño de grupo — deliberadamente bajo impacto
// (máximo 5%) para no erosionar el margen mínimo del 15% de la política
// financiera del proyecto. Siempre editable por el usuario.
function sugerirDescuentoGrupo(){
  const pax = parseInt(document.getElementById('dis-pax-confirmado')?.value || '0', 10);
  const campo = document.getElementById('dis-descuento-grupo');
  if(!campo) return;
  let pct = 0;
  if(pax >= 40) pct = 5;
  else if(pax >= 25) pct = 3;
  else if(pax >= 15) pct = 1.5;
  campo.value = pct;
  recalcularCosteo();
}

// Pedido de Héctor (01-ago): el número de pax "confirmado" (arriba, en
// Datos del viajero) debe alimentar el cálculo real de costeo/gratuidades
// en vez de quedarse aislado — antes cambiarlo no tocaba "Adultos" y el
// costeo seguía usando el valor fijo por defecto (15). Ahora, al cambiar
// el total confirmado, se reparte a "Adultos" descontando los niños/
// tercera edad que ya estén cargados (nunca negativo).
function actualizarPaxConfirmado(){
  const confirmado = parseInt(document.getElementById('dis-pax-confirmado')?.value || '0', 10);
  if(confirmado > 0){
    const ninos = parseInt(document.getElementById('dis-pax-ninos')?.value || '0', 10);
    const terceraEdad = parseInt(document.getElementById('dis-pax-terceraedad')?.value || '0', 10);
    document.getElementById('dis-pax-adultos').value = Math.max(0, confirmado - ninos - terceraEdad);
  }
  actualizarPaxSegmentado();
  sugerirDescuentoGrupo();
}

function actualizarPaxSegmentado(){
  const adultos = parseInt(document.getElementById('dis-pax-adultos')?.value || '0', 10);
  const ninos = parseInt(document.getElementById('dis-pax-ninos')?.value || '0', 10);
  const terceraEdad = parseInt(document.getElementById('dis-pax-terceraedad')?.value || '0', 10);
  const total = adultos + ninos + terceraEdad;
  document.getElementById('dis-pax-ref').value = total;
  // Pedido de Héctor (ronda 12): "Número de pax confirmado" (arriba, Datos
  // del viajero) debe reflejar siempre el total real de Costeo, no solo al
  // revés — antes solo Costeo se actualizaba y el campo de arriba quedaba
  // desincronizado si Héctor ajustaba Adultos/Niños/Tercera edad a mano.
  const campoConfirmado = document.getElementById('dis-pax-confirmado');
  if(campoConfirmado) campoConfirmado.value = total;
  sugerirGratuidades();
  recalcularCosteo();
}

function marcarPrecioDirty(cual){
  window._pxDirty = window._pxDirty || {adulto:false, nino:false, te:false};
  window._pxDirty[cual] = true;
}
function marcarPrecioNoDirty(cual){
  window._pxDirty = window._pxDirty || {adulto:false, nino:false, te:false};
  window._pxDirty[cual] = false;
  recalcularCosteo();
}

function recalcularCosteo(){
  const cont = document.getElementById('dis-resumen-costeo');
  if(!cont) return;
  const pax = parseInt(document.getElementById('dis-pax-ref')?.value || '15', 10);
  const dias = parseInt(document.getElementById('dis-dias')?.value || '1', 10);
  const gratuidades = parseInt(document.getElementById('dis-gratuidades')?.value || '0', 10);
  const paxPagantes = Math.max(1, pax - gratuidades);
  const incAlojamiento = (document.getElementById('dis-inc-alojamiento')?.checked ?? true) && dias > 1;
  const incAlimentacion = document.getElementById('dis-inc-alimentacion')?.checked ?? true;
  const incTransporte = document.getElementById('dis-inc-transporte')?.checked ?? true;
  const incGuia = document.getElementById('dis-inc-guia')?.checked ?? true;
  const descuentoPct = parseFloat(document.getElementById('dis-descuento-grupo')?.value || '0');

  const c = componentesElegidos;

  // Costo de hotel agrupado por categoría marcada (Turista/Ejecutivo/Superior).
  // Si no hay categoría (programas guardados antes de este cambio, o ningún
  // hotel elegido aún) se usa una sola bolsa "Única" — igual al comportamiento
  // anterior, para no romper programas ya guardados.
  const costosHotelPorCategoria = {};
  let costoHospedajeStaff = 0;
  if(incAlojamiento){
    (c.hoteles||[]).forEach(h => {
      const cat = h.categoriaEtiqueta || 'Única';
      const noches = Math.max(0, (h.diaHasta||dias) - (h.diaDesde||1) + 1);
      // Obs. 2 (sesión 6, corregido sesión 21 - 31-ago-2026): Héctor
      // confirmó con un ejemplo numérico que la regla es 1× el valor de
      // un adulto POR CADA check sin cortesía (chofer y guía por
      // separado), prorrateado entre pasajeros — NO 2× por cada uno como
      // se venía calculando desde sesión 6 (eso duplicaba el monto: con
      // ambos sin cortesía cobraba 4× en vez de 2×). Confirmado con su
      // propio caso: hotel $10/pax, grupo de 10, ambos sin cortesía →
      // $10+$10=$20 extra → $2/pax → pax pasa de $10 a $12.
      const extraStaff = (h.incluyeChofer?1:0) + (h.incluyeGuia?1:0);
      const tiposDisp = tiposHabitacionDisponibles(h);
      let costo, costoUnAdultoEsteHotel;
      if(tiposDisp.length){
        const tipoUsar = (h.tipoHabitacion && tiposDisp.includes(h.tipoHabitacion)) ? h.tipoHabitacion : (tiposDisp.includes('doble') ? 'doble' : tiposDisp[0]);
        // Corrección Obs. 4 de Observaciones_turismo.docx (sesión 22,
        // 2-sep-2026, hallazgo tras prueba de Héctor en navegador): este
        // "tipoUsar" solo vivía como variable local para el cálculo — nunca
        // se guardaba de vuelta en h.tipoHabitacion. Si Héctor llenaba
        // solo la tarifa "Simple" (sin abrir el selector "Cotizar este
        // hotel en"), el costeo SÍ usaba Simple correctamente, pero
        // h.tipoHabitacion seguía vacío al momento de generar el
        // documento, así que el aviso de "(habitación simple)" nunca se
        // activaba. Se persiste aquí, que es donde se recalcula en cada
        // cambio relevante — así queda siempre sincronizado.
        h.tipoHabitacion = tipoUsar;
        const ocup = OCUPACION_TIPO_HABITACION[tipoUsar];
        costo = (h['tarifa_hab_'+tipoUsar]||0) * Math.ceil(pax/ocup) * noches;
        costoUnAdultoEsteHotel = ((h['tarifa_hab_'+tipoUsar]||0) / ocup) * noches;
      } else {
        // Sesión 26: si el hotel no tiene tarifas por tipo de habitación
        // cargadas, se usa la tarifa genérica de respaldo — temporada alta
        // si el checkbox está marcado y tiene un valor cargado, si no la de
        // temporada baja de siempre. Antes tarifa_temporada_alta se podía
        // editar en el catálogo pero nunca se usaba aquí (hallazgo de la
        // auditoría de costeo/vouchers, sesión 26).
        const tarifaRespaldo = (h.temporadaAlta && h.tarifa_temporada_alta) ? h.tarifa_temporada_alta : (h.tarifa_temporada_baja || 0);
        costo = tarifaRespaldo * Math.ceil(pax/2) * noches;
        costoUnAdultoEsteHotel = (tarifaRespaldo / 2) * noches;
      }
      const staffEsteHotel = costoUnAdultoEsteHotel * extraStaff;
      costo += staffEsteHotel;
      costoHospedajeStaff += staffEsteHotel;
      costosHotelPorCategoria[cat] = (costosHotelPorCategoria[cat]||0) + costo;
    });
  }
  const categoriasConHotel = Object.keys(costosHotelPorCategoria);
  const esMultiCategoria = categoriasConHotel.length > 1;

  // Obs. 16 (sesión 6, mismo patrón que alimentación/guía): si los
  // transportes elegidos traen tarifa real (columna tarifa_full_day de
  // "proveedor", o editada a mano en su chip), el campo global "Transporte
  // por día" se autocompleta con el promedio. Si Héctor edita el campo
  // global directamente, queda congelado (window._transporteDirty) hasta
  // que use ↺.
  const tarifasRealesTransportes = (c.transportes||[]).map(t => t.tarifaTransporteManual ?? tarifaTransporteParaDia(t)).filter(v => v!=null && !isNaN(v));
  if(tarifasRealesTransportes.length && !window._transporteDirty){
    const promedioTransporte = tarifasRealesTransportes.reduce((s,v)=>s+v,0) / tarifasRealesTransportes.length;
    const campoTransporte = document.getElementById('dis-transporte-dia');
    if(campoTransporte) campoTransporte.value = promedioTransporte.toFixed(2);
  }
  const transportePorDia = parseFloat(document.getElementById('dis-transporte-dia')?.value || '0');
  // Pedido de Héctor (ronda 10): si los restaurantes elegidos traen tarifa
  // real (de Supabase o editada a mano en su chip), el campo global de abajo
  // se autocompleta con el promedio — igual que el patrón ↺ ya usado en
  // precio por pasajero. Si Héctor edita el campo global directamente, queda
  // congelado (window._alimentacionDirty) hasta que use ↺.
  // Obs. 7 de cambios_tur.docx (12-ago sesión 5): además de ↺, borrar el
  // campo por completo (dejarlo vacío) también descongela — antes solo
  // ↺ lo hacía, y si Héctor escribía un valor a mano y luego lo borraba, el
  // campo se quedaba vacío y el costeo mostraba $0 hasta que usara ↺
  // manualmente. Mismo patrón aplicado a Guía por día (window._guiaDirty).
  // Sesión 14 (Héctor, confirmado): el campo global debe representar la
  // SUMA de las comidas de un día (desayuno + almuerzo + cena + a la
  // carta), no un promedio de todas las tarifas mezcladas — antes, al
  // agregar más restaurantes con tarifas más bajas, el promedio bajaba y
  // parecía "restar" en vez de sumar. Ahora: por cada tipo de comida que
  // tenga al menos una tarifa cargada, se promedia entre los restaurantes
  // que la ofrecen (si hay 2+ opciones para el mismo tipo, ej. 2
  // restaurantes con almuerzo, se sigue promediando entre ellos) y luego
  // se SUMAN los promedios de los distintos tipos.
  const tarifasPorTipoComida = {};
  (c.restaurantes||[]).forEach(r => (r.tiposComida||[]).forEach(tc => {
    const v = tc.precio;
    if(v!=null && !isNaN(v) && v > 0){
      (tarifasPorTipoComida[tc.tipo] = tarifasPorTipoComida[tc.tipo] || []).push(v);
    }
  }));
  const tarifasRealesRestaurantes = Object.values(tarifasPorTipoComida).flat();
  if(tarifasRealesRestaurantes.length && !window._alimentacionDirty){
    const sumaDia = Object.values(tarifasPorTipoComida).reduce((sum, valores) => sum + (valores.reduce((s,v)=>s+v,0) / valores.length), 0);
    const campoAlim = document.getElementById('dis-alimentacion-pax');
    if(campoAlim) campoAlim.value = sumaDia.toFixed(2);
  }
  const alimentacionPorDiaPax = parseFloat(document.getElementById('dis-alimentacion-pax')?.value || '0');
  // Pedido de Héctor (08-ago-2026, actualizado sesión 6 obs.14): mismo
  // patrón que alimentación, aplicado a guía — si los guías elegidos traen
  // tarifa (columna tarifa_full_day de "guia", o editada a mano en su
  // chip), el campo global "Guía por día" se autocompleta con el promedio.
  // Si Héctor edita el campo global directamente, queda congelado
  // (window._guiaDirty) hasta que use ↺.
  const tarifasRealesGuias = (c.guias||[]).map(g => g.tarifaGuiaManual ?? tarifaGuiaParaPax(g, pax)).filter(v => v!=null && !isNaN(v));
  if(tarifasRealesGuias.length && !window._guiaDirty){
    const promedioGuia = tarifasRealesGuias.reduce((s,v)=>s+v,0) / tarifasRealesGuias.length;
    const campoGuia = document.getElementById('dis-guia-dia');
    if(campoGuia) campoGuia.value = promedioGuia.toFixed(2);
  }
  const guiaPorDia = parseFloat(document.getElementById('dis-guia-dia')?.value || '0');
  const transporteGuiaFijo = document.getElementById('dis-transporte-guia-fijo')?.checked ?? true;

  // Pedido de Héctor (01-ago): alimentación (siempre) y transporte/guía
  // (solo si NO son "el mismo para todo el recorrido") usan la tarifa
  // propia de cada parada si se cargó una; si una parada no tiene tarifa
  // propia, o hay días del programa que ninguna parada cubre, esos días
  // se cobran con la tarifa global de Costeo — así nunca se pierde costo
  // por un día "huérfano".
  function costoPorParadas(campoTarifa, tarifaGlobal, porPax){
    if(!rutaProvincias.length) return tarifaGlobal * dias * (porPax ? pax : 1);
    let diasCubiertos = 0, total = 0;
    rutaProvincias.forEach(p => {
      const diasParada = Math.max(0, (p.diaHasta||1) - (p.diaDesde||1) + 1);
      diasCubiertos += diasParada;
      const tarifa = (p[campoTarifa] ?? null) !== null ? p[campoTarifa] : tarifaGlobal;
      total += tarifa * diasParada * (porPax ? pax : 1);
    });
    const diasSinCubrir = Math.max(0, dias - diasCubiertos);
    total += tarifaGlobal * diasSinCubrir * (porPax ? pax : 1);
    return total;
  }

  // Transporte por rango de días (sesión 11, pedido de Héctor: transportes
  // distintos en días distintos del mismo programa, y varios transportes el
  // mismo día si aplica). Cada transporte elegido cubre su rango diaDesde-
  // diaHasta con su propia tarifa (manual o de la base). Si un día no está
  // cubierto por ningún transporte, se cobra con "Transporte por día" como
  // respaldo (mismo espíritu que costoPorParadas). Ya no depende del check
  // "es el mismo transporte para todo el recorrido" — ese check sigue
  // aplicando solo a guía, más abajo.
  function costoTransportePorDia(){
    const lista = c.transportes || [];
    let total = 0;
    const detalleDias = []; // sesión 12: detalle día por día para desglosar en pantalla (obs. Héctor: el total no se entendía)
    for(let d = 1; d <= dias; d++){
      const delDia = lista.filter(t => (t.diaDesde||1) <= d && d <= (t.diaHasta||dias));
      let montoDia = 0;
      const items = [];
      if(delDia.length){
        delDia.forEach(t => {
          const monto = t.tarifaTransporteManual ?? tarifaTransporteParaDia(t) ?? transportePorDia;
          montoDia += monto;
          items.push({nombre: t.nombre_comercial, monto});
        });
      } else {
        montoDia = transportePorDia;
        items.push({nombre: 'Respaldo (sin transporte asignado este día)', monto: transportePorDia});
      }
      total += montoDia;
      detalleDias.push({dia: d, items, monto: montoDia});
    }
    costoTransportePorDia._ultimoDetalle = detalleDias; // se lee después para el desglose visible
    return total;
  }
  const costoTransporte = incTransporte ? costoTransportePorDia() : 0;
  // Pedido de Héctor (ronda 10): el check "Desayuno incluido" de cada hotel
  // debe restarse del costo de alimentación en los días que aplica (no
  // todos los hoteles lo dan). Se cuenta cada día una sola vez aunque haya
  // más de un hotel ese día, con la misma regla de "el desayuno es la
  // mañana de un día que amaneciste ahí" usada en sincronizarDesayunosItinerario().
  // Pedido de Héctor (08-ago-2026 sesión 3): ya no hay campo manual de
  // "Desayuno por pax/día" — se calcula solo, promediando el precio de
  // todos los tipos de comida "Desayuno" marcados en los restaurantes
  // elegidos (mismo patrón que el promedio de alimentación general).
  const tarifasDesayunoRestaurantes = (c.restaurantes||[]).flatMap(r => (r.tiposComida||[]).filter(tc=>tc.tipo==='Desayuno').map(tc=>tc.precio)).filter(v=>v!=null && !isNaN(v) && v>0);
  const desayunoPorDiaPax = tarifasDesayunoRestaurantes.length ? (tarifasDesayunoRestaurantes.reduce((s,v)=>s+v,0)/tarifasDesayunoRestaurantes.length) : 0;
  // Pedido de Héctor (ronda 12, sesión 10, 16-ago-2026): la regla anterior
  // (desde+1 a hasta) dejaba SIN descuento cualquier hotel de un solo día
  // ("Día X a X" — el caso más común, una sola noche), porque el rango
  // desde+1..hasta queda vacío cuando desde===hasta. Héctor confirmó la
  // regla correcta: el desayuno se resta en TODOS los días que cubre el
  // hotel (desde..hasta inclusive), sin excluir el primer día — incluso
  // confirmó esto explícitamente para un hotel "Día 1 a 3" (3 días,
  // 2 noches): se resta el desayuno en los 3 días, no solo 2 y 3.
  const diasConDesayunoIncluido = new Set();
  (c.hoteles||[]).forEach(h => {
    if(!h.incluyeDesayuno) return;
    const desde = h.diaDesde||1, hasta = h.diaHasta||desde;
    for(let d = desde; d <= hasta; d++) diasConDesayunoIncluido.add(d);
  });
  const costoDesayunoAhorrado = incAlimentacion ? desayunoPorDiaPax * diasConDesayunoIncluido.size * pax : 0;
  // Pedido de Héctor (ronda 10/11): por defecto se asume cortesía de comida
  // para chofer y guía (no se suma nada) — el checkbox ahora representa esa
  // cortesía y viene MARCADO por defecto. Si Héctor lo DESMARCA (porque no
  // hay cortesía y hay que pagar), se suma la tarifa de alimentación
  // completa (sin el descuento de desayuno, que es un detalle menor que no
  // vale la pena prorratear para solo 1-2 personas) por esos días.
  const choferEnCortesiaAlim = document.getElementById('dis-alim-chofer')?.checked ?? true;
  const guiaEnCortesiaAlim = document.getElementById('dis-alim-guia')?.checked ?? true;
  const alimChoferACobrar = !choferEnCortesiaAlim;
  const alimGuiaACobrar = !guiaEnCortesiaAlim;
  const extraPaxAlimentacionStaff = (alimChoferACobrar?1:0) + (alimGuiaACobrar?1:0);
  // Obs. 2 (sesión 6, corregido sesión 21 - 31-ago-2026): 1× el valor de
  // un adulto por cada checkbox sin cortesía (chofer y guía por
  // separado) — no ×2 como se calculaba desde sesión 6, que duplicaba el
  // monto real (ver corrección igual en el bloque de hospedaje, arriba).
  const costoAlimentacionStaff = incAlimentacion ? alimentacionPorDiaPax * dias * extraPaxAlimentacionStaff : 0;
  const costoAlimentacion = incAlimentacion ? Math.max(0, costoPorParadas('tarifaAlimentacion', alimentacionPorDiaPax, true) - costoDesayunoAhorrado) + costoAlimentacionStaff : 0;
  const costoGuia = incGuia ? (transporteGuiaFijo ? guiaPorDia * dias : costoPorParadas('tarifaGuia', guiaPorDia, false)) : 0;
  // Pedido de Héctor (ronda 10): entrada de chofer/guía a un atractivo — por
  // defecto se asume cortesía (no suma); si el atractivo marca que sí se
  // cobra, se suma 1 entrada más por cada uno marcado (no se multiplica por
  // pax, es solo 1 persona).
  // Pedido de Héctor (08-ago-2026 sesión 3): un atractivo puede marcarse
  // "no incluye entrada en el programa" (el pasajero la paga aparte, en el
  // sitio) — en ese caso ni su entrada ni la cortesía de chofer/guía ahí
  // suman al costo del programa. incluyeEntrada!==false para tratar los
  // atractivos ya guardados antes de este cambio (sin el campo) como
  // incluidos, igual que se comportaban.
  const costoAtractivosGrupo = (c.atractivos||[]).filter(a=>a.incluyeEntrada!==false).reduce((s,a) => s + (a.costoEntrada||0), 0) * pax;
  // Obs. 2 (sesión 6, corregido sesión 21 - 31-ago-2026): "valor de un
  // adulto × 1" por cada checkbox sin cortesía (chofer y guía por
  // separado), NO ×2 — Héctor confirmó con un ejemplo numérico que la
  // regla es 1× por check, no 2× (ver corrección igual en hospedaje y
  // alimentación, arriba).
  // Sesión 14 (Héctor, confirmado): el chofer/guía entra con el grupo
  // independientemente de si el pasajero paga su propia entrada aparte o
  // no — por eso este cálculo YA NO filtra por incluyeEntrada (antes
  // heredaba el mismo filtro que costoAtractivosGrupo y, al desmarcar
  // "incluye entrada en el programa", la cortesía de chofer/guía dejaba de
  // sumar aunque estuviera marcada sin cortesía).
  const costoAtractivosStaff = (c.atractivos||[]).reduce((s,a) => s + (a.costoEntrada||0) * ((a.incluyeChofer?1:0)+(a.incluyeGuia?1:0)), 0);
  const costoAtractivos = costoAtractivosGrupo + costoAtractivosStaff;

  // Pedido de Héctor (ronda 10): a diferencia de hotel/alimentación/atractivos
  // (donde el proveedor suele dar cortesía y por eso hay que marcarlo caso
  // por caso), souvenir e imprevistos son presupuesto propio de la agencia
  // — ahí SIEMPRE se incluye a chofer y guía si el programa los tiene
  // incluidos (checkboxes de "Servicios incluidos" arriba), sin necesidad
  // de marcar nada aparte.
  const staffConImprevistosYSouvenir = (incTransporte?1:0) + (incGuia?1:0);
  const imprevistos = parseFloat(document.getElementById('dis-imprevistos')?.value || '0') * (pax + staffConImprevistosYSouvenir);
  const seguro = parseFloat(document.getElementById('dis-seguro')?.value || '0') * pax;
  const souvenir = parseFloat(document.getElementById('dis-souvenir-costo')?.value || '0') * (pax + staffConImprevistosYSouvenir);
  // Obs. 10 (sesión 6): hidratación deja de ser solo una línea de texto en
  // "Incluye" — ahora es un ítem costeado, mismo criterio que
  // souvenir/imprevistos (presupuesto propio, incluye chofer/guía si el
  // programa los tiene, sin marcar nada aparte): precio por botella ×
  // botellas por pax por día × días.
  const hidratacionPrecioBotella = parseFloat(document.getElementById('dis-hidratacion-precio-botella')?.value || '0');
  const hidratacionBotellasDia = parseFloat(document.getElementById('dis-hidratacion-botellas-dia')?.value || '0');
  const hidratacion = hidratacionPrecioBotella * hidratacionBotellasDia * dias * (pax + staffConImprevistosYSouvenir);
  sincronizarSeguroSouvenirIncluye(seguro, souvenir);
  const margen = parseFloat(document.getElementById('dis-margen')?.value || '0') / 100;
  // Obs. 3 (sesión 7, 14-ago-2026): cargo fijo interno que Héctor pidió
  // insertar ANTES de su margen, sobre el costo neto total (costoBase). No
  // debe aparecer como línea propia en ningún desglose — queda absorbido
  // en la línea "Margen" ya existente. Se guarda en localStorage (config
  // global, no por programa) y solo se edita con el ícono ⚙ junto al campo
  // "Margen de utilidad" (ver editarMargenFijoOculto). Default 20%.
  const margenFijoOculto = getMargenFijoOculto() / 100;
  const margenReventaPct = parseFloat(document.getElementById('dis-margen-reventa')?.value || '0');
  // Pedido de Héctor (08-ago-2026 sesión 3): tercer nivel de precio. La
  // tarifa neta ya trae tu ganancia (margen). A esa neta se le suma la
  // comisión de agencia (%) -> "precio para agencia". A ESE precio se le
  // suma este % adicional -> "PVP público", el precio final que todos
  // (tú y cualquier agencia revendedora) venden igual, sin tocar ni tu
  // ganancia ni la comisión ya pactada de la agencia.
  const pvpPct = parseFloat(document.getElementById('dis-pvp-pct')?.value || '0');
  const descNinoPct = parseFloat(document.getElementById('dis-descuento-nino-pct')?.value || '0');
  const descTEPct = parseFloat(document.getElementById('dis-descuento-te-pct')?.value || '0');
  const adultos = parseInt(document.getElementById('dis-pax-adultos')?.value || '0', 10);
  const ninos = parseInt(document.getElementById('dis-pax-ninos')?.value || '0', 10);
  const terceraEdad = parseInt(document.getElementById('dis-pax-terceraedad')?.value || '0', 10);
  // Bolsa "fija": igual para todas las categorías de hotel — transporte,
  // guía, atractivos, imprevistos, seguro, souvenir. No cambia según qué
  // categoría de hotel se ofrezca.
  const costoFijo = costoTransporte + costoGuia + costoAtractivos + imprevistos + seguro + souvenir + hidratacion;

  // ---- Dos bolsas de costo (regla de Héctor, 30-jul) ----
  // "Descontable": alojamiento + alimentación — a esto sí se le aplica el
  // % de descuento de niño/tercera edad, porque ahí sí se cobra menos por
  // persona (una cama o un plato de menos cuesta menos).
  // "Fijo": transporte, guía, atractivos, imprevistos, seguro, souvenir —
  // se cobra igual para todos los pasajeros, niño/tercera edad no tiene
  // descuento ahí (el bus y el guía cuestan lo mismo sin importar quién va).
  function calcularSegmentos(costoHotelCat){
    const costoDescontable = costoHotelCat + costoAlimentacion;
    const costoBaseCrudo = costoDescontable + costoFijo;
    // Pedido de Héctor (sesión 7, 15-ago-2026): el % del ⚙ (margen fijo
    // oculto) ahora se suma ANTES, quedando ya incluido en lo que se
    // muestra como "Costo neto total" — así el cambio SÍ se nota en esa
    // línea (antes quedaba invisible, mezclado dentro de "Margen", y solo
    // se notaba en la tarifa neta final). De aquí en adelante se siguen
    // sumando, en orden: tu margen de utilidad, la comisión para agencia,
    // y el % adicional para PVP público — igual que antes.
    const costoBase = costoBaseCrudo * (1 + margenFijoOculto);
    const costoConMargen = costoBase * (1 + margen);
    const costoConDescuento = costoConMargen * (1 - descuentoPct/100);
    const netoTotal = costoConDescuento;

    const propDescontable = costoBase > 0 ? costoDescontable/costoBase : 0;
    const netoDescontablePorPax = pax > 0 ? (netoTotal * propDescontable) / pax : 0;
    const netoFijoPorPax = pax > 0 ? (netoTotal * (1-propDescontable)) / pax : 0;

    const netoAdultoPorPax = netoFijoPorPax + netoDescontablePorPax;
    const netoNinoPorPax = netoFijoPorPax + netoDescontablePorPax*(1-descNinoPct/100);
    const netoTEPorPax = netoFijoPorPax + netoDescontablePorPax*(1-descTEPct/100);

    // Pedido de Héctor (ronda 10): línea aparte que muestra SOLO el costo de
    // alojamiento (sin alimentación ni la bolsa fija) por tipo de pasajero,
    // con el mismo % de descuento de niño/tercera edad que ya se aplica a
    // toda la bolsa "descontable". Es informativo — no cambia ningún total
    // existente, solo desglosa cuánto de esa bolsa es específicamente hotel.
    const propHospedaje = costoBase > 0 ? costoHotelCat/costoBase : 0;
    const netoHospedajePorPax = pax > 0 ? (netoTotal * propHospedaje) / pax : 0;
    const hospedajeAdultoPorPax = netoHospedajePorPax;
    const hospedajeNinoPorPax = netoHospedajePorPax * (1 - descNinoPct/100);
    const hospedajeTEPorPax = netoHospedajePorPax * (1 - descTEPct/100);

    // Gratuidades (regla de Héctor, 30-jul): solo se dan sobre adultos. El
    // costo de esos cupos gratis se reparte entre los adultos que sí pagan
    // (niños y tercera edad pagan su propia tarifa sin verse afectados).
    const adultosPagantes = Math.max(0, adultos - gratuidades);
    const netoAdultoPagantePorPax = adultosPagantes > 0 ? (adultos * netoAdultoPorPax) / adultosPagantes : netoAdultoPorPax;

    const netoTotalGrupo = adultos*netoAdultoPorPax + ninos*netoNinoPorPax + terceraEdad*netoTEPorPax;
    // Pedido de Héctor (01-ago): todo precio de venta al público (PVP) se
    // redondea siempre hacia el entero superior — nunca hacia abajo, nunca
    // a decimales. La tarifa neta (lo que te queda a ti) NO se redondea,
    // solo el precio que ve el pasajero/agencia.
    // Corrección (08-ago sesión 3): si el porcentaje es 0%, NO se redondea
    // — antes el Math.ceil igual inventaba unos centavos de "redondeo" que
    // se mostraban como si fueran comisión (confuso). Con 0% el resultado
    // debe quedar exactamente igual a la tarifa neta, sin diferencia.
    const pvpAdulto = margenReventaPct > 0 ? Math.ceil(netoAdultoPagantePorPax * (1 + margenReventaPct/100)) : netoAdultoPagantePorPax;
    const pvpNino = margenReventaPct > 0 ? Math.ceil(netoNinoPorPax * (1 + margenReventaPct/100)) : netoNinoPorPax;
    const pvpTE = margenReventaPct > 0 ? Math.ceil(netoTEPorPax * (1 + margenReventaPct/100)) : netoTEPorPax;
    const pvpTotal = margenReventaPct > 0 ? Math.ceil(netoTotalGrupo * (1 + margenReventaPct/100)) : netoTotalGrupo;
    const comisionTotal = pvpTotal - netoTotalGrupo;
    // Tercer nivel: "PVP público" = precio para agencia + % adicional. Es
    // el precio final que se cotiza al pasajero/se guarda como precio de
    // venta — pvpAdulto/pvpTotal (arriba) quedan como el precio intermedio
    // "para agencia", visible solo en el detalle interno.
    const pvpPublicoAdulto = pvpPct > 0 ? Math.ceil(pvpAdulto * (1 + pvpPct/100)) : pvpAdulto;
    const pvpPublicoNino = pvpPct > 0 ? Math.ceil(pvpNino * (1 + pvpPct/100)) : pvpNino;
    const pvpPublicoTE = pvpPct > 0 ? Math.ceil(pvpTE * (1 + pvpPct/100)) : pvpTE;
    const pvpPublicoTotal = pvpPct > 0 ? Math.ceil(pvpTotal * (1 + pvpPct/100)) : pvpTotal;
    const comisionPvpPublico = pvpPublicoTotal - pvpTotal;
    return {costoHotelCat, costoBase, costoConMargen, costoConDescuento, netoTotal, adultosPagantes,
      netoAdultoPagantePorPax, netoNinoPorPax, netoTEPorPax, netoTotalGrupo, pvpAdulto, pvpNino, pvpTE, pvpTotal, comisionTotal,
      pvpPublicoAdulto, pvpPublicoNino, pvpPublicoTE, pvpPublicoTotal, comisionPvpPublico,
      hospedajeAdultoPorPax, hospedajeNinoPorPax, hospedajeTEPorPax};
  }

  const porCategoria = {};
  (categoriasConHotel.length ? categoriasConHotel : ['Única']).forEach(cat => {
    porCategoria[cat] = calcularSegmentos(costosHotelPorCategoria[cat] || 0);

  // "Principal": la primera categoría con hotel (o la única bolsa) — se usa
  // para mantener compatibilidad con el resto del cotizador (precio_pax,

  const costoHotel = principal.costoHotelCat;

// ---------- Itinerario (filas con hora/duración) ----------
const TIPOS_ITINERARIO = ['Inicio de tour','Punto de encuentro','Actividad','Traslado','Comida','Desayuno en hotel','Alojamiento','Tiempo libre','Fin de tour'];

// Suma minutos a una hora "HH:MM" y devuelve otra "HH:MM" (se permite pasar
// de medianoche envolviendo el reloj; para itinerarios de un día esto casi
// nunca pasa, pero no debe romperse si un tramo se corre de madrugada).
function sumarMinutos(horaStr, minutos){
  const [h,m] = (horaStr||'08:00').split(':').map(n=>parseInt(n,10)||0);
  let total = ((h*60+m) + (minutos||0)) % (24*60);
  if(total < 0) total += 24*60;
  const hh = Math.floor(total/60).toString().padStart(2,'0');
  const mm = (total%60).toString().padStart(2,'0');
  return `${hh}:${mm}`;
}

// Recalcula la hora de todas las filas posteriores a partir de la fila
// `desdeIdx`, en cadena, dentro del mismo día (si el día cambia, se corta
// la cadena — un día nuevo no hereda la hora del anterior). Es editable:
// si el usuario escribe una hora distinta a mano en una fila, esa fila
// vuelve a ser el nuevo punto de partida de la cadena hacia adelante.
function recalcularContinuidadItinerario(desdeIdx){
  for(let i = desdeIdx; i < itinerarioActual.length - 1; i++){
    const actual = itinerarioActual[i];
    const siguiente = itinerarioActual[i+1];
    if(siguiente.dia !== actual.dia) continue; // no encadena entre días distintos
    siguiente.hora = sumarMinutos(actual.hora, (actual.duracion||0) + (actual.traslado||0));
  }
}

// Tipos de actividad que se pueden llenar reutilizando algo ya elegido en
// "Proveedores/atractivos" (evita reescribir nombres y typos). Cada tipo
// apunta a la lista correspondiente de componentesElegidos y al campo con
// el nombre a mostrar.
function opcionesParaTipo(tipo){
  const c = componentesElegidos || {};
  const mapa = {
    'Comida': (c.restaurantes||[]).map(r=>r.nombre_comercial),
    'Desayuno en hotel': (c.hoteles||[]).map(h=>h.nombre_comercial),
    'Alojamiento': (c.hoteles||[]).map(h=>h.nombre_comercial),
    'Traslado': (c.transportes||[]).map(t=>t.nombre_comercial),
    'Actividad': (c.atractivos||[]).map(a=>a.nombre),
  };
  return (mapa[tipo] || []).filter(Boolean);
}

// Pedido de Héctor (08-ago sesión 3): "Inicio de tour" siempre debe quedar
// primero y "Fin de tour" siempre último — solo la hora se puede tocar en
// esas dos filas (el select de Tipo y el campo Día ya se deshabilitan en
// el render). Esta función se corre antes de cada render: reubica
// cualquier "Inicio de tour"/"Fin de tour" a su posición fija, reconvierte
// duplicados a "Actividad" (nunca puede haber dos), y les clava el día
// correcto (Inicio = día 1, Fin = último día del programa).
function normalizarInicioFinTour(){
  const idxInicio = itinerarioActual.findIndex(f => f.tipo === 'Inicio de tour');
  if(idxInicio > 0){
    const [fila] = itinerarioActual.splice(idxInicio, 1);
    itinerarioActual.unshift(fila);
  }
  itinerarioActual.forEach((f,i) => { if(i > 0 && f.tipo === 'Inicio de tour') f.tipo = 'Actividad'; });
  if(itinerarioActual[0] && itinerarioActual[0].tipo === 'Inicio de tour') itinerarioActual[0].dia = 1;

  const finIdxs = [];
  itinerarioActual.forEach((f,i) => { if(f.tipo === 'Fin de tour') finIdxs.push(i); });
  if(finIdxs.length){
    const ultimoIdx = finIdxs[finIdxs.length-1];
    const [filaFin] = itinerarioActual.splice(ultimoIdx, 1);
    itinerarioActual.push(filaFin);
    itinerarioActual.forEach((f,i) => { if(i !== itinerarioActual.length-1 && f.tipo === 'Fin de tour') f.tipo = 'Actividad'; });
    const totalDias = parseInt(document.getElementById('dis-dias')?.value || '1', 10) || 1;
    itinerarioActual[itinerarioActual.length-1].dia = totalDias;
  }
  // Pedido de Héctor (sesión 7, 15-ago-2026): el "Desayuno en hotel" debe
  // quedar SIEMPRE como la primera actividad de su día (después de "Inicio
  // de tour" si es el día 1) — antes el orden dependía de en qué momento se
  // había sincronizado/agregado cada bloque, así que a veces el desayuno
  // terminaba en medio o al final del día en el itinerario y en la
  // narrativa del voucher del pasajero. Se reordena por día, no globalmente
  // (cada día conserva su propio desayuno al frente, el resto del orden
  // dentro del día no se toca).
  const dias = [...new Set(itinerarioActual.map(f => f.dia))];
  dias.forEach(dia => {
    const idxDesayuno = itinerarioActual.findIndex(f => f.dia === dia && f.tipo === 'Desayuno en hotel');
    if(idxDesayuno === -1) return;
    const idxPrimeroDelDia = itinerarioActual.findIndex(f => f.dia === dia && f.tipo !== 'Inicio de tour');
    if(idxPrimeroDelDia === -1 || idxPrimeroDelDia === idxDesayuno) return;
    const [fila] = itinerarioActual.splice(idxDesayuno, 1);
    const nuevoIdx = itinerarioActual.findIndex(f => f.dia === dia && f.tipo !== 'Inicio de tour');
    itinerarioActual.splice(nuevoIdx === -1 ? itinerarioActual.length : nuevoIdx, 0, fila);
  });
}
// Fecha real del día N del tour, calculada desde "Fecha de inicio del
// tour" (campo opcional, dis-fecha-inicio) — si no está puesta, no se
// muestra ninguna fecha (solo "Día N", como antes).
function fechaParaDia(dia){
  const base = document.getElementById('dis-fecha-inicio')?.value;
  if(!base) return '';
  const d = new Date(base + 'T00:00:00');
  d.setDate(d.getDate() + (dia - 1));
  return d.toLocaleDateString('es-EC', {weekday:'short', day:'numeric', month:'short'});
}

function agregarFilaItinerario(datos){
  if(datos){
    itinerarioActual.push(datos);
    renderItinerario();
    return;
  }
  // Pedido de Héctor (08-ago sesión 3): antes siempre se agregaba al
  // final (heredando el último día). Ahora se agrega al día que Héctor
  // elija en el selector "Agregar al día", insertada en el lugar que le
  // corresponde dentro de ese día (no al final absoluto del itinerario).
  const totalDias = parseInt(document.getElementById('dis-dias')?.value || '1', 10) || 1;
  let diaDestino = parseInt(document.getElementById('dis-itin-nueva-dia')?.value || '', 10);
  if(isNaN(diaDestino) || diaDestino < 1) diaDestino = totalDias;
  const filasDelDia = itinerarioActual.filter(f => f.dia === diaDestino);
  const ultima = filasDelDia[filasDelDia.length-1];
  const hora = ultima ? sumarMinutos(ultima.hora, (ultima.duracion||0)+(ultima.traslado||0)) : '08:00';
  insertarFilaEnDia({dia:diaDestino, hora, actividad:'', duracion:30, traslado:0, tipo:'Actividad'});
  renderItinerario();
}
function quitarFilaItinerario(idx){ itinerarioActual.splice(idx,1); recalcularContinuidadItinerario(Math.max(0,idx-1)); renderItinerario(); }

// Inserta una fila nueva en el día que le corresponde, respetando que
// "Fin de tour" siempre quede último dentro de su día (Héctor,
// 08-ago-2026 sesión 3: Inicio/Fin de tour nunca se desplazan). Se busca la
// primera fila de un día posterior y se inserta justo antes; si no hay
// ninguna (es el último día), se inserta antes del "Fin de tour" de ese
// mismo día si existe, o al final si no.
function insertarFilaEnDia(fila){
  let insertIdx = itinerarioActual.findIndex(f => f.dia > fila.dia);
  if(insertIdx === -1){
    const ultima = itinerarioActual[itinerarioActual.length-1];
    insertIdx = (ultima && ultima.tipo === 'Fin de tour' && ultima.dia === fila.dia) ? itinerarioActual.length-1 : itinerarioActual.length;
  }
  itinerarioActual.splice(insertIdx, 0, fila);
  recalcularContinuidadItinerario(Math.max(0, insertIdx-1));
}
// Día que le corresponde a un componente elegido (hotel/restaurante/
// atractivo) para ubicarlo en el itinerario: si está asignado a una parada
// de la Ruta de provincias, usa el día de llegada de esa parada; si el
// programa no usa Ruta (1 provincia), todo cae en el día 1 por defecto —
// Héctor lo reubica a mano con ↑↓ o cambiando el campo "Día" de la fila.
function diaParaComponente(item){
  return (item.paradaIdx != null && rutaProvincias[item.paradaIdx]) ? rutaProvincias[item.paradaIdx].diaDesde : 1;
}

// Pedido de Héctor (08-ago-2026 sesión 3): al marcar un tipo de comida en
// un restaurante elegido, se agrega solo una fila al itinerario (mismo
// patrón que sincronizarDesayunosItinerario) — resincronización completa e
// idempotente marcada con _autoComida, nunca toca una fila puesta a mano.
function sincronizarComidasItinerario(){
  itinerarioActual = itinerarioActual.filter(f => !f._autoComida);
  (componentesElegidos.restaurantes || []).forEach(r => {
    const dia = diaParaComponente(r);
    (r.tiposComida || []).forEach(tc => {
      const etiqueta = `${r.nombre_comercial} — ${tc.tipo}`;
      const yaExiste = itinerarioActual.some(f => f.tipo === 'Comida' && f.dia === dia && f.actividad === etiqueta);
      if(yaExiste) return;
      insertarFilaEnDia({dia, hora:'13:00', actividad:etiqueta, duracion:45, traslado:0, tipo:'Comida', _autoComida:true});
    });
  });
  renderItinerario();
}
// Fila de "Alojamiento" (check-in) por cada hotel elegido, el día de
// llegada (diaDesde) — separada de sincronizarDesayunosItinerario(), que
// sigue encargándose solo del desayuno.
function sincronizarAlojamientosItinerario(){
  itinerarioActual = itinerarioActual.filter(f => !f._autoAlojamiento);
  (componentesElegidos.hoteles || []).forEach(h => {
    const dia = h.diaDesde || 1;
    const yaExiste = itinerarioActual.some(f => f.tipo === 'Alojamiento' && f.dia === dia && f.actividad === h.nombre_comercial);
    if(yaExiste) return;
    insertarFilaEnDia({dia, hora:'18:00', actividad:h.nombre_comercial, duracion:30, traslado:0, tipo:'Alojamiento', _autoAlojamiento:true});
  });
  renderItinerario();
}
// Fila de "Actividad" por cada atractivo elegido.
function sincronizarAtractivosItinerario(){
  itinerarioActual = itinerarioActual.filter(f => !f._autoAtractivo);
  (componentesElegidos.atractivos || []).forEach(a => {
    const dia = diaParaComponente(a);
    const yaExiste = itinerarioActual.some(f => f.tipo === 'Actividad' && f.dia === dia && f.actividad === a.nombre);
    if(yaExiste) return;
    insertarFilaEnDia({dia, hora:'10:00', actividad:a.nombre, duracion:60, traslado:0, tipo:'Actividad', _autoAtractivo:true});
  });
  renderItinerario();
}
// Corre las 3 sincronizaciones nuevas de una vez (más el desayuno, que ya
// existía) — se usa al agregar/quitar componentes y al cargar un programa.
function sincronizarTodoElItinerario(){
  sincronizarDesayunosItinerario();
  sincronizarAlojamientosItinerario();
  sincronizarComidasItinerario();
  sincronizarAtractivosItinerario();
}
//
// Regla aplicada (Héctor confirmó, ronda 12, sesión 10, 16-ago-2026): el
// desayuno se resta en TODOS los días que cubre el hotel (diaDesde …
// diaHasta, inclusive) — incluyendo el primer día, aunque sea un hotel de
// un solo día (diaDesde === diaHasta). Antes se excluía diaDesde asumiendo
// que el check-in era esa tarde/noche sin desayuno; Héctor confirmó que
// para este negocio el desayuno del día de llegada SÍ se resta.
//
// Es una resincronización completa e idempotente: borra todas las filas de
// desayuno que había agregado automáticamente antes (marcadas _autoDesayuno)
// y vuelve a poner las que correspondan ahora. Una fila de "Desayuno en
// hotel" puesta a mano por Héctor para ese mismo hotel/día NUNCA se toca ni
// se duplica.
function sincronizarDesayunosItinerario(){
  itinerarioActual = itinerarioActual.filter(f => !f._autoDesayuno);
  (componentesElegidos.hoteles || []).forEach(h => {
    if(!h.incluyeDesayuno) return;
    const desde = h.diaDesde || 1, hasta = h.diaHasta || desde;
    for(let dia = desde; dia <= hasta; dia++){
      const yaExiste = itinerarioActual.some(f => f.tipo === 'Desayuno en hotel' && f.dia === dia && f.actividad === h.nombre_comercial);
      if(yaExiste) continue;
      const fila = {dia, hora:'07:00', actividad:h.nombre_comercial, duracion:30, traslado:0, tipo:'Desayuno en hotel', _autoDesayuno:true};
      let insertIdx = itinerarioActual.findIndex(f => f.dia === dia);
      if(insertIdx === -1){ itinerarioActual.push(fila); insertIdx = itinerarioActual.length - 1; }
      else itinerarioActual.splice(insertIdx, 0, fila);
      recalcularContinuidadItinerario(insertIdx);
    }
  });
  renderItinerario();
}
// ---------- Margen fijo oculto (obs. 3, sesión 7, 14-ago-2026) ----------
// Cargo interno fijo (default 20%) que se suma al costo neto ANTES del
// margen de utilidad de Héctor. Global (no por programa), guardado en
// localStorage. Nunca se muestra como línea propia — solo el ícono ⚙
// junto a "Margen de utilidad" permite editarlo, y solo con un prompt().
const MARGEN_FIJO_OCULTO_KEY = 'smtre_margen_fijo_oculto';
function getMargenFijoOculto(){
  const v = parseFloat(localStorage.getItem(MARGEN_FIJO_OCULTO_KEY));
  return isNaN(v) ? 20 : v;
}
function editarMargenFijoOculto(){
  const actual = getMargenFijoOculto();
  const nuevo = prompt('Ajuste interno (%) — no visible en cotizaciones ni vouchers:', actual);
  if(nuevo === null) return;
  const n = parseFloat(nuevo);
  if(isNaN(n) || n < 0){ alert('Valor inválido'); return; }
  localStorage.setItem(MARGEN_FIJO_OCULTO_KEY, String(n));
  recalcularCosteo();
}
// ---------- Matriz de tiempos de traslado (30-jul) ----------
// Nunca se inventa un tiempo de traslado: solo se guarda lo que Héctor
// ingresa a mano en el campo "traslado" de una fila, y se reutiliza esa
// misma cifra la próxima vez que aparezcan los mismos dos lugares en
// cualquier programa. Guardado en localStorage (dato operativo propio,
// no dato de proveedor que necesite verificación).
function normalizarLugar(t){ return (t||'').trim().toLowerCase().replace(/\s+/g,' '); }
function claveTraslado(origen, destino){ return normalizarLugar(origen) + '→' + normalizarLugar(destino); }
function obtenerMatrizTraslados(){
  try { return JSON.parse(localStorage.getItem('smtre_matriz_traslados') || '{}'); } catch(e){ return {}; }
}
function guardarEnMatrizTraslados(origen, destino, minutos){
  if(!origen || !destino || !minutos) return;
  const m = obtenerMatrizTraslados();
  m[claveTraslado(origen, destino)] = minutos;
  localStorage.setItem('smtre_matriz_traslados', JSON.stringify(m));
}
function sugerirTraslados(){
  const m = obtenerMatrizTraslados();
  let sugeridos = 0; const sinDato = [];
  for(let i=0; i<itinerarioActual.length-1; i++){
    const actual = itinerarioActual[i], siguiente = itinerarioActual[i+1];
    if(actual.tipo === 'Fin de tour' || actual.traslado) continue; // no pisa un valor ya puesto
    const clave = claveTraslado(actual.actividad, siguiente.actividad);
    if(m[clave]){ actual.traslado = m[clave]; sugeridos++; }
    else sinDato.push(`${actual.actividad||'(sin nombre)'} → ${siguiente.actividad||'(sin nombre)'}`);
  }
  if(itinerarioActual.length) recalcularContinuidadItinerario(0);
  renderItinerario();
  if(sugeridos) alert(`Se completaron ${sugeridos} tiempo(s) de traslado con datos que ya habías ingresado antes.`);
  if(sinDato.length) alert(`Sin dato guardado todavía para estos tramos — ingrésalos una vez en el campo "traslado" y la app los recordará la próxima vez:\n\n${sinDato.slice(0,10).join('\n')}${sinDato.length>10?'\n…':''}`);
  else if(!sugeridos) alert('Todas las filas ya tienen un tiempo de traslado.');
}

function actualizarFilaItinerario(idx, campo, valor){
  itinerarioActual[idx][campo] = (campo==='duracion'||campo==='traslado'||campo==='dia') ? (parseInt(valor,10)||0) : valor;
  // Inicio de tour / Fin de tour no tienen duración propia (30-jul).
  if(campo==='tipo' && (valor==='Inicio de tour' || valor==='Fin de tour')){
    itinerarioActual[idx].duracion = 0;
  }
  if(campo==='traslado' && itinerarioActual[idx].traslado > 0){
    const siguiente = itinerarioActual[idx+1];
    if(siguiente) guardarEnMatrizTraslados(itinerarioActual[idx].actividad, siguiente.actividad, itinerarioActual[idx].traslado);
  }
  if(campo==='hora' || campo==='duracion' || campo==='traslado' || campo==='dia' || campo==='tipo'){
    recalcularContinuidadItinerario(idx);
    renderItinerario(); // BUG (30-jul): faltaba este render al cambiar 'tipo', por eso el
                         // selector "elegir de lo ya seleccionado" seguía mostrando las
                         // opciones del tipo anterior (ej. atractivos en una fila de Comida).
  }
}
function actualizarActividadDesdeOpcion(idx, valor){
  if(!valor) return;
  itinerarioActual[idx].actividad = valor;
  renderItinerario();
}
// Pedido de Héctor (08-ago sesión 3): reordenar escribiendo un número en
// vez de solo con ↑↓. Nunca puede invadir la posición de Inicio de tour
// (siempre índice 0) ni la de Fin de tour (siempre la última).
function moverFilaAOrden(idx, valor){
  const fila = itinerarioActual[idx];
  if(fila.tipo === 'Inicio de tour' || fila.tipo === 'Fin de tour'){ renderItinerario(); return; }
  let destino = parseInt(valor, 10);
  if(isNaN(destino)){ renderItinerario(); return; }
  destino = destino - 1;
  const tieneInicio = itinerarioActual[0]?.tipo === 'Inicio de tour';
  const tieneFin = itinerarioActual[itinerarioActual.length-1]?.tipo === 'Fin de tour';
  const minIdx = tieneInicio ? 1 : 0;
  const maxIdx = tieneFin ? itinerarioActual.length - 2 : itinerarioActual.length - 1;
  destino = Math.max(minIdx, Math.min(maxIdx, destino));
  if(destino === idx){ renderItinerario(); return; }
  const [f] = itinerarioActual.splice(idx, 1);
  itinerarioActual.splice(destino, 0, f);
  recalcularContinuidadItinerario(Math.min(idx, destino));
  renderItinerario();
}
function moverFilaItinerario(idx, direccion){
  const fila = itinerarioActual[idx];
  // Pedido de Héctor (08-ago-2026 sesión 3): "Inicio de tour" y "Fin de tour"
  // nunca se pueden reordenar — deben quedar fijos como primera/última fila.
  if(fila.tipo === 'Inicio de tour' || fila.tipo === 'Fin de tour') return;
  const nuevo = idx + direccion;
  if(nuevo < 0 || nuevo >= itinerarioActual.length) return;
  const filaDestino = itinerarioActual[nuevo];
  // Tampoco se puede empujar otra fila hacia la posición de Inicio/Fin.
  if(filaDestino.tipo === 'Inicio de tour' || filaDestino.tipo === 'Fin de tour') return;
  [itinerarioActual[idx], itinerarioActual[nuevo]] = [itinerarioActual[nuevo], itinerarioActual[idx]];
  recalcularContinuidadItinerario(Math.min(idx,nuevo));
  renderItinerario();
}
function renderItinerario(){
  const cont = document.getElementById('dis-itinerario-filas');
  if(!cont) return;
  normalizarInicioFinTour();
  cont.innerHTML = itinerarioActual.map((f,idx) => {
    const opciones = opcionesParaTipo(f.tipo);
    const fechaTxt = fechaParaDia(f.dia);
    return `
    <div class="fila-itin-card">
      <div class="fila-itin-top">
        <div class="campo-mini"><label>Orden</label><input type="number" min="1" value="${idx+1}" title="Nº de orden — escribe la posición y la fila se mueve ahí" style="${(f.tipo==='Inicio de tour'||f.tipo==='Fin de tour')?'opacity:.35;':''}" ${(f.tipo==='Inicio de tour'||f.tipo==='Fin de tour')?'disabled':''} onchange="moverFilaAOrden(${idx},this.value)"></div>
        <div class="campo-mini"><label>Día</label><input type="number" min="1" value="${f.dia}" title="Día" ${(f.tipo==='Inicio de tour'||f.tipo==='Fin de tour')?'disabled style="opacity:.35;"':''} onchange="actualizarFilaItinerario(${idx},'dia',this.value)"></div>
        <div class="campo-mini"><label>Fecha</label><span class="badge-fecha${fechaTxt?'':' vacia'}">${fechaTxt||'—'}</span></div>
        <div class="campo-mini"><label>Hora</label><input type="time" value="${f.hora}" title="Hora (se recalcula sola en las filas siguientes; edítala si la necesitas distinta)" onchange="actualizarFilaItinerario(${idx},'hora',this.value)"></div>
        <div class="campo-mini"><label>Tipo de actividad</label><select title="Tipo de actividad" ${(f.tipo==='Inicio de tour'||f.tipo==='Fin de tour')?'disabled style="opacity:.35;"':''} onchange="actualizarFilaItinerario(${idx},'tipo',this.value)">
          ${TIPOS_ITINERARIO.map(t=>`<option ${f.tipo===t?'selected':''}>${t}</option>`).join('')}
        </select></div>
        <div class="campo-mini"><label>Duración (min)</label><input type="number" min="0" value="${f.duracion}" title="Duración (min)" ${(f.tipo==='Inicio de tour'||f.tipo==='Fin de tour')?'disabled style="opacity:.35;"':''} onchange="actualizarFilaItinerario(${idx},'duracion',this.value)"></div>
        <div class="campo-mini"><label>Traslado (min)</label><input type="number" min="0" value="${f.traslado}" title="Traslado (min)" onchange="actualizarFilaItinerario(${idx},'traslado',this.value)"></div>
        <div class="campo-mini"><label>Mover</label><div style="display:flex;gap:2px;">${(f.tipo==='Inicio de tour'||f.tipo==='Fin de tour') ? `<span title="Inicio/Fin de tour no se pueden reordenar" style="opacity:.3;padding:0 4px;">↑ ↓</span>` : `<button class="quitar" style="color:var(--paramo);" onclick="moverFilaItinerario(${idx},-1)">↑</button><button class="quitar" style="color:var(--paramo);" onclick="moverFilaItinerario(${idx},1)">↓</button>`}</div></div>
        <div class="campo-mini"><label>&nbsp;</label><button class="quitar" title="Quitar esta fila" onclick="quitarFilaItinerario(${idx})">✕</button></div>
      </div>
      <div class="fila-itin-bottom">
        ${opciones.length ? `<select style="max-width:220px;" onchange="actualizarActividadDesdeOpcion(${idx}, this.value)">
          <option value="">— elegir de lo ya seleccionado —</option>
          ${opciones.map(o=>`<option value="${o}">${o}</option>`).join('')}
        </select>` : ''}
        <input type="text" value="${escapeHtml(f.actividad)}" placeholder="Describe la actividad" onchange="actualizarFilaItinerario(${idx},'actividad',this.value)">
      </div>
    </div>`;
  }).join('');
}

function agregarItemLista(tipo){ (tipo==='incluye'?incluyeActual:noIncluyeActual).push(''); renderListaEditable(tipo); }
function quitarItemLista(tipo, idx){ (tipo==='incluye'?incluyeActual:noIncluyeActual).splice(idx,1); renderListaEditable(tipo); }
function actualizarItemLista(tipo, idx, valor){ (tipo==='incluye'?incluyeActual:noIncluyeActual)[idx] = valor; }
function renderListaEditable(tipo){
  const arr = tipo==='incluye'?incluyeActual:noIncluyeActual;
  const cont = document.getElementById(tipo==='incluye'?'dis-incluye':'dis-no-incluye');
  if(!cont) return;
  cont.innerHTML = arr.map((v,idx)=>`<div class="item-editable"><input type="text" value="${escapeHtml(v)}" onchange="actualizarItemLista('${tipo}',${idx},this.value)"><button class="quitar" onclick="quitarItemLista('${tipo}',${idx})">✕</button></div>`).join('');
}
// Obs. 2/4 de cambios_tur.docx: la regla de auto-incluir Seguro/Souvenir
// (listaIncluyeCompleta/noIncluyeParaDocumento) solo se aplicaba al generar
// los 3 documentos finales — Héctor la esperaba también en el panel
// editable de Incluye/No incluye de Diseñar Programa (donde la probó).
// Se llama desde recalcularCosteo() cada vez que cambian los campos de
// Seguro/Souvenir. Mismo criterio: solo agrega cuando hay valor > 0, nunca
// quita si el valor vuelve a 0 (el usuario pudo haber personalizado el
// texto o quererlo ahí de todas formas).
function sincronizarSeguroSouvenirIncluye(seguro, souvenir){
  let cambio = false;
  if(seguro > 0 && !incluyeActual.some(i=>(i||'').toLowerCase().includes('seguro'))){
    incluyeActual.push('Seguro de asistencia de viajes'); cambio = true;
  }
  if(seguro > 0){
    const antes = noIncluyeActual.length;
    noIncluyeActual = noIncluyeActual.filter(i => !(i||'').toLowerCase().includes('seguro'));
    if(noIncluyeActual.length !== antes) cambio = true;
  }
  if(souvenir > 0 && !incluyeActual.some(i=>(i||'').toLowerCase().includes('souvenir'))){
    incluyeActual.push('Souvenir de bienvenida por pasajero'); cambio = true;
  }
  if(souvenir > 0){
    const antes = noIncluyeActual.length;
    noIncluyeActual = noIncluyeActual.filter(i => !(i||'').toLowerCase().includes('souvenir'));
    if(noIncluyeActual.length !== antes) cambio = true;
  }
  if(cambio){ renderListaEditable('incluye'); renderListaEditable('noIncluye'); }
}

async function registrarAperturaPrograma(id){
  const s = obtenerSesion();
  if(!s || !SUPABASE_ACTIVO) return;
  try{

function calcularSimuladorLicenciamiento(){
  const cont = document.getElementById('sim-resultado');
  const num = id => parseFloat(document.getElementById(id).value) || 0;
  const costoFijo = num('sim-costo-fijo');
  const horasSoporte = num('sim-horas-soporte');
  const tarifaHora = num('sim-tarifa-hora');
  const precioUnica = num('sim-precio-unica');
  const precioMensual = num('sim-precio-mensual');
  const churn = Math.min(num('sim-churn'), 100) / 100;
  const numAgencias = Math.max(1, Math.round(num('sim-num-agencias') || 5));
  const horizonte = Math.max(1, Math.round(num('sim-horizonte') || 24));

  if(!precioUnica && !precioMensual){
    cont.innerHTML = '<div style="font-size:12px;color:var(--critico);">Pon al menos un precio (única o mensual) para calcular.</div>';
    return;
  }

  const costoFijoTotal = costoFijo * horizonte;
  const costoSoporteMensualPorAgencia = horasSoporte * tarifaHora;

  // Modelo A: licencia única — se asume que todas las agencias compran
  // en el mes 1 y siguen usando (y pidiendo soporte) todo el horizonte.
  const ingresoUnica = numAgencias * precioUnica;
  const costoVariableUnica = numAgencias * costoSoporteMensualPorAgencia * horizonte;
  const utilidadUnica = ingresoUnica - costoVariableUnica - costoFijoTotal;

  // Modelo B: suscripción — con abandono (churn) mensual compuesto.
  let activas = numAgencias;
  let ingresoSuscripcion = 0, costoVariableSuscripcion = 0;
  for(let m = 1; m <= horizonte; m++){
    ingresoSuscripcion += activas * precioMensual;
    costoVariableSuscripcion += activas * costoSoporteMensualPorAgencia;
    activas = activas * (1 - churn);
  }
  const utilidadSuscripcion = ingresoSuscripcion - costoVariableSuscripcion - costoFijoTotal;
  const activasFinal = activas;

  const mesesEquivalentes = precioMensual > 0 ? (precioUnica / precioMensual) : null;

  const money = v => '$' + v.toLocaleString('es-EC', {minimumFractionDigits:2, maximumFractionDigits:2});

  cont.innerHTML = `
    <table style="width:100%;font-size:12.5px;border-collapse:collapse;">
      <tr style="text-align:left;border-bottom:1px solid var(--linea);"><th style="padding:5px;">Modelo</th><th style="padding:5px;">Ingreso (${horizonte} meses)</th><th style="padding:5px;">Costo estimado</th><th style="padding:5px;">Utilidad neta</th><th style="padding:5px;">Utilidad / agencia</th></tr>
      <tr style="border-bottom:1px solid var(--linea);"><td style="padding:5px;"><b>Licencia única</b></td><td style="padding:5px;">${money(ingresoUnica)}</td><td style="padding:5px;">${money(costoVariableUnica+costoFijoTotal)}</td><td style="padding:5px;">${money(utilidadUnica)}</td><td style="padding:5px;">${money(utilidadUnica/numAgencias)}</td></tr>
      <tr><td style="padding:5px;"><b>Suscripción mensual</b></td><td style="padding:5px;">${money(ingresoSuscripcion)}</td><td style="padding:5px;">${money(costoVariableSuscripcion+costoFijoTotal)}</td><td style="padding:5px;">${money(utilidadSuscripcion)}</td><td style="padding:5px;">${money(utilidadSuscripcion/numAgencias)}</td></tr>
    </table>
    <div style="font-size:11.5px;color:var(--tinta-suave);margin-top:10px;line-height:1.6;">
      ${mesesEquivalentes !== null ? `Al precio mensual puesto, la licencia única equivale a <b>${mesesEquivalentes.toFixed(1)} meses</b> de suscripción pagados de una vez.<br>` : ''}
      Con ${(churn*100).toFixed(1)}% de abandono mensual, de las ${numAgencias} agencias que empiezan suscritas quedarían <b>${activasFinal.toFixed(1)}</b> activas al mes ${horizonte}.<br>
      Costo operativo fijo asumido en ambos modelos: ${money(costoFijoTotal)} en total (${money(costoFijo)}/mes × ${horizonte} meses). Soporte estimado en ${money(costoSoporteMensualPorAgencia)}/agencia/mes.
    </div>`;
}
