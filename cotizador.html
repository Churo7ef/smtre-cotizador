<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<!-- Sesión 21 (31-ago-2026): CSP vía meta tag, pendiente de la auditoría de
     sesión 20. Restringe a qué dominios se puede conectar/cargar recursos
     (Supabase propio + Google Fonts), bloquea <object>/<embed> y cambios de
     <base>/envío de formularios fuera del propio archivo.
     LIMITACIÓN CONOCIDA: script-src necesita 'unsafe-inline' porque toda la
     app usa un único bloque de JavaScript inline y cientos de atributos
     onclick/onchange — no es un CSP que por sí solo bloquee ejecución de
     JavaScript inyectado vía XSS, solo reduce a dónde puede exfiltrar datos
     o qué puede cargar. Y 'frame-ancestors' (protección contra clickjacking) NO funciona puesto
     por <meta> — la especificación exige que venga como cabecera HTTP real,
     así que sigue dependiendo del hosting final (mismo punto ciego que ya
     señalaba la auditoría de sesión 20). -->
<!-- Sesión 22 (1-sep-2026): CSP ampliado para permitir el SDK de Sentry
     (monitoreo de errores) — se agregó browser.sentry-cdn.com a script-src
     y el dominio de ingesta del proyecto a connect-src. Ver también el
     bloque de Sentry.init() antes de </head>. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://browser.sentry-cdn.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://zbwgpytiuxkhbtpxrqsd.supabase.co https://api.qrserver.com; connect-src 'self' https://zbwgpytiuxkhbtpxrqsd.supabase.co https://o4512012850233344.ingest.us.sentry.io https://browser.sentry-cdn.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Cotizador de Turismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --basalto:#1E2A2A;
    --basalto-2:#27403C;
    --papel:#FAF9F5;
    --papel-2:#EFEDE7;
    --grana:#B5654F;
    --grana-2:#8F4F3D;
    --paramo:#5B8C6B;
    --oro:#C79A3E;
    --tinta:#1A1A1A;
    --tinta-suave:#5C5C58;
    --linea:#E3E1DA;
    --critico:#B0433A;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--basalto);
    color:var(--papel);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--oro);color:var(--tinta);}

  .app{
    display:grid;
    grid-template-columns: 360px 1fr;
    min-height:100vh;
  }
  @media (max-width: 880px){
    .app{grid-template-columns: 1fr;}
  }

  /* ---------- HEADER / MASTHEAD ---------- */
  .masthead{
    grid-column:1/-1;
    padding:28px 32px 20px;
    border-bottom:1px solid rgba(250,249,245,0.14);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .masthead .brand{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.01em;
  }
  .masthead .brand small{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--oro);
    margin-top:2px;
  }
  .masthead .estado{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:rgba(250,249,245,0.6);
    text-align:right;
    line-height:1.5;
  }
  .masthead .estado b{color:var(--papel);}

  .tabs{display:flex;gap:8px;order:3;flex-basis:100%;margin-top:4px;}
  @media (min-width:881px){.tabs{flex-basis:auto;order:0;margin-top:0;}}
  .tab-btn{
    background:transparent;border:1px solid rgba(250,249,245,0.28);color:rgba(250,249,245,0.75);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;
    padding:7px 14px;border-radius:var(--radius);cursor:pointer;
  }
  .tab-btn.activo{background:var(--oro);border-color:var(--oro);color:var(--tinta);font-weight:600;}
  .tab-btn:hover:not(.activo){border-color:var(--oro);color:var(--oro);}

  /* Menús desplegables agrupados de la barra superior (sesión 26) */
  .tabs-dropdown{position:relative;}
  .tabs-dropdown > .tab-btn .caret{font-size:9px;margin-left:3px;opacity:0.7;}
  .tabs-dropdown-panel{
    display:none;flex-direction:column;gap:3px;
    position:absolute;top:calc(100% + 6px);left:0;
    background:var(--basalto-2);border:1px solid rgba(250,249,245,0.18);
    border-radius:var(--radius);min-width:220px;padding:6px;z-index:90;
    box-shadow:0 10px 28px rgba(0,0,0,0.4);
  }
  .tabs-dropdown.abierto .tabs-dropdown-panel{display:flex;}
  .tabs-dropdown-panel .tab-btn{width:100%;text-align:left;}

  /* ---------- COMPONENTES COMPARTIDOS (usados por Diseñar Programa) ---------- */
  .chip{
    border:1px solid var(--linea);border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer;
    background:#fff;user-select:none;
  }
  .chip.on{background:var(--paramo);border-color:var(--paramo);color:#fff;}
  .cobertura-aviso{
    background:#FBEAE6;border:1px solid var(--critico);color:var(--grana-2);
    padding:14px 16px;border-radius:var(--radius);font-size:13.5px;line-height:1.55;margin-bottom:20px;
  }
  .hueco{color:var(--critico);font-style:italic;}

  /* ---------- DISEÑADOR DE PROGRAMA ---------- */
  .dis-grid{display:grid;grid-template-columns:1fr 380px;gap:28px;align-items:start;}
  @media (max-width:1000px){.dis-grid{grid-template-columns:1fr;}}
  .dis-seccion{background:var(--papel-2);border:1px solid var(--linea);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .dis-seccion h2{font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:0.1em;color:var(--tinta-suave);margin:0 0 12px;}
  .fila-itin{display:grid;grid-template-columns:55px 70px 1fr 90px 90px 130px 30px;gap:6px;align-items:center;margin-bottom:6px;}
  .fila-itin-card{border:1px solid var(--linea);border-radius:var(--radius);padding:8px 9px;margin-bottom:8px;background:var(--basalto-2);}
  .fila-itin-top{display:grid;grid-template-columns:44px 56px 78px 84px 1fr 66px 66px 50px 26px;gap:6px;align-items:end;margin-bottom:6px;}
  .fila-itin-top .campo-mini{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .fila-itin-top .campo-mini label{font-size:10px;font-weight:600;letter-spacing:0.02em;color:rgba(250,249,245,0.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fila-itin-bottom{display:flex;gap:6px;align-items:center;}
  .fila-itin-bottom input[type="text"]{flex:1;}
  .fila-itin-card input, .fila-itin-card select, .fila-itin-top input, .fila-itin-top select{padding:7px 8px;font-size:13px;border:1px solid var(--linea);border-radius:var(--radius);width:100%;color:var(--tinta);background:var(--papel);}
  .fila-itin-top .badge-fecha{font-size:10.5px;font-weight:600;color:var(--oro);background:var(--basalto);border:1px solid var(--linea);border-radius:var(--radius);padding:6px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fila-itin-top .badge-fecha.vacia{visibility:hidden;}
  .fila-itin input, .fila-itin select{padding:6px 7px;font-size:12.5px;border:1px solid var(--linea);border-radius:var(--radius);width:100%;}
  .fila-itin .quitar{background:none;border:none;color:var(--critico);cursor:pointer;font-size:16px;}
  .lista-editable{display:flex;flex-direction:column;gap:6px;}
  .item-editable{display:flex;gap:6px;align-items:center;}
  .item-editable input{flex:1;padding:6px 8px;font-size:13px;border:1px solid var(--linea);border-radius:var(--radius);}
  .item-editable .quitar{background:none;border:none;color:var(--critico);cursor:pointer;font-size:16px;flex-shrink:0;}
  .btn-mini{background:var(--paramo);color:#fff;border:none;padding:6px 12px;font-size:12px;border-radius:var(--radius);cursor:pointer;}
  .tarjeta-programa{border:1px solid var(--linea);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;background:#fff;}
  .tarjetas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start;}
  .tarjetas-grid .tarjeta-programa{margin-bottom:0;}
  .tarjeta-programa h4{font-family:'Fraunces',serif;font-size:16px;margin:0 0 4px;}
  .tarjeta-programa .meta{font-size:12px;color:var(--tinta-suave);margin-bottom:8px;}
  .tarjeta-programa .acciones{display:flex;gap:6px;flex-wrap:wrap;}
  .tarjeta-programa .acciones button{font-size:11.5px;padding:5px 10px;border-radius:var(--radius);border:1px solid var(--linea);background:#fff;cursor:pointer;}
  .tarjeta-programa .acciones button:hover{border-color:var(--grana);color:var(--grana);}
  .progreso-barra{background:var(--linea);border-radius:20px;height:8px;overflow:hidden;margin:6px 0;}
  .progreso-fill{background:var(--paramo);height:100%;transition:width .2s;}
  .badge-estado{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:10px;font-weight:600;}
  .badge-estado.abierto{background:#DCEEE1;color:var(--paramo);}
  .badge-estado.completo{background:#F2E6C9;color:#8A6A2E;}
  .badge-estado.cerrado{background:#E4E4E4;color:#555;}
  .badge-estado.cancelado{background:#FBEAE6;color:var(--grana-2);}
  .tabla-reservas{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;}
  .tabla-reservas th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--tinta-suave);border-bottom:1px solid var(--linea);padding:4px 6px;}
  .tabla-reservas td{padding:5px 6px;border-bottom:1px solid var(--linea);}
  .doc-print{background:#fff;color:var(--tinta);border:1px solid var(--tinta);padding:30px;max-width:820px;margin:0 auto;}
  .doc-print h1{font-family:'Fraunces',serif;font-size:24px;margin:0 0 4px;}
  .doc-print .dia-titulo{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin:16px 0 6px;border-bottom:1px solid var(--linea);padding-bottom:4px;}
  .doc-print .hora-item{font-size:13px;margin-bottom:4px;display:flex;gap:10px;}
  .doc-print .hora-item .h{font-family:'IBM Plex Mono',monospace;color:var(--tinta-suave);width:48px;flex-shrink:0;}
  .doc-print .firma-linea{margin-top:50px;border-top:1px solid var(--tinta);padding-top:6px;width:280px;font-size:12px;}
  /* Sesión 27 (pendiente #3 del handoff 26): reduce cortes feos de página en
     PDFs largos (programas de varios días). html2pdf.js respeta estas reglas
     CSS gracias a pagebreak.mode incluir 'css'. No elimina el riesgo al
     100% (una tabla más alta que una página siempre se corta en algún punto),
     pero evita que el título de un día quede solo al final de una página con
     su contenido en la siguiente, y evita que una fila de tabla se parta a
     la mitad. */
  #doc-editable-area table, #doc-editable-area tr{page-break-inside:avoid;break-inside:avoid;}
  #doc-editable-area .dia-titulo{page-break-after:avoid;break-after:avoid;page-break-inside:avoid;break-inside:avoid;}


  /* ---------- RAIL: LISTA DE PROGRAMAS ---------- */
  .rail{
    background:var(--basalto);
    border-right:1px solid rgba(250,249,245,0.14);
    padding:20px 16px 40px;
    overflow-y:auto;
    max-height:calc(100vh - 96px);
  }
  .rail-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:rgba(250,249,245,0.55);
    padding:4px 8px 12px;
  }
  .ticket{
    background:var(--basalto-2);
    border:1px solid rgba(250,249,245,0.1);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
    position:relative;
  }
  .ticket:hover{border-color:var(--oro);}
  .ticket.activo{border-color:var(--oro); background:var(--basalto-2);}
  .ticket.bloqueado{opacity:0.62;}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ticket-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--oro);
    letter-spacing:0.04em;
  }
  .ticket-nombre{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    line-height:1.25;
    margin-top:3px;
  }
  .ticket-meta{
    font-size:11.5px;
    color:rgba(250,249,245,0.55);
    margin-top:6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .sello-mini{
    width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--oro);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;font-weight:600;color:var(--oro);
    flex-shrink:0;
  }
  .ticket.bloqueado .sello-mini{border-color:var(--critico);color:var(--critico);}

  /* ---------- MAIN: COTIZADOR ---------- */
  .main{
    padding:32px 40px 60px;
    background:var(--papel);
    color:var(--tinta);
    overflow-y:auto;
    max-height:calc(100vh - 96px);
  }
  .vacio{
    height:100%;min-height:400px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--tinta-suave);
    text-align:center;
  }
  .vacio .glifo{font-family:'Fraunces',serif;font-size:56px;color:var(--linea);margin-bottom:6px;}

  .panel-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:2px solid var(--tinta);
    padding-bottom:18px;margin-bottom:24px;flex-wrap:wrap;gap:16px;
  }
  .panel-header h1{
    font-family:'Fraunces',serif;font-size:30px;font-weight:700;margin:0 0 6px;
    line-height:1.1;
  }
  .panel-header .sub{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--tinta-suave);
  }

  .sello{
    width:88px;height:88px;border-radius:50%;
    border:2.5px solid var(--oro);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    position:relative;
    flex-shrink:0;
  }
  .sello::before{
    content:'';position:absolute;inset:5px;border:1px solid var(--oro);border-radius:50%;
  }
  .sello .num{font-size:26px;font-weight:700;color:var(--grana);}
  .sello .etq{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:0.08em;color:var(--tinta-suave);text-transform:uppercase;}
  .sello.bloqueado{border-color:var(--critico);}
  .sello.bloqueado::before{border-color:var(--critico);}
  .sello.bloqueado .num{color:var(--critico);}

  .aviso-critico{
    background:#FBEAE6;border:1px solid var(--critico);color:var(--grana-2);
    padding:14px 16px;border-radius:var(--radius);font-size:13.5px;line-height:1.5;
    margin-bottom:24px;
  }
  .aviso-critico b{color:var(--critico);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  @media (max-width:700px){.grid-2{grid-template-columns:1fr;}}

  .bloque{margin-bottom:28px;}
  .bloque h2{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-transform:uppercase;
    letter-spacing:0.12em;color:var(--tinta-suave);margin:0 0 12px;
    border-bottom:1px solid var(--linea);padding-bottom:6px;
  }

  .campo{margin-bottom:14px;}
  .campo label{
    display:block;font-size:12px;color:var(--tinta-suave);margin-bottom:5px;
    font-weight:500;
  }
  .campo input, .campo select{
    width:100%;padding:9px 11px;font-family:'Inter',sans-serif;font-size:14.5px;
    border:1px solid var(--linea);border-radius:var(--radius);background:#fff;color:var(--tinta);
  }
  .campo input:focus, .campo select:focus{outline:2px solid var(--paramo);outline-offset:1px;}

  /* Pedido de Héctor (ronda 10): los .campo ocupaban todo el ancho de la
     columna aunque el valor fuera corto ("2", "Azuay", "09"), desperdiciando
     espacio. Estas clases agrupan varios campos cortos en una misma fila,
     cada uno con el ancho mínimo que necesita su contenido, y siguen
     apilándose en móvil/columnas angostas. */
  .fila-compacta{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end;}
  .fila-compacta > .campo{flex:1 1 170px;margin-bottom:14px;min-width:0;}
  .fila-compacta > .campo.campo-corto{flex:0 1 92px;}
  .fila-compacta > .campo.campo-medio{flex:1 1 130px;}
  .fila-compacta > .campo.campo-ancho{flex:2 1 220px;}

  .precio-caja{
    background:var(--basalto);color:var(--papel);
    padding:18px 20px;border-radius:var(--radius);
  }
  .precio-caja .fila{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;}
  .precio-caja .fila.fila-3col{display:grid;grid-template-columns:1fr auto 75px;gap:10px;align-items:baseline;}
  .precio-caja .fila.fila-3col span:nth-child(2){font-family:'IBM Plex Mono',monospace;text-align:right;}
  .precio-caja .fila.fila-3col span:nth-child(3){font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--tinta-suave);font-size:12px;}
  .precio-caja .fila.total{
    border-top:1px solid rgba(250,249,245,0.25);margin-top:8px;padding-top:12px;
    font-family:'Fraunces',serif;font-size:20px;font-weight:700;
  }
  .precio-caja .fila span:last-child{font-family:'IBM Plex Mono',monospace;}
  .precio-caja .nota{font-size:11px;color:rgba(250,249,245,0.55);margin-top:10px;line-height:1.5;}

  .btn{
    background:var(--grana);color:var(--papel);border:none;
    padding:12px 22px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    border-radius:var(--radius);cursor:pointer;letter-spacing:0.01em;
    transition:background .15s ease;
  }
  .btn:hover{background:var(--grana-2);}
  .btn:disabled{background:var(--linea);color:var(--tinta-suave);cursor:not-allowed;}
  .btn.fantasma{background:transparent;border:1px solid var(--tinta);color:var(--tinta);}
  .btn.fantasma:hover{background:var(--tinta);color:var(--papel);}

  /* ---------- VOUCHER GENERADO ---------- */
  .voucher{
    margin-top:28px;border:1.5px solid var(--tinta);border-radius:var(--radius);
    padding:26px 28px;background:#fff;position:relative;
  }
  .voucher-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:1px dashed var(--linea);padding-bottom:14px;margin-bottom:16px;
  }
  .voucher-top .codigo{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tinta-suave);}
  .voucher h3{font-family:'Fraunces',serif;font-size:20px;margin:2px 0 0;}
  .voucher-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:13.5px;margin-bottom:16px;}
  .voucher-grid .k{color:var(--tinta-suave);}
  .voucher-total{
    background:var(--papel-2);padding:14px 16px;border-radius:var(--radius);
    display:flex;justify-content:space-between;align-items:center;
  }
  .voucher-total .cifra{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--grana);}
  .voucher-firma{margin-top:20px;font-size:11px;color:var(--tinta-suave);font-family:'IBM Plex Mono',monospace;}

  @media print{
    .rail, .masthead, .btn.fantasma, .no-print{display:none !important;}
    .main{max-height:none;overflow:visible;padding:0;}
    body{background:#fff;}
    .app{display:block;}
  }
</style>
<!-- Sesión 26: librerías para exportar Excel real (.xlsx, no CSV) y PDF
     real de los vouchers, pedidas por Héctor tras la auditoría de costeo/
     vouchers. Sesión 27: se agregó el hash SRI de SheetJS 0.18.5, calculado
     (SHA-512) sobre dist/xlsx.full.min.js del paquete oficial `xlsx@0.18.5`
     publicado en el registro de npm — cdnjs sirve ese mismo build, así que
     debería coincidir byte a byte, pero no se pudo verificar descargando
     directamente desde cdnjs.cloudflare.com (dominio no accesible desde
     este entorno). Si el Excel deja de exportarse tras esta actualización,
     lo más probable es un choque de SRI: hay que abrir la consola del
     navegador (buscará un error de "Failed to find a valid digest") y, si
     aparece, quitar el atributo integrity de esta línea como solución
     inmediata. html2pdf.js SÍ lleva SRI, tomado directamente del README
     oficial del proyecto. -->

<script>
// ============================================================
// CONEXIÓN A SUPABASE — pega tus credenciales aquí para activarla.
// Mientras SUPABASE_URL quede como está, el cotizador sigue funcionando
// 100% con los datos embebidos de abajo (nada se rompe si no la llenas).
// Dónde conseguirlas: Supabase → Project Settings → API → Project URL
// y "anon public" key. La anon key está diseñada para ir en código de
// navegador — es segura siempre que tengas Row Level Security activado.
// ============================================================
const SUPABASE_URL = 'https://zbwgpytiuxkhbtpxrqsd.supabase.co';
console.log('%ccotizador.html — build sesión 32, 12-sep-2026 (LOPDP consentimiento/retención, limpieza de tablas huérfanas, base de licenciamiento)', 'color:#b5651d;font-weight:bold;');
// Marca de identificación de copia (sesión 32). No se usa en ninguna lógica
// todavía — es solo una etiqueta inerte para poder identificar, si algún día
// aparece una copia filtrada circulando, de qué distribución salió. En la
// copia MAESTRA (esta, la que edita Héctor) queda como 'MAESTRA'. Cada copia
// que se publique/distribuya a una agencia debe cambiar este valor por un
// identificador propio antes de publicarla (ej. 'AG-001-nombreagencia').
const __COPIA_ID__ = 'MAESTRA';
const SUPABASE_ANON_KEY = 'sb_publishable_29DIRSWLg5xPoaYj9wzssg_Nr7G86rp';
const SUPABASE_ACTIVO = SUPABASE_URL.startsWith('https://');

// Al cargar, si hay conexión activa, refresca las tarifas de habitación
// de los hoteles de Tungurahua con lo que exista en la base real —
// así el cotizador refleja lo que se cargue vía la plantilla Excel sin
// tocar este archivo. Si Supabase no responde o no está configurado,
// se sigue funcionando con normalidad, solo sin verificación de conexión.
async function supabaseFetch(tabla, query){
  if(!SUPABASE_ACTIVO) return {ok:false, motivo:'no configurado'};
  await asegurarSesionVigente();
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?${query}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${authToken()}` }
    });
    const cuerpo = await res.json().catch(() => null);
    if(!res.ok){
      console.warn('Supabase respondió', res.status, cuerpo);
      return {ok:false, motivo: (cuerpo && (cuerpo.message || cuerpo.error)) || `HTTP ${res.status}`};
    }
    if(!Array.isArray(cuerpo)){
      console.warn('Supabase no devolvió una lista:', cuerpo);
      return {ok:false, motivo: (cuerpo && cuerpo.message) || 'respuesta inesperada'};
    }
    return {ok:true, data: cuerpo};
  }catch(e){
    console.warn('No se pudo conectar a Supabase:', e);
    return {ok:false, motivo: 'red/CORS: ' + e.message};
  }
}

// Escritura genérica a Supabase (POST/PATCH/DELETE) — evita repetir los
// mismos headers en cada función que crea/edita/borra filas.
async function supabaseWrite(tabla, metodo, cuerpo, query){
  if(!SUPABASE_ACTIVO) return {ok:false, motivo:'no configurado'};
  await asegurarSesionVigente();
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}${query?('?'+query):''}`, {
      method: metodo,
      headers: {
        apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${authToken()}`,
        'Content-Type':'application/json',
        Prefer: metodo==='POST' ? 'return=representation' : 'return=minimal',
      },
      body: cuerpo !== undefined ? JSON.stringify(cuerpo) : undefined,
    });
    if(!res.ok){
      const err = await res.json().catch(() => null);
      return {ok:false, motivo:(err && (err.message || err.error)) || `HTTP ${res.status}`};
    }
    const data = metodo==='POST' ? await res.json().catch(() => null) : null;
    return {ok:true, data};
  }catch(e){
    return {ok:false, motivo:'red/CORS: ' + e.message};
  }
}

// ============================================================
// OBS. 19 — Usuarios y roles, FASE 1 (sesión 7, 14-ago-2026)
// Solo construye login/registro/sesión en paralelo. NO cambia ninguna
// política pública existente todavía — el resto de la app (supabaseFetch,
// supabaseWrite y los fetch sueltos) sigue usando la anon key exactamente
// igual que antes. La Fase 2 (reescribir RLS por rol) es un paso aparte
// que requiere confirmación explícita antes de aplicarse, porque ese sí
// puede dejar a alguien afuera si algo falla.
// ============================================================
const SESION_KEY = 'smtre_sesion';
// Sesión 26: "recordar correo" — guarda solo el email (nunca la contraseña)
// para no tener que teclearlo cada vez que se abre el login. Es una
// comodidad aparte de la sesión persistente (SESION_KEY, que ya guarda
// el refresh_token); esto solo precarga el campo de correo.
const CORREO_RECORDADO_KEY = 'smtre_correo_recordado';
function correoRecordado(){ try{ return localStorage.getItem(CORREO_RECORDADO_KEY) || ''; }catch(e){ return ''; } }
function fijarCorreoRecordado(email, recordar){
  try{
    if(recordar && email) localStorage.setItem(CORREO_RECORDADO_KEY, email);
    else localStorage.removeItem(CORREO_RECORDADO_KEY);
  }catch(e){}
}

// Fase 2 (obs. 19): cada fetch que antes mandaba la anon key fija en
// Authorization ahora manda authToken() — el access_token de quien haya
// iniciado sesión, o la anon key si nadie inició sesión (para que las
// tablas que sigan con política "pública" no se rompan). El header
// "apikey" SIEMPRE sigue siendo la anon key — eso lo exige Supabase sin
// importar la sesión, no se toca.
function authToken(){
  const s = obtenerSesion();
  return (s && s.access_token) ? s.access_token : SUPABASE_ANON_KEY;
}

// Renueva el access_token con el refresh_token si ya pasaron >50 minutos
// desde que se guardó (los tokens de Supabase Auth expiran a la hora).
// Se llama antes de cada supabaseFetch/supabaseWrite; si algo falla se
// deja la sesión como estaba y la petición sigue con el token viejo (en
// el peor caso da 401, no rompe la app).
async function asegurarSesionVigente(){
  const s = obtenerSesion();
  if(!s || !s.refresh_token) return;
  const edadMin = (Date.now() - (s.guardado_en || 0)) / 60000;
  if(edadMin < 50) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token }),
    });
    const cuerpo = await res.json().catch(() => null);
    if(res.ok && cuerpo && cuerpo.access_token){
      guardarSesion({ ...s, access_token: cuerpo.access_token, refresh_token: cuerpo.refresh_token, guardado_en: Date.now() });
    }
  }catch(e){ console.warn('No se pudo renovar la sesión:', e); }
}

function obtenerSesion(){
  try{ return JSON.parse(localStorage.getItem(SESION_KEY) || 'null'); }catch(e){ return null; }
}
function guardarSesion(s){ localStorage.setItem(SESION_KEY, JSON.stringify(s)); actualizarBotonCuenta(); }
function borrarSesion(){ localStorage.removeItem(SESION_KEY); actualizarBotonCuenta(); }

function actualizarBotonCuenta(){
  const btn = document.getElementById('btn-cuenta');
  if(!btn) return;
  const s = obtenerSesion();
  btn.textContent = s ? `👤 ${s.email.split('@')[0]}` : '👤 Cuenta';
  btn.title = s ? `${s.email} (${s.rol || 'pendiente'}) — clic para gestionar` : 'Iniciar sesión / crear cuenta';
  // Sesión 26: el botón visible en la barra ahora es el disparador del
  // menú desplegable "Cuenta" (btn-menu-cuenta) — refleja el usuario
  // conectado igual que antes hacía btn-cuenta, que ahora vive dentro
  // del panel desplegable.
  const btnMenu = document.getElementById('btn-menu-cuenta');
  if(btnMenu) btnMenu.innerHTML = (s ? `⚙️ ${escapeHtml(s.email.split('@')[0])}` : '⚙️ Cuenta') + ' <span class="caret">▾</span>';
  aplicarVisibilidadPorRol();
}

// ---------- Menús desplegables agrupados de la barra superior (sesión 26) ----------
function alternarMenuDesplegable(id){
  const el = document.getElementById(id);
  if(!el) return;

  cerrarMenusDesplegables();
  if(!yaAbierto) el.classList.add('abierto');

}
document.addEventListener('click', (e) => {

});

async function iniciarSesion(email, password){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const cuerpo = await res.json().catch(() => null);
  if(!res.ok) return { ok:false, motivo: (cuerpo && (cuerpo.error_description || cuerpo.msg || cuerpo.error)) || `HTTP ${res.status}` };
  // Trae el perfil (rol) usando el token de la persona, NO la anon key —
  // esto de paso confirma que el login real funciona de punta a punta,
  // porque la política de perfil_usuario exige auth.uid() = id.
  let rol = 'pendiente', nombre_completo = null, agencia_id = null, requiere_cambio_password = false, politica_aceptada_en = null;
  try{
    const perfilRes = await fetch(`${SUPABASE_URL}/rest/v1/perfil_usuario?select=rol,nombre_completo,agencia_id,requiere_cambio_password,politica_aceptada_en&id=eq.${cuerpo.user.id}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${cuerpo.access_token}` }
    });
    const perfil = await perfilRes.json().catch(() => []);
    if(Array.isArray(perfil) && perfil[0]){
      rol = perfil[0].rol; nombre_completo = perfil[0].nombre_completo; agencia_id = perfil[0].agencia_id;
      requiere_cambio_password = !!perfil[0].requiere_cambio_password;
      politica_aceptada_en = perfil[0].politica_aceptada_en;
    }
  }catch(e){ console.warn('No se pudo leer perfil_usuario tras login:', e); }
  guardarSesion({ access_token: cuerpo.access_token, refresh_token: cuerpo.refresh_token, user_id: cuerpo.user.id, email: cuerpo.user.email, rol, nombre_completo, agencia_id, requiere_cambio_password, politica_aceptada_en, guardado_en: Date.now() });
  return { ok:true, requiere_cambio_password };
}

// registrarCuenta() y el botón "Crear cuenta nueva" se eliminaron en la

        <button class="btn fantasma" style="margin-top:12px;width:100%;" onclick="cerrarSesionCuenta()">Cerrar sesión</button>
        <button class="btn fantasma no-print" style="margin-top:8px;width:100%;" onclick="cerrarModal()">Cerrar</button>

    <div style="background:#fff;color:var(--tinta);max-width:380px;width:90%;padding:24px;border-radius:4px;">
      <h2 style="font-family:'Fraunces',serif;color:var(--tinta);">Iniciar sesión</h2>
      <p style="font-size:12px;color:var(--tinta-suave);">Las cuentas se crean solo por invitación de un administrador — si todavía no tienes una, pide que te inviten.</p>
      <div class="campo"><label>Correo</label><input type="email" id="cuenta-email" autocomplete="username" value="${correoRecordado().replace(/"/g,'&quot;')}"></div>

      <div id="cuenta-mensaje" style="color:var(--critico);font-size:12.5px;margin:4px 0;"></div>
      <button class="btn" style="width:100%;" onclick="_intentarLogin()">Iniciar sesión</button>
      <button class="btn fantasma" style="margin-top:8px;width:100%;" onclick="abrirModalRecuperar()">¿Olvidaste tu contraseña?</button>
      <button class="btn fantasma no-print" style="margin-top:8px;width:100%;" onclick="cerrarModal()">Cancelar</button>
    </div></div>`;
}

// ============================================================
// Recuperación de contraseña (sesión 13, 18-ago-2026) — endpoint público
// de Supabase Auth, no necesita Edge Function. El correo trae un link que
// vuelve a esta misma página con #access_token=...&type=recovery en el

// ============================================================
async function abrirModalRecuperar(){
  const modal = document.getElementById('dis-documento-modal');
  modal.style.display = 'block';
  modal.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this) cerrarModal()">

async function _intentarRecuperar(){
  const email = document.getElementById('recuperar-email').value.trim();
  const msg = document.getElementById('recuperar-mensaje');
  if(!email){ msg.textContent = 'Escribe tu correo.'; return; }
  msg.style.color = 'var(--tinta-suave)';
  msg.textContent = 'Enviando…';
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, redirect_to: location.origin + location.pathname }),
    });
    // Supabase responde 200 sin importar si el correo existe o no (para no
    // filtrar qué correos están registrados) — siempre mostramos el mismo
    // mensaje de éxito.
    if(res.ok){
      msg.style.color = 'var(--exito, green)';
      msg.textContent = 'Si ese correo tiene cuenta, va a llegarle un link para elegir contraseña nueva.';
    } else {
      const cuerpo = await res.json().catch(() => null);
      msg.style.color = 'var(--critico)';
      msg.textContent = (cuerpo && (cuerpo.error_description || cuerpo.msg)) || 'No se pudo enviar el correo.';
    }
  }catch(e){ msg.style.color = 'var(--critico)'; msg.textContent = 'red/CORS: ' + e.message; }
}

// Detecta el link de recuperación o de invitación al cargar la página
// (#access_token=...&type=recovery para "olvidé mi contraseña",
// #access_token=...&type=invite para una cuenta nueva invitada) y ofrece
// definir la contraseña — mismo formulario para ambos casos.
function manejarLinkDeRecuperacion(){
  if(!location.hash || !(location.hash.includes('type=recovery') || location.hash.includes('type=invite'))) return;
  const esInvitacion = location.hash.includes('type=invite');
  const params = new URLSearchParams(location.hash.slice(1));
  const accessToken = params.get('access_token');
  if(!accessToken) return;
  history.replaceState(null, '', location.pathname + location.search); // limpia el hash de la URL
  const modal = document.getElementById('dis-documento-modal');
  modal.style.display = 'block';
  modal.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;display:flex;align-items:center;justify-content:center;">
    <div style="background:#fff;color:var(--tinta);max-width:380px;width:90%;padding:24px;border-radius:4px;">
      <h2 style="font-family:'Fraunces',serif;color:var(--tinta);">${esInvitacion ? 'Bienvenido/a — elige tu contraseña' : 'Elige tu nueva contraseña'}</h2>
      ${esInvitacion ? '<p style="font-size:12px;color:var(--tinta-suave);">Tu cuenta ya fue creada por un administrador. Elige tu contraseña para poder iniciar sesión — nadie más la va a ver.</p>' : ''}
      <div class="campo"><label>Contraseña nueva</label><input type="password" id="recuperar-password-nueva" autocomplete="new-password"></div>
      <div style="font-size:11px;color:var(--tinta-suave);margin:2px 0 8px;">Mínimo 8 caracteres.</div>
      ${esInvitacion ? `<label style="display:flex;align-items:flex-start;gap:8px;font-size:12.5px;margin:8px 0;">
        <input type="checkbox" id="recuperar-acepta-politica" style="margin-top:3px;">
        <span>He leído y acepto la <a href="#" onclick="event.preventDefault();abrirModalPrivacidad();">Política de protección de datos personales</a>.</span>
      </label>` : ''}
      <div id="recuperar-nueva-mensaje" style="color:var(--critico);font-size:12.5px;margin:4px 0;"></div>
      <button class="btn" style="width:100%;" onclick="_guardarPasswordNueva('${accessToken}', ${esInvitacion})">Guardar contraseña</button>
    </div></div>`;
}
async function _guardarPasswordNueva(accessToken, esInvitacion){
  const password = document.getElementById('recuperar-password-nueva').value;
  const msg = document.getElementById('recuperar-nueva-mensaje');
  if(password.length < 8){ msg.textContent = 'La contraseña necesita al menos 8 caracteres.'; return; }
  if(esInvitacion && !document.getElementById('recuperar-acepta-politica')?.checked){
    msg.textContent = 'Debes aceptar la Política de protección de datos personales para continuar.';
    return;
  }
  msg.style.color = 'var(--tinta-suave)'; msg.textContent = 'Guardando…';
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if(res.ok){
      if(esInvitacion){
        // Registra el consentimiento de la política de datos — quien acepta
        // la invitación ya tiene su fila en perfil_usuario creada por el
        // trigger de alta, así que aquí solo se marca la fecha de aceptación.
        try{
          const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
            headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${accessToken}` },
          });
          const userBody = await userRes.json().catch(() => null);
          if(userBody?.id){
            await fetch(`${SUPABASE_URL}/rest/v1/perfil_usuario?id=eq.${userBody.id}`, {
              method: 'PATCH',
              headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
              body: JSON.stringify({ politica_aceptada_en: new Date().toISOString() }),
            });
          }
        }catch(e){ /* no bloquea el flujo de login si esto falla */ }
      }
      msg.style.color = 'var(--exito, green)';
      msg.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión.';
      setTimeout(() => abrirModalCuenta(), 1200);
    } else {
      const cuerpo = await res.json().catch(() => null);
      msg.style.color = 'var(--critico)';
      msg.textContent = (cuerpo && (cuerpo.error_description || cuerpo.msg)) || 'No se pudo guardar.';
    }
  }catch(e){ msg.style.color = 'var(--critico)'; msg.textContent = 'red/CORS: ' + e.message; }
}

// Sesión 31 (12-sep-2026), LOPDP — herramienta de retención manual. Nunca
// anonimiza nada automáticamente: solo el administrador puede buscar y
// luego confirmar, una reserva a la vez, con doble confirmación por ser
// irreversible. Mismo criterio de todo el proyecto para acciones
// destructivas: sin automatismos silenciosos.
async function buscarReservasParaRetencion(){
  const cont = document.getElementById('privacidad-retencion-lista');
  if(!cont) return;
  cont.innerHTML = '<div class="hueco">Buscando…</div>';
  const limite = new Date(); limite.setMonth(limite.getMonth() - 24);
  const query = `select=id,nombre_cliente,telefono,email,fecha_reserva,numero_pax&fecha_reserva=lt.${limite.toISOString().slice(0,10)}&nombre_cliente=neq.(anonimizado)&order=fecha_reserva.asc&limit=50`;
  const r = await supabaseFetch('reserva_pasajero', query);
  if(!r.ok){ cont.innerHTML = `<div class="hueco">${escapeHtml(r.motivo)}</div>`; return; }
  if(!r.data.length){ cont.innerHTML = '<div class="hueco">No hay reservas con más de 24 meses pendientes de revisión.</div>'; return; }
  cont.innerHTML = `<table class="tabla-reservas"><thead><tr><th>Fecha</th><th>Cliente</th><th>Contacto</th><th>Pax</th><th></th></tr></thead><tbody>
    ${r.data.map(x => `<tr>
      <td>${escapeHtml(x.fecha_reserva)}</td>
      <td>${escapeHtml(x.nombre_cliente)}</td>
      <td>${[x.telefono,x.email].filter(Boolean).map(escapeHtml).join(' · ')}</td>
      <td>${x.numero_pax}</td>
      <td><button class="btn-mini" style="background:var(--critico);" onclick="anonimizarReserva('${x.id}')">Anonimizar</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}

async function anonimizarReserva(reservaId){
  if(!confirm('¿Anonimizar los datos personales de esta reserva? Se reemplazará el nombre/teléfono/email por valores anónimos, conservando monto y estado de pago. Esta acción no se puede deshacer.')) return;
  const r = await supabaseWrite('reserva_pasajero', 'PATCH', {
    nombre_cliente: '(anonimizado)', telefono: null, email: null,
  }, `id=eq.${reservaId}`);
  if(!r.ok){ alert('No se pudo anonimizar: ' + r.motivo); return; }
  buscarReservasParaRetencion();
}

function abrirModalCambioObligatorio(){
  const s = obtenerSesion();

  modal.style.display = 'block';

      <div class="campo"><label>Contraseña nueva</label><input type="password" id="cambio-obligatorio-password" autocomplete="new-password"></div>

        <input type="checkbox" id="cambio-obligatorio-acepta-politica" style="margin-top:3px;">
        <span>He leído y acepto la <a href="#" onclick="event.preventDefault();abrirModalPrivacidad();">Política de protección de datos personales</a>.</span>
      </label>` : ''}
      <div id="cambio-obligatorio-mensaje" style="color:var(--critico);font-size:12.5px;margin:4px 0;"></div>
      <button class="btn" style="width:100%;" onclick="_guardarCambioObligatorio(${necesitaPolitica})">Guardar y continuar</button>
    </div></div>`;

async function _guardarCambioObligatorio(necesitaPolitica){
  const s = obtenerSesion();
  const password = document.getElementById('cambio-obligatorio-password').value;
  const msg = document.getElementById('cambio-obligatorio-mensaje');
  if(!s){ msg.textContent = 'Tu sesión se perdió, vuelve a iniciar sesión.'; return; }
  if(password.length < 8){ msg.textContent = 'La contraseña necesita al menos 8 caracteres.'; return; }
  if(necesitaPolitica && !document.getElementById('cambio-obligatorio-acepta-politica')?.checked){
    msg.textContent = 'Debes aceptar la Política de protección de datos personales para continuar.';
    return;
  }
  msg.style.color = 'var(--tinta-suave)'; msg.textContent = 'Guardando…';
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: 'PUT',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${s.access_token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if(!res.ok){
      const cuerpo = await res.json().catch(() => null);
      msg.style.color = 'var(--critico)';
      msg.textContent = (cuerpo && (cuerpo.error_description || cuerpo.msg)) || 'No se pudo guardar la contraseña.';
      return;
    }
    const cambios = { requiere_cambio_password: false };
    if(necesitaPolitica) cambios.politica_aceptada_en = new Date().toISOString();
    await fetch(`${SUPABASE_URL}/rest/v1/perfil_usuario?id=eq.${s.user_id}`, {
      method: 'PATCH',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${s.access_token}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(cambios),
    });
    guardarSesion({ ...s, requiere_cambio_password: false, politica_aceptada_en: cambios.politica_aceptada_en || s.politica_aceptada_en });
    cerrarModal();
    location.reload();
  }catch(e){ msg.style.color = 'var(--critico)'; msg.textContent = 'red/CORS: ' + e.message; }
}

function aplicarVisibilidadPorRol(){
  const rol = rolActual();
  const esMayorista = rol === 'mayorista';
  const esPendiente = rol === 'pendiente';
  const esAdmin = rol === 'administrador' || rol === null;
  // Sesión 29 (Prioridad #2): admin_agencia gestiona su propia agencia
  // desde "👥 Usuarios" (antes solo lo veía el superadmin). El backend
  // (RLS + Edge Function invitar-usuario) ya scopeaba esto por agencia
  // desde sesión 23/24 — solo faltaba mostrar la pestaña.
  const esAdminAgencia = rol === 'admin_agencia';
  const ocultarInterno = esMayorista || esPendiente;

  const idsInternos = ['tab-catalogo','tab-disenador','tab-reservas','tab-sugerido'];
  idsInternos.forEach(id => { const el = document.getElementById(id); if(el) el.style.display = ocultarInterno ? 'none' : ''; });

  const btnMarca = document.getElementById('btn-marca'); if(btnMarca) btnMarca.style.display = (esAdmin || esAdminAgencia) ? '' : 'none';
  const btnLicenciamiento = document.getElementById('btn-simulador-licenciamiento'); if(btnLicenciamiento) btnLicenciamiento.style.display = esAdmin ? '' : 'none';
  const btnProveedor = document.getElementById('btn-nuevo-proveedor'); if(btnProveedor) btnProveedor.style.display = ocultarInterno ? 'none' : '';
  const tabUsuarios = document.getElementById('tab-usuarios'); if(tabUsuarios) tabUsuarios.style.display = (esAdmin || esAdminAgencia) ? '' : 'none';
  const iconoMargen = document.getElementById('dis-icono-margen-oculto'); if(iconoMargen) iconoMargen.style.display = esAdmin ? '' : 'none';

  const tabCatMay = document.getElementById('tab-catalogo-mayorista'); if(tabCatMay) tabCatMay.style.display = esMayorista ? '' : 'none';
  const tabMisCot = document.getElementById('tab-mis-cotizaciones'); if(tabMisCot) tabMisCot.style.display = esMayorista ? '' : 'none';

  const aviso = document.getElementById('aviso-rol-pendiente'); if(aviso) aviso.style.display = esPendiente ? 'block' : 'none';

  // Si la vista visible en pantalla ya no le corresponde al rol actual
  // (p.ej. se cerró sesión de administrador y entró un mayorista), lo
  // mandamos a una vista que sí pueda ver.
  const vistaCatalogoVisible = document.getElementById('vista-catalogo').style.display !== 'none';
  const vistaDisenadorVisible = document.getElementById('vista-disenador').style.display !== 'none';
  const vistaReservasVisible = document.getElementById('vista-reservas').style.display !== 'none';
  const vistaSugeridoVisible = document.getElementById('vista-sugerido').style.display !== 'none';
  if(ocultarInterno && (vistaCatalogoVisible||vistaDisenadorVisible||vistaReservasVisible||vistaSugeridoVisible)){
    cambiarVista(esMayorista ? 'catalogo-mayorista' : 'catalogo');
  }
  if(!ocultarInterno){
    const vistaMayVisible = document.getElementById('vista-catalogo-mayorista').style.display !== 'none';
    const vistaCotVisible = document.getElementById('vista-mis-cotizaciones').style.display !== 'none';
    if(vistaMayVisible || vistaCotVisible) cambiarVista('catalogo');
  }
}

function abrirFormularioCotizacionMayorista({modo, programa, datosExistentes}){
  // Guardamos el programa completo acá (no solo su id) para que
  // guardarCotizacionMayorista() lo use directo, sin depender de

  window._cotizarMayoristaPrograma = programa;
  const modal = document.getElementById('dis-documento-modal');
  modal.style.display = 'block';
  const pax0 = datosExistentes ? datosExistentes.numero_pax : 1;
  const fecha0 = datosExistentes ? (datosExistentes.fecha_salida_solicitada || '') : '';
  const notas0 = datosExistentes ? (datosExistentes.notas || '') : '';
  modal.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this) cerrarModal()">

      <h2 style="font-family:'Fraunces',serif;font-size:18px;color:var(--tinta);">${modo==='editar'?'Editar cotización':'Cotizar'}: ${escapeHtml(programa.nombre)}</h2>
      <div class="campo"><label>Número de pax</label><input type="number" id="cm-pax" min="1" value="${pax0}"></div>
      <div class="campo"><label>Fecha de salida solicitada (opcional)</label><input type="date" id="cm-fecha" value="${fecha0}"></div>
      <div class="campo"><label>Notas para el operador (opcional)</label><textarea id="cm-notas" rows="3">${escapeHtml(notas0)}</textarea></div>
      <div style="font-family:'Fraunces',serif;font-size:18px;margin:10px 0;">Total estimado: <span id="cm-total">${money((programa.precio_pax||0)*pax0)}</span></div>
      <button class="btn" style="width:100%;" onclick="guardarCotizacionMayorista('${modo}'${datosExistentes?`,'${datosExistentes.id}'`:''})">${modo==='editar'?'Guardar cambios':'Guardar cotización'}</button>
      <button class="btn fantasma" style="margin-top:8px;width:100%;" onclick="cerrarModal()">Cancelar</button>
    </div></div>`;
  document.getElementById('cm-pax').addEventListener('input', () => {
    const pax = parseInt(document.getElementById('cm-pax').value,10) || 0;
    document.getElementById('cm-total').textContent = money((programa.precio_pax||0) * pax);
  });
}
async function guardarCotizacionMayorista(modo, cotizacionId){
  const p = window._cotizarMayoristaPrograma;
  const s = obtenerSesion();
  if(!p){ alert('Se perdió la referencia al programa — cierra este formulario y vuelve a intentarlo desde Catálogo o Mis Cotizaciones.'); return; }
  if(!s){ alert('Tu sesión expiró — vuelve a iniciar sesión.'); return; }
  const pax = parseInt(document.getElementById('cm-pax').value,10) || 0;
  if(pax < 1){ alert('El número de pax debe ser al menos 1.'); return; }
  const fecha = document.getElementById('cm-fecha').value || null;
  const notas = document.getElementById('cm-notas').value || null;
  const pvpPax = p.precio_pax || 0;
  const body = {
    numero_pax: pax,
    fecha_salida_solicitada: fecha,
    pvp_pax: pvpPax,
    pvp_total: pvpPax * pax,
    notas,
  };
  let res;
  if(modo === 'editar' && cotizacionId){
    res = await fetch(`${SUPABASE_URL}/rest/v1/cotizacion_mayorista?id=eq.${cotizacionId}`, {
      method:'PATCH',
      headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${authToken()}`, 'Content-Type':'application/json', Prefer:'return=minimal'},
      body: JSON.stringify({...body, updated_at: new Date().toISOString()}),
    });
  }else{
    res = await fetch(`${SUPABASE_URL}/rest/v1/cotizacion_mayorista`, {
      method:'POST',
      headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${authToken()}`, 'Content-Type':'application/json', Prefer:'return=minimal'},
      body: JSON.stringify({...body, programa_generado_id: p.id, agencia_id: s.agencia_id || null}),
    });
  }
  if(!res.ok){
    const detalle = await res.text().catch(()=>null);
    alert('No se pudo guardar la cotización. ' + (detalle || 'Intenta de nuevo.'));
    return;
  }
  cerrarModal();
  cambiarVista('mis-cotizaciones');
}
async function editarCotizacionMayorista(cotizacionId){
  const r = await supabaseFetch('cotizacion_mayorista', `select=*&id=eq.${cotizacionId}`);
  if(!r.ok || !r.data[0]){ alert('No se pudo cargar la cotización.'); return; }
  const cot = r.data[0];
  let programa = (window._catalogoMayoristaCache||{})[cot.programa_generado_id];
  if(!programa){
    const rp = await supabaseFetch('programa_generado_publico', `select=*&id=eq.${cot.programa_generado_id}`);
    if(rp.ok && rp.data[0]) programa = rp.data[0];
  }
  if(!programa){ alert('No se pudo cargar el programa de esta cotización.'); return; }
  abrirFormularioCotizacionMayorista({modo:'editar', programa, datosExistentes: cot});
}
async function eliminarCotizacionMayorista(cotizacionId){
  if(!confirm('¿Eliminar esta cotización?')) return;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/cotizacion_mayorista?id=eq.${cotizacionId}`, {
    method:'DELETE',
    headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${authToken()}`},
  });
  if(!res.ok){ alert('No se pudo eliminar. Intenta de nuevo.'); return; }

// crear ninguna cuenta, así que esto es seguro aunque alguien manipule
// el HTML. Desde sesión 20 (26-ago-2026) genera una contraseña temporal
// en vez de mandar un correo — el administrador se la entrega él mismo.
async function invitarUsuario(){
  const email = document.getElementById('usr-inv-email').value.trim();
  const nombre_completo = document.getElementById('usr-inv-nombre').value.trim();
  const rol = document.getElementById('usr-inv-rol').value;
  const agencia_id = document.getElementById('usr-inv-agencia')?.value || null;
  const msg = document.getElementById('usr-inv-mensaje');
  const cajaPassword = document.getElementById('usr-inv-password-temporal');
  cajaPassword.innerHTML = '';
  if(!email || !email.includes('@')){ msg.style.color='var(--critico)'; msg.textContent='Escribe un correo válido.'; return; }
  msg.style.color = 'var(--tinta-suave)';
  msg.textContent = 'Creando cuenta…';
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/invitar-usuario`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${authToken()}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ modo: 'crear', email, rol, nombre_completo, agencia_id }),
    });
    const cuerpo = await res.json().catch(() => null);
    if(!res.ok || !cuerpo?.ok){
      msg.style.color = 'var(--critico)';
      msg.textContent = (cuerpo && cuerpo.motivo) || `No se pudo crear la cuenta (HTTP ${res.status}).`;
      return;
    }

    msg.textContent = `Cuenta creada para ${email}. Copia la contraseña temporal y entrégasela — no se vuelve a mostrar.`;
    cajaPassword.innerHTML = `<code style="background:#eee;padding:4px 8px;border-radius:3px;font-size:14px;user-select:all;">${escapeHtml(cuerpo.password_temporal)}</code>`;
    document.getElementById('usr-inv-email').value = '';
    document.getElementById('usr-inv-nombre').value = '';
    cargarListaUsuarios();
  }catch(e){
    msg.style.color = 'var(--critico)';
    msg.textContent = 'red/CORS: ' + e.message;
  }
}

// Obs.8 (sesión 25): borrado real de cuentas (no solo desactivar).
// Doble confirmación porque es irreversible — a diferencia de
// desmarcar "Cuenta activa" (que solo bloquea el login y se puede
// revertir), esto borra la cuenta de auth.users de verdad. Los
// programas/grupos que haya creado esa persona NO se borran, solo
// quedan sin autor vivo (creado_por a NULL) — el nombre de quien los
// creó en su momento sigue disponible en la pantalla "📋 Actividad".
async function eliminarUsuario(usuario_id, email){
  const fila = document.getElementById(`usr-fila-${usuario_id}`);
  if(!confirm(`¿Eliminar la cuenta de ${email}? Esto es IRREVERSIBLE: la persona deja de poder entrar y su cuenta desaparece. Los programas que haya creado NO se borran (solo pierden el autor vivo).`)) return;
  if(!confirm(`Última confirmación: vas a borrar definitivamente a ${email}. ¿Seguro?`)) return;
  const caja = document.getElementById(`usr-reset-password-${usuario_id}`);
  if(caja){ caja.style.color = 'var(--tinta-suave)'; caja.textContent = 'Eliminando…'; }
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/invitar-usuario`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${authToken()}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ modo: 'eliminar', usuario_id }),
    });
    const cuerpo = await res.json().catch(() => null);
    if(!res.ok || !cuerpo?.ok){
      if(caja){ caja.style.color = 'var(--critico)'; caja.textContent = (cuerpo && cuerpo.motivo) || `No se pudo eliminar (HTTP ${res.status}).`; }
      else alert((cuerpo && cuerpo.motivo) || `No se pudo eliminar (HTTP ${res.status}).`);
      return;
    }
    if(fila) fila.remove();
  }catch(e){
    if(caja){ caja.style.color = 'var(--critico)'; caja.textContent = 'red/CORS: ' + e.message; }
    else alert('red/CORS: ' + e.message);
  }
}
async function guardarRolUsuario(id, email, esUsuarioActual){
  const nuevoRol = document.getElementById(`usr-rol-${id}`).value;
  const nuevoActivo = document.getElementById(`usr-activo-${id}`).checked;
  const nuevaAgencia = document.getElementById(`usr-agencia-${id}`)?.value || null;
  if(esUsuarioActual && nuevoRol !== 'administrador'){
    if(!confirm(`Estás a punto de quitarte a ti mismo el rol de administrador (${email}). Si nadie más tiene rol administrador, nadie podrá volver a entrar aquí a corregirlo. ¿Continuar?`)) return;
  }
  if(!nuevoActivo && esUsuarioActual){
    if(!confirm('Estás a punto de desactivar tu propia cuenta. Perderás acceso de inmediato. ¿Continuar?')) return;
  }
  const r = await supabaseWrite('perfil_usuario', 'PATCH', {rol:nuevoRol, activo:nuevoActivo, agencia_id:nuevaAgencia}, `id=eq.${id}`);
  if(!r.ok){ alert('No se pudo guardar: ' + r.motivo); return; }
  await cargarListaUsuarios();
}

// Espera (sin bloquear el hilo) a que exista un elemento del DOM — se usa
// para pasar de "Mis Programas" a "Diseñar Programa" y recién ahí rellenar
// el formulario, porque initDisenador() es async (carga provincias, etc.)
// y el formulario todavía no existe en el primer instante tras el cambio
// de pestaña.
function esperarElemento(id, intentosMax){
  intentosMax = intentosMax || 40;
  return new Promise(resolve => {
    let intentos = 0;
    const t = setInterval(() => {
      if(document.getElementById(id) || ++intentos >= intentosMax){ clearInterval(t); resolve(!!document.getElementById(id)); }
    }, 50);
  });
}

// DISEÑADOR DE PROGRAMA — itinerario con horarios, selección de
// componentes por provincia/ciudad/cantón con recomendación editable,
// costeo completo (extras + gratuidades internas), 3 documentos,
// guardado reutilizable en Supabase, papelera de reciclaje.
// ============================================================
// Sesión 16: helper de escape para texto libre que ingresan roles menos
// confiables (mayorista/operadora vía reservas y cotizaciones) antes de
// insertarlo en innerHTML — mitiga XSS almacenado sin tocar los ~90 usos
// de innerHTML que interpolan datos controlados por el admin (catálogo).
// Aplicado por ahora solo a los 3 puntos de mayor riesgo real encontrados
// en la auditoría de sesión 16: nombre_cliente/telefono/email de
// reserva_pasajero, y notas de cotizacion_mayorista/grupo_salida.
function escapeHtml(valor){
  if(valor === null || valor === undefined) return '';
  return String(valor)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// siempre del dato real `categoria_hotel_id` del proveedor en Supabase,
// nunca del estado de un checkbox de filtro.
const TIER_POR_NOMBRE_DB = Object.fromEntries(Object.entries(CATEGORIA_TIER).flatMap(([tier,nombresDb]) => nombresDb.map(nombreDb => [nombreDb, tier])));
let _mapaCategoriaHotelPorId = null;
async function mapaCategoriaHotelPorId(){
  if(_mapaCategoriaHotelPorId) return _mapaCategoriaHotelPorId;

  _mapaCategoriaHotelPorId = r.ok ? Object.fromEntries(r.data.map(c => [c.id, TIER_POR_NOMBRE_DB[c.nombre] || c.nombre])) : {};

function actualizarVisibilidadRuta(){
  const dias = parseInt(document.getElementById('dis-dias')?.value || '1', 10);
  const wrap = document.getElementById('dis-ruta-wrap');
  if(wrap) wrap.style.display = dias >= 2 ? 'block' : 'none';
  // Sesión 14 (Héctor, confirmado): la primera parada de la Ruta ya no se
  // agrega a mano con "+ Agregar parada" — nace sola del campo "Provincia"
  // de arriba en cuanto el programa pasa a 2+ días, para poder elegir
  // hotel/alimentación/atractivos de esa primera parada de inmediato. De
  // ahí en adelante, "+ Agregar parada" solo se usa para las SIGUIENTES
  // paradas (2ª, 3ª...). El campo Provincia y rutaProvincias[0] quedan
  // sincronizados en ambos sentidos (ver dis-provincia onchange y
  // sincronizarProvinciaPrincipalConRuta()).
  if(dias >= 2 && rutaProvincias.length === 0){
    const provinciaActual = document.getElementById('dis-provincia')?.value;
    if(provinciaActual) rutaProvincias.push({provincia: provinciaActual, diaDesde: 1, diaHasta: 1});
  }
  // Pedido de Héctor (ronda 10): con Ruta de provincias activa, cada parada
  // ya trae su propio buscador con la provincia correcta — el filtro
  // genérico de abajo (Provincia/Ciudad/Cantón) queda redundante y confunde.
  // Se oculta en ese caso; sigue existiendo en el DOM (oculto) porque
  // buscarComponenteParaParada() y buscarYRecomendar() siguen leyendo esos
  // mismos campos para armar la búsqueda de cada parada — solo se esconde
  // la caja, no se borra.
  const filtros = document.getElementById('dis-filtros-wrap');
  if(filtros) filtros.style.display = dias >= 2 ? 'none' : 'block';
  // Pedido de Héctor (08-ago-2026): con 2+ días, hotel/restaurante/atractivo
  // SIEMPRE se agregan por parada dentro de "Ruta de provincias" (no hay
  // modo "fijo para todo el recorrido" para estos tres, a diferencia de
  // transporte/guía) — así que las secciones sueltas de abajo quedaban
  // duplicando la misma función y confundían sobre cuál usar. Se ocultan
  // en 2+ días; con 1 día "Ruta" está oculta y estas 3 vuelven a ser la
  // única forma de agregarlos.
  ['dis-seccion-restaurantes','dis-seccion-atractivos'].forEach(id => {
    const sec = document.getElementById(id);
    if(sec) sec.style.display = dias >= 2 ? 'none' : 'block';
  });
  // Obs. 5 de cambios_tur.docx (12-ago sesión 5): el buscador genérico de
  // hospedaje ("Buscar y recomendar hotel") seguía con la regla vieja
  // (ocultarlo solo en 2+ días, porque ahí se usa Ruta por parada) — pero
  // nunca se agregó la regla de 1 día = sin hospedaje a ESTE bloque, solo a
  // "elegidos y detalles" de abajo. Resultado: con Días=1 el buscador de
  // hotel seguía visible aunque no tenga sentido usarlo. Como un programa de
  // 1 día no lleva alojamiento (por definición) y un programa de 2+ días
  // siempre usa Ruta por parada para hospedaje (nunca este buscador
  // genérico, ver nota de 08-ago arriba), este bloque ya no tiene ningún
  // caso en el que deba mostrarse — se oculta siempre.
  const secHospedaje = document.getElementById('dis-seccion-hospedaje');
  if(secHospedaje) secHospedaje.style.display = 'none';
  // Obs. 7/9 de cambios_tur.docx (11-ago sesión 4): un programa de 1 día no
  // lleva alojamiento por definición (mismo criterio que ya se aplicaba en
  // los documentos finales) — se oculta también "Hospedaje — elegidos y
  // detalles", que antes se mostraba siempre sin importar los días.
  const seccionElegidos = document.getElementById('dis-seccion-hospedaje-elegidos');
  if(seccionElegidos) seccionElegidos.style.display = dias === 1 ? 'none' : 'block';
  // Se llama aquí (no solo en cada call site) para que la parada 1
  // recién sembrada arriba aparezca de inmediato sin depender de que quien
  // llamó a esta función se acuerde de renderizar después.
  renderRutaProvincias();
}

// Sesión 14 (Héctor, prueba de navegador): el campo "Provincia" principal
// (arriba del todo) nunca se sincronizaba con la Ruta de provincias — con
// 2+ días, ese campo deja de controlar nada visualmente (ver nota en
// actualizarVisibilidadRuta), pero se sigue guardando en la base como
// provincia_id del programa. Como quedaba en su valor por defecto (la
// primera opción alfabética, "Azuay") a menos que Héctor lo cambiara a
// mano, muchos programas se guardaban con la provincia equivocada — y al
// reabrirlos, mostraban fielmente lo que había quedado guardado (Azuay),
// no un bug de carga. Se corrige sincronizando siempre con la primera
// parada de la Ruta.
function sincronizarProvinciaPrincipalConRuta(){
  const sel = document.getElementById('dis-provincia');
  if(sel && rutaProvincias.length) sel.value = rutaProvincias[0].provincia;
}

// Sesión 14 (Héctor, confirmado): sincronización en el sentido contrario —
// si Héctor cambia el "Provincia" de arriba a mano (la parada 1, ya
// sembrada por actualizarVisibilidadRuta), esa misma parada 1 de la Ruta
// se actualiza con el nuevo valor. Si aún no hay ninguna parada (1 día,
// Ruta oculta), no hace nada — se sembrará sola al pasar a 2+ días.
function sincronizarRutaPrimeraParadaConProvincia(){
  const nuevaProvincia = document.getElementById('dis-provincia')?.value;
  if(nuevaProvincia && rutaProvincias.length){
    rutaProvincias[0].provincia = nuevaProvincia;
    renderRutaProvincias();
  }
}

function agregarParadaRuta(){
  const sel = document.getElementById('dis-ruta-nueva-provincia');
  const provincia = sel.value;
  const dias = parseInt(document.getElementById('dis-dias')?.value || '1', 10);
  const ultima = rutaProvincias[rutaProvincias.length-1];
  const diaDesde = ultima ? Math.min(ultima.diaHasta+1, dias) : 1;
  const diaHasta = Math.min(diaDesde, dias);
  rutaProvincias.push({provincia, diaDesde, diaHasta});
  sincronizarProvinciaPrincipalConRuta();
  renderRutaProvincias();
}

function quitarParadaRuta(idx){
  const parada = rutaProvincias[idx];
  // Los componentes ya elegidos para esa parada quedan (no se borran solos),
  // pero se les quita la referencia a la parada para que no apunten a un
  // índice que ya no existe; siguen editables como componente "suelto".
  ['hoteles','restaurantes','transportes','atractivos','guias'].forEach(clave => {
    componentesElegidos[clave].forEach(x => { if(x.paradaIdx === idx) x.paradaIdx = null; });
  });
  rutaProvincias.splice(idx, 1);
  ['hoteles','restaurantes','transportes','atractivos','guias'].forEach(clave => {
    componentesElegidos[clave].forEach(x => { if(x.paradaIdx > idx) x.paradaIdx -= 1; });
  });
  sincronizarProvinciaPrincipalConRuta();
  renderRutaProvincias();
  renderChipsSeleccionados();
}

function actualizarParadaRuta(idx, campo, valor){
  rutaProvincias[idx][campo] = (campo==='provincia') ? valor
    : (campo==='tarifaAlimentacion' || campo==='tarifaTransporte' || campo==='tarifaGuia') ? (valor==='' ? null : parseFloat(valor)||0)
    : (parseInt(valor,10)||1);
  if(idx === 0 && campo === 'provincia') sincronizarProvinciaPrincipalConRuta();
  renderRutaProvincias();
  recalcularCosteo();
}

// Generalizado (01-ago, pedido de Héctor): antes esto solo existía para
// hotel; ahora cualquier tipo (restaurante/transporte/atractivo/guía)
// puede buscarse "para esta parada" desde la Ruta de provincias, en vez de
// tener que bajar manualmente a cambiar "Provincia de búsqueda" cada vez.
// Reutiliza buscarYRecomendar(tipo) forzando la provincia de la parada y
// guardando en qué parada quedará el componente elegido, para que
// confirmarSeleccion lo etiquete con esa parada (y, en el caso de hotel,
// le asigne también el rango de días de la parada).
window._paradaActivaParaTipo = window._paradaActivaParaTipo || {hotel:null, restaurante:null, atractivo:null, transporte:null, guia:null};
async function buscarComponenteParaParada(idx, tipo){
  const parada = rutaProvincias[idx];
  if(!parada) return;
  window._paradaActivaParaTipo[tipo] = idx;
  const selFiltro = document.getElementById('dis-filtro-provincia');
  if(selFiltro) selFiltro.value = parada.provincia;
  // Corrección Obs. 1/2 de Observaciones_turismo.docx (sesión 22,
  // 2-sep-2026): "Cantón" y "Ciudad" del filtro genérico (oculto, pero
  // sigue siendo lo que buscarYRecomendar() realmente lee) se quedaban con
  // el valor de una búsqueda anterior — de otra parada o de otra
  // provincia. Como ese cantón casi nunca existe dentro de la nueva
  // provincia, idCanton() no encontraba nada: la búsqueda volvía vacía
  // (Obs. 2, "no despliega información") o, si el nombre del cantón
  // coincidía por casualidad con uno de otra provincia, devolvía
  // resultados de un lugar distinto al de la parada (Obs. 1, "seleccionada
  // Tungurahua pero muestra Azuay"). Se limpian Cantón y Ciudad y se
  // recarga la lista de cantones de la provincia correcta antes de cada
  // búsqueda "para esta parada".
  const selCanton = document.getElementById('dis-filtro-canton');
  if(selCanton) selCanton.value = '';
  const inputCiudad = document.getElementById('dis-filtro-ciudad');
  if(inputCiudad) inputCiudad.value = '';
  const inputNombre = document.getElementById('dis-filtro-nombre');
  if(inputNombre) inputNombre.value = '';
  await cargarCantonesFiltro();
  await buscarYRecomendar(tipo);
  // Mueve el resultado de búsqueda genérico a la tarjeta de esta parada,
  // para que quede claro a qué parada corresponde.
  const genérico = document.getElementById('dis-resultado-' + tipo);
  const destino = document.getElementById('dis-resultado-' + tipo + '-parada-' + idx);
  if(genérico && destino){ destino.innerHTML = genérico.innerHTML; genérico.innerHTML = ''; }
}

  if(!_cacheTipoTurismo){
    const r = await supabaseFetch('cat_tipo_turismo', 'select=id,nombre');
    _cacheTipoTurismo = r.ok ? Object.fromEntries(r.data.map(t=>[t.id, t.nombre])) : {};
  }
  const conteo = {};
  (c.atractivos||[]).forEach(a => {
    const nombreTipo = a.tipo_turismo_id ? _cacheTipoTurismo[a.tipo_turismo_id] : null;
    if(nombreTipo) conteo[nombreTipo] = (conteo[nombreTipo]||0) + 1;
  });
  const tiposOrdenados = Object.entries(conteo).sort((a,b)=>b[1]-a[1]).map(([k])=>k);

  let gancho;
  if(tiposOrdenados.length >= 2){
    gancho = `${tiposOrdenados[0]} y ${tiposOrdenados[1].toLowerCase()}`;
  } else if(tiposOrdenados.length === 1){
    const opciones = FRASES_POR_TIPO_TURISMO[tiposOrdenados[0]] || [tiposOrdenados[0]];
    gancho = opciones[Math.floor(Math.random()*opciones.length)];
  } else if((c.hoteles||[]).length){
    gancho = 'Estadía y descanso';
  } else {
    gancho = 'Turismo receptivo';
  }

  const provincias = new Set();
  const provinciaPrincipal = document.getElementById('dis-provincia')?.value || '';
  if(provinciaPrincipal) provincias.add(provinciaPrincipal);
  (rutaProvincias||[]).forEach(p => { if(p.provincia) provincias.add(p.provincia); });
  const provinciasArr = [...provincias];

  // La provincia es opcional en el nombre — a veces se incluye, a veces no.
  const incluirProvincia = provinciasArr.length > 0 && Math.random() < 0.5;
  let nombre;
  if(incluirProvincia){
    nombre = `${capitalizar(gancho)} en ${provinciasArr.join(' y ')} · ${etiquetaDuracion}`;
  } else {
    nombre = `${capitalizar(gancho)} · ${etiquetaDuracion}`;
  }

  const input = document.getElementById('dis-nombre');
  if(input) input.value = nombre;
}

async function cargarCantonesFiltro(){
