async function editarPrograma(id){
  // Corrección (sesión 8, 15-ago-2026): este botón vive en la lista lateral
  // "Programas guardados" dentro de la propia vista Diseñar Programa y
  // llamaba a editarPrograma() sin esperar window._initDisenadorPromise —
  // a diferencia de editarProgramaDesdeCatalogo() (corregido en sesión 7),
  // este segundo punto de entrada seguía teniendo el mismo bug: si se
  // elegía un programa guardado antes de que provinciasMapa terminara de
  // llegar de Supabase, la búsqueda de hotel/restaurante/atractivo por
  // parada daba "Sin resultados" porque provinciasMapa aún estaba vacío.
  if(window._initDisenadorPromise) await window._initDisenadorPromise;
  const p = window._programasCache[id];
  if(!p) return;
  registrarAperturaPrograma(id);
  editandoProgramaId = id;
  window._codigoActualEnEdicion = p.codigo_generado || null;
  window._numCotizacionActualEnEdicion = p.numero_cotizacion || null;
  document.getElementById('dis-nombre').value = p.nombre;
  document.getElementById('dis-provincia').value = Object.keys(provinciasMapa).find(n=>provinciasMapa[n]===p.provincia_id) || '';
  document.getElementById('dis-dias').value = p.dias;
  document.getElementById('dis-noches').value = p.noches;
  rutaProvincias = (p.componentes_json||{}).rutaProvincias || [];
  // Autocorrección (sesión 14): si el programa se guardó antes de esta
  // corrección con la "Provincia" principal desincronizada de la Ruta
  // (quedó en Azuay por defecto), al reabrirlo se corrige sola con la
  // primera parada real de la Ruta — no hace falta editar cada programa
  // viejo a mano, se autocorrige la próxima vez que se guarda.
  sincronizarProvinciaPrincipalConRuta();
  actualizarVisibilidadRuta();
  renderRutaProvincias();
  {
    // Unimos el tier guardado en categoria_hotel_ofrecida con los tiers
    // reales de los hoteles ya elegidos (categoriaEtiqueta guardada en
    // componentes_json.hoteles). Así, si el campo guardado quedó
    // desactualizado o en su valor por defecto ('Turista') pero el hotel
    // real elegido es de otro tier (p.ej. 'Ejecutivo'), el filtro de
    // búsqueda por categoría sigue incluyendo ese tier — evita el bug de
    // "Sin resultados" cuando la provincia no tiene hoteles en el tier
    // guardado por defecto.
    const tiersGuardados = (p.categoria_hotel_ofrecida||'Turista').split(',').map(s=>s.trim()).filter(Boolean);
    const tiersReales = ((p.componentes_json||{}).hoteles||[]).map(h=>h.categoriaEtiqueta).filter(Boolean);
    const marcadas = [...new Set([...tiersGuardados, ...tiersReales])];
    document.querySelectorAll('.dis-cat-hotel').forEach(el => el.checked = marcadas.includes(el.value));
  }
  document.getElementById('dis-compartido').checked = p.alojamiento_compartido;
  // Corrección (sesión 26, hallazgo incidental): estos 4 campos se
  // guardaban bien en Supabase pero nunca se restauraban al reabrir un
  // programa guardado para editar — quedaban vacíos aunque el dato

async function moverAPapelera(id){
  if(!confirm('¿Mover a la papelera?')) return;
  const resp = await fetch(`${SUPABASE_URL}/rest/v1/programa_generado?id=eq.${id}`, {method:'PATCH', headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${authToken()}`,'Content-Type':'application/json',Prefer:'return=minimal'}, body:JSON.stringify({estado:'papelera', fecha_eliminacion:new Date().toISOString()})});
  if(!resp.ok){ alert('No se pudo eliminar: solo un administrador (general o de tu agencia) puede borrar programas.'); return; }
  cargarProgramasGuardados();
}
async function restaurarPrograma(id){
  await fetch(`${SUPABASE_URL}/rest/v1/programa_generado?id=eq.${id}`, {method:'PATCH', headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${authToken()}`,'Content-Type':'application/json',Prefer:'return=minimal'}, body:JSON.stringify({estado:'activo', fecha_eliminacion:null})});
  verPapelera();
}
async function eliminarDefinitivo(id){
  if(!confirm('Esto borra el programa para siempre. ¿Continuar?')) return;
  await fetch(`${SUPABASE_URL}/rest/v1/programa_generado?id=eq.${id}`, {method:'DELETE', headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${authToken()}`}});
  verPapelera();
}
async function vaciarPapelera(){
  if(!confirm('Esto borra TODOS los programas de la papelera para siempre. ¿Continuar?')) return;
  await fetch(`${SUPABASE_URL}/rest/v1/programa_generado?estado=eq.papelera`, {method:'DELETE', headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${authToken()}`}});
  verPapelera();
}
async function purgarPapeleraAutomatica(){
  const limite = new Date(Date.now()-30*24*60*60*1000).toISOString();
  await fetch(`${SUPABASE_URL}/rest/v1/programa_generado?estado=eq.papelera&fecha_eliminacion=lt.${limite}`, {method:'DELETE', headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${authToken()}`}}).catch(()=>{});

// Exporta la hoja de costos (todo lo que se ve en el panel, incluidos los
// PVP y la tabla por categoría si aplica) a un CSV — se abre directo en
// Excel. Pedido de Héctor (01-ago). No usa librerías externas: arma el CSV
// leyendo las mismas filas/tabla que ya se renderizaron en pantalla, para
// no duplicar la lógica de cálculo.
// Sesión 26: reescrito para generar un .xlsx real con SheetJS (antes era
// un CSV con extensión .csv correcta, pero el botón decía "Exportar a
// Excel" — hallazgo de la auditoría de costeo/vouchers). Se arma la misma
// tabla de antes pero como hoja de cálculo real, con encabezados en
// negrita y columnas con ancho razonable, en vez de texto separado por
// punto y coma.
function exportarCosteoExcel(){
  const costeo = document.getElementById('dis-resumen-costeo');
  if(!costeo || !costeo.innerHTML.trim()){ alert('Primero calcula el costeo del programa (pestaña Diseñar Programa).'); return; }
  if(typeof XLSX === 'undefined'){ alert('No se pudo cargar la librería de Excel (revisa tu conexión a internet) — si el problema sigue, dímelo.'); return; }
  const nombre = document.getElementById('dis-nombre')?.value || 'programa';
  const filas = [['Concepto','Total grupo','Por pax']];
  costeo.querySelectorAll(':scope > .fila').forEach(f => {
    const spans = f.querySelectorAll(':scope > span');
    if(spans.length >= 3) filas.push([spans[0].textContent.trim(), spans[1].textContent.trim(), spans[2].textContent.trim()]);
    else if(spans.length === 2) filas.push([spans[0].textContent.trim(), spans[1].textContent.trim(), '']);
  });
  const tabla = costeo.querySelector('table');
  if(tabla){
    filas.push(['','','']);
    tabla.querySelectorAll('tr').forEach(tr => {
      const celdas = [...tr.children].map(td => td.textContent.trim());
      if(celdas.length) filas.push(celdas);
    });
  }
  const hoja = XLSX.utils.aoa_to_sheet(filas);
  hoja['!cols'] = [{wch:42},{wch:16},{wch:14},{wch:14},{wch:14}];
  // Encabezado de la fila 1 en negrita, si la celda existe.
  ['A1','B1','C1'].forEach(ref => { if(hoja[ref]) hoja[ref].s = {font:{bold:true}}; });
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, 'Costeo');
  XLSX.writeFile(libro, `costeo_${nombre.replace(/[^a-z0-9áéíóúñ]+/gi,'_')}.xlsx`);
}

// sugerirNombrePrograma() y desde los 3 documentos/vouchers en
// mostrarDocumento(), pero la función nunca quedó definida en el archivo
// (bug real, no de caché) — causaba "ReferenceError: duracionTexto is not
// defined" al intentar generar cualquier voucher. Mismo criterio que
// esUnDia (línea ~4578: p.dias === 1) para decidir "Full Day".
function duracionTexto(dias, noches){
  const d = parseInt(dias, 10) || 1;
  const n = parseInt(noches, 10) || 0;
  if(d === 1 && n === 0) return 'Full Day';
  return `${d} día${d === 1 ? '' : 's'} / ${n} noche${n === 1 ? '' : 's'}`;
}
// Fix sesión 31 (12-sep-2026): mismo patrón de bug que duracionTexto en
// sesión 30 — money() se usaba en mostrarDocumento() (voucher Interno,
// primero en encontrarlo, pero también Guía/Pasajero comparten la misma
// función) y en initCatalogoMayorista(), pero solo existía como const
// local dentro de la función de simulación de licenciamiento (línea
// ~3906), fuera de alcance para el resto del archivo — causaba
// "ReferenceError: money is not defined" al generar cualquier voucher.
// Se agrega aquí como función global; la definición local de línea 3906
// queda intacta (sombra inofensiva, misma lógica) para no tocar código
// que ya funcionaba.
function money(v){
  return '$' + (Number(v)||0).toLocaleString('es-EC', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function agruparPorDia(itin){
  const dias = {};
  (itin||[]).forEach(b => (dias[b.dia]=dias[b.dia]||[]).push(b));
  // Se respeta el orden en que se agregaron las actividades — no se reordena por hora.
  return dias;
}
// Genera una frase natural sin hora explícita, con conectores de
// continuidad variados según la posición del bloque en el día (evita
// que el voucher del pasajero suene repetitivo o mecánico). El guía y el
// documento interno sí siguen mostrando la hora exacta (la necesitan para
// operar) — esto es solo para la lectura del pasajero.
function narrarBloque(b, idx, total, numDia){
  idx = idx || 0; total = total || 1;
  const esUltimo = idx === total - 1;
  const actividadSegura = escapeHtml(b.actividad||'');
  const limpio = actividadSegura.replace(/^(salida hacia|traslado a)/i,'').trim();

  // Corrección (sesión 7, 15-ago-2026): un bloque "Actividad" agregado a
  // mano y nunca llenado (sin nombre) generaba una frase rota en el
  // voucher del pasajero — "Para comenzar, visitaremos ." con un punto
  // suelto. Ahora esos bloques no generan frase (se filtran antes de
  // narrar, ver narrarDia).

  // Inicio y fin de tour llevan su propia frase fija, sin conector encima
  // (antes se mezclaban "Iniciaremos con" + "iniciaremos el recorrido...",
  // duplicando el verbo — hallazgo de Héctor, 30-jul).
  // Obs. 9 (sesión 22, 1-sep-2026): Héctor pidió variar la redacción de
  // "Inicio de tour" según el día del itinerario, para que no suene
  // repetitivo en programas de varios días — día 1 usa la frase original
  // (opción A), día 2 la opción C (más directa), día 3 en adelante la
  // opción B (más cálida).
  if(b.tipo === 'Inicio de tour'){
    const dia = parseInt(numDia, 10) || 1;
    const lugarTxt = limpio ? ' en ' + limpio : '';
    if(dia === 2){
      return `Todo listo para arrancar: iniciamos el día${lugarTxt}`;
    }
    if(dia >= 3){
      return `Nuestro recorrido comenzará${lugarTxt}, donde te esperaremos listos para empezar la aventura`;
    }
    return `Iniciaremos el recorrido${lugarTxt}`;
  }
  if(b.tipo === 'Fin de tour'){
    return `Así llegamos al final de nuestro recorrido${limpio ? ' en ' + limpio : ''}`;
  }

  const conectoresMedio = ['Luego', 'Después', 'A continuación', 'Más tarde', 'Seguidamente', 'Posteriormente', 'Continuando con el recorrido'];
  // Obs. 9 (sesión 6, confirmado con captura de Héctor): si el primer bloque
  // del día no es literalmente tipo "Inicio de tour" (ej. "Punto de
  // encuentro"), idx=0 caía en el conector genérico y arrancaba con "Luego,
  // nos reuniremos..." — ilógico como primera frase del día, ya que "luego"
  // implica que pasó algo antes. Ahora el primer bloque de cada día usa un
  // conector de apertura; el resto sigue rotando por conectoresMedio.
  const esPrimero = idx === 0;
  const conector = esUltimo ? 'Para finalizar' : (esPrimero ? 'Para comenzar' : conectoresMedio[(idx-1) % conectoresMedio.length]);
  const frases = {
    'Punto de encuentro': `nos reuniremos en el punto de encuentro${limpio ? ', ' + limpio : ''}`,
    'Traslado': `nos trasladaremos hacia ${limpio || 'el siguiente punto'}`,
    'Comida': `disfrutaremos de ${actividadSegura}`,
    'Desayuno en hotel': `tomaremos el desayuno en el hotel`,
    'Alojamiento': `retornaremos al alojamiento para el descanso`,
    'Tiempo libre': `tendremos un espacio de tiempo libre`,
    'Actividad': `visitaremos ${actividadSegura}`,
  };
  const frase = frases[b.tipo] || actividadSegura;
  return `${conector}, ${frase}`;
}

// Código de programa (estable, se genera una sola vez) y número de
// cotización. Ambos se generan una sola vez al guardar el programa
// (ver guardarPrograma/datosProgramaActualOGuardado) y se persisten en
// codigo_generado/numero_cotizacion; los documentos los leen de ahí,
// nunca los regeneran, para que el número no cambie entre visualizaciones.
function generarCodigoPrograma(provinciaTexto){
  const pref = (provinciaTexto || 'GEN').normalize('NFD').replace(/[\u0300-\u036f]/g,'').slice(0,3).toUpperCase();
  return `DP-${pref}-${Date.now().toString(36).toUpperCase().slice(-6)}`;
}
function generarNumeroCotizacion(){
  const f = new Date();
  const fecha = `${f.getFullYear()}${String(f.getMonth()+1).padStart(2,'0')}${String(f.getDate()).padStart(2,'0')}`;
  return `COT-${fecha}-${Math.floor(1000+Math.random()*9000)}`;
}

// Sesión 26 (corrección de hallazgo de auditoría): antes esto leía siempre
// de los campos "Datos de la empresa" (emp-*), que vienen de la tabla
// global empresa_config — una sola fila para TODO el sistema. Cualquier
// agencia licenciataria imprimía vouchers con los datos de Héctor. Ahora
// se usa primero el tema de marca de la agencia conectada (ya sincronizado
// en cargarTemaSupabase() a localStorage), con el logo como imagen real —
// y solo si no hay nada ahí (cuenta sin agencia, o modo local histórico)
// se cae al viejo "Datos de la empresa" para no romper el caso de Héctor
// antes de que tuviera agencia asignada.
// Sesión 26: QR con los datos de contacto de la agencia en formato vCard
// — al escanearlo con la cámara del celular, se guarda el contacto
// directo sin teclear nada. Usa el servicio público api.qrserver.com
// (sin cuenta, sin costo) solo para generar la imagen; no manda datos
// del pasajero a ningún lado, solo el contacto de la agencia (que ya es
// público, está en el mismo documento como texto).
function qrContactoAgenciaHTML(tema){
  if(!tema || !(tema.telefono || tema.email)) return '';
  const lineas = ['BEGIN:VCARD','VERSION:3.0', `FN:${tema.nombre||'Agencia'}`];
  if(tema.telefono) lineas.push(`TEL:${tema.telefono}`);
  if(tema.email) lineas.push(`EMAIL:${tema.email}`);
  if(tema.sitioWeb) lineas.push(`URL:${tema.sitioWeb}`);
  lineas.push('END:VCARD');
  const url = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(lineas.join('\n'))}`;
  return `<div style="text-align:center;">
    <img src="${url}" alt="Código QR de contacto" style="width:74px;height:74px;">
    <div style="font-size:8.5px;color:var(--tinta-suave);max-width:80px;">Escanea para guardar nuestro contacto</div>
  </div>`;
}

// Combina la lista "Incluye" escrita a mano con ítems automáticos según
// qué componentes estén marcados como incluidos (Héctor, 31-jul): si
// alojamiento/transporte/alimentación/guía están activados, aparecen aquí
// solos, sin que Héctor tenga que escribirlos cada vez.
// Pedido de Héctor (08-ago sesión 3): orden fijo en "Incluye" —
// Alojamiento, Alimentación, Guía, Hidratación, Souvenirs, Actividades/
// entradas a atractivos. Transporte y cualquier línea manual que no
// calce con estas palabras clave quedan al final, en el orden en que ya
// estaban (sort estable).
const ORDEN_INCLUYE = ['alojamiento','alimentaci','guía','guia','hidrataci','souvenir','entrada','atractivo'];
function prioridadIncluye(texto){
  const t = (texto||'').toLowerCase();
  const idx = ORDEN_INCLUYE.findIndex(k => t.includes(k));
  return idx === -1 ? ORDEN_INCLUYE.length : idx;
}
function listaIncluyeCompleta(p, inc, esUnDia){
  // Corregido (11-ago sesión 4, obs. 1 de cambios_tur.docx): Héctor confirmó
  // que Transporte/Alimentación/Guía salían DUPLICADOS — la versión corta
  // que se auto-agregaba aquí, más la versión larga que ya trae la plantilla
  // de Supabase (plantilla_texto_programa). Se quita el auto-agregado y en
  // su lugar se filtra la lista manual (plantilla) según los flags
  // inc.transporte/alimentacion/guia, para conservar el poder ocultarlos si
  // Héctor desactiva ese componente en el programa.
  const conSeguro = (p.costo_seguro||0) > 0;
  const conSouvenir = (p.costo_souvenir||0) > 0;
  const conHidratacion = (p.costo_hidratacion_precio_botella||0) > 0 && (p.costo_hidratacion_botellas_dia||0) > 0;
  const manual = (p.incluye||[]).filter(item => {
    const t = (item||'').toLowerCase();
    if(!inc.transporte && t.includes('transporte')) return false;
    if(!inc.alimentacion && t.includes('alimentaci')) return false;
    if(!inc.guia && (t.includes('guía') || t.includes('guia'))) return false;
    // Obs. 5 de Observaciones_turismo.docx (sesión 22, 2-sep-2026): si el
    // souvenir, el seguro o la hidratación no tienen costo cargado, no
    // deben figurar como "incluidos" en el documento final — aunque la
    // lista guardada (plantilla por defecto o texto que Héctor personalizó
    // a mano) todavía los mencione. Solo se filtra lo que se IMPRIME aquí;
    // el texto guardado en el programa no se toca, así no se pierde nada
    // si luego Héctor sí carga un costo.
    if(!conSeguro && t.includes('seguro')) return false;
    if(!conSouvenir && t.includes('souvenir')) return false;
    if(!conHidratacion && t.includes('hidrataci')) return false;
    return true;
  });
  // Obs. 2 de cambios_tur.docx: si hay un valor > 0 en Seguro ($/pax), debe
  // aparecer automáticamente en "Incluye" (y se quita de "No incluye" en
  // mostrarDocumento, ver noIncluyeParaDocumento). Obs. 4 (12-ago sesión 5):
  // misma regla para Souvenir. Obs. 10 (sesión 6): misma regla para
  // Hidratación, con el número real de botellas/día.
  if(conSeguro){
    const idxSeguro = manual.findIndex(i => (i||'').toLowerCase().includes('seguro'));
    // Obs. 6 de Observaciones_turismo.docx (sesión 22, 2-sep-2026): Héctor
    // pidió que el seguro incluido diga únicamente "Seguro de asistencia de
    // viajes" — se renombra también en programas ya guardados que traían la
    // redacción vieja ("Seguro de viaje / asistencia médica incluido").
    if(idxSeguro >= 0) manual[idxSeguro] = 'Seguro de asistencia de viajes';
    else manual.push('Seguro de asistencia de viajes');
  }
  if(conSouvenir && !manual.some(i => (i||'').toLowerCase().includes('souvenir'))){
    manual.push('Souvenir de bienvenida por pasajero');
  }
  if(conHidratacion){
    const botellasDia = p.costo_hidratacion_botellas_dia;
    const idxHidrat = manual.findIndex(i => (i||'').toLowerCase().includes('hidrataci'));
    const textoHidrat = `Hidratación (${botellasDia} botella${botellasDia!=1?'s':''} de agua por pasajero por día)`;
    if(idxHidrat >= 0) manual[idxHidrat] = textoHidrat;
    else manual.push(textoHidrat);
  }
  // Obs. 4 de Observaciones_turismo.docx (sesión 22, 2-sep-2026): cuando
  // TODOS los hoteles elegidos del programa están cotizados en habitación
  // simple, la línea de alojamiento debe aclarar "(habitación simple)" en
  // vez del "(base habitación compartida)" por defecto de la plantilla —
  // ese texto por defecto asume el caso más común (compartida), pero deja
  // de ser cierto cuando el programa es todo en simple.
  const hoteles = p?.componentes_json?.hoteles || [];
  const todoSimple = hoteles.length > 0 && hoteles.every(h => h.tipoHabitacion === 'simple');
  if(todoSimple){
    const idxAloj = manual.findIndex(i => (i||'').toLowerCase().includes('categoría seleccionada'));
    if(idxAloj >= 0){
      manual[idxAloj] = manual[idxAloj].replace(/\(base habitaci[oó]n compartida\)/i, '(habitación simple)');
    }
  }
  return manual.sort((a,b) => prioridadIncluye(a) - prioridadIncluye(b));
}
// Compañera de listaIncluyeCompleta: quita de "No incluye" las líneas de
// seguro/souvenir cuando sí hay un valor cargado (para no contradecir "Incluye").
function noIncluyeParaDocumento(p){
  const conSeguro = (p.costo_seguro||0) > 0;
  const conSouvenir = (p.costo_souvenir||0) > 0;
  return (p.no_incluye||[]).filter(i => {
    const t = (i||'').toLowerCase();
    if(conSeguro && t.includes('seguro')) return false;
    if(conSouvenir && t.includes('souvenir')) return false;
    return true;
  });
}

// Sesión 26 (pedido de Héctor tras la auditoría de vouchers): descarga el
// documento actualmente abierto como PDF real, con html2pdf.js (html2canvas
// + jsPDF por debajo). Toma exactamente lo que se ve en pantalla —
// incluidas ediciones manuales hechas con "✏️ Editar" — así que siempre
// coincide con lo que Héctor ya revisó, sin generar el PDF por separado
// con otra lógica que se pueda desalinear.
function descargarPDF(){
  const area = document.getElementById('doc-editable-area');
  if(!area){ alert('No hay ningún documento abierto para descargar.'); return; }
  if(typeof html2pdf === 'undefined'){ alert('No se pudo cargar la librería de PDF (revisa tu conexión a internet) — si el problema sigue, dímelo.'); return; }
  const titulo = (area.querySelector('h1')?.textContent || 'documento').trim();
  html2pdf().set({
    margin: 10,
    filename: `${titulo.replace(/[^a-z0-9áéíóúñ ]+/gi,'').trim().replace(/\s+/g,'_') || 'documento'}.pdf`,
    image: {type:'jpeg', quality:0.95},
    html2canvas: {scale:2, useCORS:true},
    jsPDF: {unit:'mm', format:'a4', orientation:'portrait'},
    pagebreak: {mode:['avoid-all','css','legacy']}
  }).from(area).save();
}

// Envío por correo (sesión 26): abre el programa de correo del sistema
// operativo con destinatario, asunto y cuerpo prellenados — es un enlace
// mailto:, no un envío automático real. Un envío automático de verdad (sin
// abrir nada, con el PDF ya adjunto) necesitaría un servicio de correo
// transaccional con su propia clave de API (Resend, SendGrid, etc.), igual
// que la descripción por IA está pendiente de que Héctor cree esa clave —
// no se construyó esa parte porque implica que él elija y pague un
// servicio externo primero.
function enviarPorCorreoDocumento(id){
  const p = datosProgramaActualOGuardado(id || null);
  const asunto = encodeURIComponent(`${p.nombre || 'Tu programa turístico'} — itinerario y voucher`);
  const cuerpo = encodeURIComponent(`Hola${p.viajero_nombre ? ' '+p.viajero_nombre : ''},\n\nAdjunto el itinerario y voucher de "${p.nombre || 'tu programa'}".\n\nPrecio por pasajero: $${(p.precio_pax||0).toFixed(2)}\n\nSaludos.`);
  const destinatario = p.viajero_email ? encodeURIComponent(p.viajero_email) : '';
  window.location.href = `mailto:${destinatario}?subject=${asunto}&body=${cuerpo}`;
  setTimeout(() => alert('Se abrió tu programa de correo con el mensaje listo. Los enlaces "mailto" no permiten adjuntar archivos automáticamente — descarga primero el PDF con "📄 Descargar PDF" y adjúntalo a mano antes de enviar.'), 300);
}


// generado (agencia/pasajero/guía, catálogo fijo o Diseñar Programa) justo
// antes de imprimir/descargar, por si hay un error puntual (un nombre mal
// escrito, un dato que cambió a último momento, etc.). Es edición directa
// del texto ya generado — no reescribe los datos de origen del programa, así
// que no afecta cotizaciones futuras; si Héctor cierra y vuelve a abrir el
// documento, se regenera desde los datos originales, sin la corrección
// manual.
function toggleEdicionDocumento(){
  const area = document.getElementById('doc-editable-area');
  const boton = document.getElementById('doc-btn-editar');
  if(!area || !boton) return;
  const editando = area.contentEditable === 'true';
  area.contentEditable = editando ? 'false' : 'true';
  area.style.outline = editando ? '' : '2px dashed var(--grana)';
  area.style.padding = editando ? '' : '6px';
  boton.textContent = editando ? '✏️ Editar' : '💾 Listo (dejar de editar)';
}

async function cargarProgramasParaReserva(){
  const sel = document.getElementById('res-programa');
  if(!SUPABASE_ACTIVO){ sel.innerHTML = '<option value="">Sin conexión a Supabase</option>'; return; }
  sel.innerHTML = '<option value="">Cargando…</option>';
  const r = await supabaseFetch('programa_generado', 'select=id,nombre,precio_pax,componentes_json&estado=eq.activo&order=created_at.desc');
  if(!r.ok || !r.data.length){ sel.innerHTML = '<option value="">Sin programas guardados</option>'; return; }
  window._programasReservaCache = Object.fromEntries(r.data.map(p=>[p.id,p]));
  sel.innerHTML = r.data.map(p => `<option value="${p.id}">${escapeHtml(p.nombre)}</option>`).join('');
  autocompletarPrecioReserva();
}

function autocompletarPrecioReserva(){
  const id = document.getElementById('res-programa').value;
  const campoPrecio = document.getElementById('res-precio-pax');
  const campoNino = document.getElementById('res-precio-pax-nino');
  const campoTE = document.getElementById('res-precio-pax-te');
  const p = window._programasReservaCache && window._programasReservaCache[id];
  if(p && p.precio_pax) campoPrecio.value = p.precio_pax;
  const cj = p && p.componentes_json;
  campoNino.value = cj && cj.precioPaxNino ? cj.precioPaxNino : (p && p.precio_pax ? (p.precio_pax*0.5).toFixed(2) : '');
  campoTE.value = cj && cj.precioPaxTE ? cj.precioPaxTE : (p && p.precio_pax ? (p.precio_pax*0.5).toFixed(2) : '');
}

async function crearGrupo(){
  const idPrograma = document.getElementById('res-programa').value;
  const fecha = document.getElementById('res-fecha').value;
  const cupo = parseInt(document.getElementById('res-cupo').value || '0', 10);
  const precioPax = parseFloat(document.getElementById('res-precio-pax').value || '0') || null;
  const precioPaxNino = parseFloat(document.getElementById('res-precio-pax-nino').value || '0') || null;
  const precioPaxTE = parseFloat(document.getElementById('res-precio-pax-te').value || '0') || null;
  const notas = document.getElementById('res-notas').value || null;

  if(!idPrograma){ alert('Elige un programa.'); return; }
  if(!fecha){ alert('Elige la fecha de salida.'); return; }
  if(!cupo || cupo < 1){ alert('El cupo objetivo debe ser al menos 1.'); return; }

  const p = window._programasReservaCache && window._programasReservaCache[idPrograma];
  const cuerpo = {origen:'disenado', fecha_salida:fecha, cupo_objetivo:cupo, precio_pax:precioPax, precio_pax_nino:precioPaxNino, precio_pax_te:precioPaxTE, notas, estado:'abierto', nombre_programa: p ? p.nombre : 'Programa diseñado', programa_generado_id:idPrograma};

  const r = await supabaseWrite('grupo_salida', 'POST', cuerpo);
  if(!r.ok){ alert('No se pudo crear el grupo: ' + r.motivo); return; }
  document.getElementById('res-notas').value = '';
  cargarGrupos();
}

async function cargarGrupos(){
  const cont = document.getElementById('res-lista-grupos');
  if(!cont) return;
  if(!SUPABASE_ACTIVO){ cont.innerHTML = '<div class="hueco">Sin conexión a Supabase.</div>'; return; }
  const filtro = document.getElementById('res-filtro-estado')?.value;
  let query = 'select=*,reserva_pasajero(id,nombre_cliente,telefono,email,numero_pax,pax_adultos,pax_ninos,pax_terceraedad,monto_total,monto_pagado,estado_pago,notas,fecha_reserva)&fecha_eliminacion=is.null&order=fecha_salida.asc';
  if(filtro) query += `&estado=eq.${filtro}`;
  const r = await supabaseFetch('grupo_salida', query);
  if(!r.ok){ cont.innerHTML = `<div class="hueco">${r.motivo}</div>`; return; }
  if(!r.data.length){ cont.innerHTML = '<div class="hueco">Sin grupos de reserva todavía.</div>'; return; }
  gruposCache = Object.fromEntries(r.data.map(g=>[g.id,g]));
  renderGrupos();
}

function renderGrupos(){
  const cont = document.getElementById('res-lista-grupos');
  if(!cont) return;
  const grupos = Object.values(gruposCache);
  cont.innerHTML = grupos.map(g => {
    const ocupado = (g.reserva_pasajero||[]).reduce((s,r)=>s+r.numero_pax,0);
    const ocupadoAdultos = (g.reserva_pasajero||[]).reduce((s,r)=>s+(r.pax_adultos||0),0);
    const ocupadoNinos = (g.reserva_pasajero||[]).reduce((s,r)=>s+(r.pax_ninos||0),0);
    const ocupadoTE = (g.reserva_pasajero||[]).reduce((s,r)=>s+(r.pax_terceraedad||0),0);
    // Obs. 12 (sesión 6): contador de pax abonados/pagados, sin tener que
    // abrir "Ver reservas" — abonado = estado_pago 'anticipo', pagado =
    // 'pagado_completo'. Pendiente se puede inferir (ocupado − los otros dos).
    const paxPagados = (g.reserva_pasajero||[]).filter(r=>r.estado_pago==='pagado_completo').reduce((s,r)=>s+r.numero_pax,0);
    const paxAbonados = (g.reserva_pasajero||[]).filter(r=>r.estado_pago==='anticipo').reduce((s,r)=>s+r.numero_pax,0);
    const paxPendientes = Math.max(0, ocupado - paxPagados - paxAbonados);
    const pct = Math.min(100, Math.round((ocupado / g.cupo_objetivo) * 100));
    const gratuidadesSugeridas = Math.floor(ocupado/16); // misma regla 1×16 confirmada por Héctor
    const detalle = !!detalleAbierto[g.id];
    return `
    <div class="tarjeta-programa">
      <h4>${escapeHtml(g.nombre_programa)} <span class="badge-estado ${g.estado}">${g.estado}</span></h4>
      <div class="meta">Salida: ${new Date(g.fecha_salida+'T00:00:00').toLocaleDateString('es-EC')} · ${ocupado}/${g.cupo_objetivo} pax
        ${ocupadoAdultos ? ` · Adultos: ${ocupadoAdultos}` : ''}${ocupadoNinos ? ` · Niños: ${ocupadoNinos}` : ''}${ocupadoTE ? ` · 3ra edad: ${ocupadoTE}` : ''}${gratuidadesSugeridas > 0 ? ` · gratuidades sugeridas: ${gratuidadesSugeridas} (1 cada 16)` : ''}</div>
      ${ocupado > 0 ? `<div class="meta">Pagados: ${paxPagados} · Abonados: ${paxAbonados}${paxPendientes>0?` · Pendientes: ${paxPendientes}`:''}</div>` : ''}
      <div class="progreso-barra"><div class="progreso-fill" style="width:${pct}%;"></div></div>
      ${g.notas ? `<div class="meta">Notas: ${escapeHtml(g.notas)}</div>` : ''}
      <div class="acciones">
        <button onclick="toggleDetalleGrupo('${g.id}')">${detalle ? 'Ocultar reservas' : 'Ver reservas'}</button>
        ${g.estado !== 'cerrado' && g.estado !== 'cancelado' ? `<button onclick="cambiarEstadoGrupo('${g.id}','cerrado')">Cerrar</button>` : ''}
        ${g.estado !== 'cancelado' ? `<button onclick="cambiarEstadoGrupo('${g.id}','cancelado')" style="color:var(--critico);">Cancelar</button>` : ''}
        ${(g.estado === 'cerrado' || g.estado === 'cancelado') ? `<button onclick="cambiarEstadoGrupo('${g.id}','abierto')">Reabrir</button>` : ''}
        <button onclick="moverGrupoAPapelera('${g.id}')" style="color:var(--critico);">🗑 Eliminar</button>
      </div>
      ${detalle ? renderDetalleGrupo(g) : ''}
    </div>`;
  }).join('');
}

function previsualizarMontoReserva(grupoId){
  const grupo = gruposCache[grupoId];
  const el = document.getElementById(`res-nueva-preview-${grupoId}`);
  if(!grupo || !el) return;
  const adultos = parseInt(document.getElementById(`res-nueva-adultos-${grupoId}`)?.value || '0', 10);
  const ninos = parseInt(document.getElementById(`res-nueva-ninos-${grupoId}`)?.value || '0', 10);
  const te = parseInt(document.getElementById(`res-nueva-te-${grupoId}`)?.value || '0', 10);
  const total = (adultos*(grupo.precio_pax||0)) + (ninos*(grupo.precio_pax_nino||0)) + (te*(grupo.precio_pax_te||0));
  el.textContent = `Total estimado: $${total.toFixed(2)}`;
}

function toggleDetalleGrupo(id){ detalleAbierto[id] = !detalleAbierto[id]; renderGrupos(); }

async function agregarReserva(grupoId){
  const nombre = document.getElementById(`res-nueva-nombre-${grupoId}`).value.trim();
  if(!nombre){ alert('El nombre del cliente es obligatorio.'); return; }
  const telefono = document.getElementById(`res-nueva-tel-${grupoId}`).value || null;
  const email = document.getElementById(`res-nueva-email-${grupoId}`).value || null;
  const consentimiento = document.getElementById(`res-nueva-consentimiento-${grupoId}`)?.checked;
  if(!consentimiento){
    alert('Marca la casilla de autorización de datos personales antes de guardar (LOPDP) — el pasajero debe haber autorizado el uso de su nombre y contacto.');
    return;
  }
  const adultos = Math.max(0, parseInt(document.getElementById(`res-nueva-adultos-${grupoId}`).value || '0', 10));
  const ninos = Math.max(0, parseInt(document.getElementById(`res-nueva-ninos-${grupoId}`).value || '0', 10));
  const te = Math.max(0, parseInt(document.getElementById(`res-nueva-te-${grupoId}`).value || '0', 10));
  const pax = adultos + ninos + te;
  if(pax < 1){ alert('Ingresa al menos 1 pasajero (adulto, niño o tercera edad).'); return; }
  const pagado = parseFloat(document.getElementById(`res-nueva-pagado-${grupoId}`).value || '0') || 0;
  const estadoPago = document.getElementById(`res-nueva-estadopago-${grupoId}`).value;
  const grupo = gruposCache[grupoId];
  const montoTotal = grupo ? +((adultos*(grupo.precio_pax||0)) + (ninos*(grupo.precio_pax_nino||0)) + (te*(grupo.precio_pax_te||0))).toFixed(2) : null;

  const r = await supabaseWrite('reserva_pasajero', 'POST', {
    grupo_id: grupoId, nombre_cliente: nombre, telefono, email,
    numero_pax: pax, pax_adultos: adultos, pax_ninos: ninos, pax_terceraedad: te,
    monto_total: montoTotal, monto_pagado: pagado, estado_pago: estadoPago,
    consentimiento_registrado: !!consentimiento, consentimiento_en: consentimiento ? new Date().toISOString() : null,
  });
  if(!r.ok){ alert('No se pudo agregar la reserva: ' + r.motivo); return; }
  detalleAbierto[grupoId] = true;
  cargarGrupos();
}

async function eliminarReserva(reservaId, grupoId){
  if(!confirm('¿Eliminar esta reserva?')) return;
  const r = await supabaseWrite('reserva_pasajero', 'DELETE', undefined, `id=eq.${reservaId}`);
  if(!r.ok){ alert('No se pudo eliminar: ' + r.motivo); return; }
  detalleAbierto[grupoId] = true;
  cargarGrupos();
}

async function cambiarEstadoGrupo(id, nuevoEstado){
  const r = await supabaseWrite('grupo_salida', 'PATCH', {estado: nuevoEstado}, `id=eq.${id}`);
  if(!r.ok){ alert('No se pudo actualizar el estado: ' + r.motivo); return; }
  cargarGrupos();
}

// Papelera de reciclaje para Gestión de Reservas (ronda 10, pedido de
// Héctor). Mismo patrón que la papelera de programas guardados, pero sin
// tocar la columna `estado` (abierto/cerrado/cancelado es un dato de
// negocio que se conserva). Las reservas de la salida se quedan intactas
// mientras está en la papelera — solo se borran si se elimina definitivo.
async function moverGrupoAPapelera(id){
  if(!confirm('¿Mover esta salida a la papelera? Sus reservas se conservan y se recuperan junto con ella si la restauras.')) return;
  const r = await supabaseWrite('grupo_salida', 'PATCH', {fecha_eliminacion: new Date().toISOString()}, `id=eq.${id}`);
  if(!r.ok){ alert('No se pudo mover a la papelera: ' + r.motivo); return; }
  cargarGrupos();
}
async function restaurarGrupo(id){
  const r = await supabaseWrite('grupo_salida', 'PATCH', {fecha_eliminacion: null}, `id=eq.${id}`);
  if(!r.ok){ alert('No se pudo restaurar: ' + r.motivo); return; }
  verPapeleraGrupos();
}
async function eliminarGrupoDefinitivo(id){
  if(!confirm('Esto borra la salida y TODAS sus reservas para siempre. ¿Continuar?')) return;
  await supabaseWrite('reserva_pasajero', 'DELETE', undefined, `grupo_id=eq.${id}`);
  const r = await supabaseWrite('grupo_salida', 'DELETE', undefined, `id=eq.${id}`);
  if(!r.ok){ alert('No se pudo eliminar: ' + r.motivo); return; }
  verPapeleraGrupos();
}
async function vaciarPapeleraGrupos(){
  if(!confirm('Esto borra TODAS las salidas de la papelera (y todas sus reservas) para siempre. ¿Continuar?')) return;
  const r = await supabaseFetch('grupo_salida', 'select=id&fecha_eliminacion=not.is.null');
  const ids = r.ok ? r.data.map(g=>g.id) : [];
  for(const id of ids){ await supabaseWrite('reserva_pasajero', 'DELETE', undefined, `grupo_id=eq.${id}`); }
  await supabaseWrite('grupo_salida', 'DELETE', undefined, 'fecha_eliminacion=not.is.null');
  verPapeleraGrupos();
}
async function purgarPapeleraGruposAutomatica(){
  const limite = new Date(Date.now()-30*24*60*60*1000).toISOString();
  const r = await supabaseFetch('grupo_salida', `select=id&fecha_eliminacion=lt.${limite}`).catch(()=>null);
  const ids = (r && r.ok) ? r.data.map(g=>g.id) : [];
  for(const id of ids){ await supabaseWrite('reserva_pasajero', 'DELETE', undefined, `grupo_id=eq.${id}`).catch(()=>{}); }
  if(ids.length) await supabaseWrite('grupo_salida', 'DELETE', undefined, `fecha_eliminacion=lt.${limite}`).catch(()=>{});
}
async function verPapeleraGrupos(){
  const r = await supabaseFetch('grupo_salida', 'select=*&fecha_eliminacion=not.is.null&order=fecha_eliminacion.desc');
  const modal = document.getElementById('dis-documento-modal');
  modal.style.display = 'block';
  const filas = r.ok ? r.data : [];
  modal.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this) cerrarModal()">
    <div style="background:#fff;color:var(--tinta);max-width:700px;width:90%;max-height:80vh;overflow-y:auto;padding:24px;border-radius:4px;">
      <h2 style="font-family:'Fraunces',serif;color:var(--tinta);">Papelera de reciclaje — Salidas de reserva</h2>
      <p style="font-size:12.5px;color:var(--tinta-suave);">Se vacía automáticamente a los 30 días. Al restaurar, la salida vuelve con su estado anterior y todas sus reservas intactas.</p>
      ${filas.length===0 ? '<div class="hueco">Papelera vacía.</div>' : filas.map(g=>`
        <div class="tarjeta-programa"><h4>${escapeHtml(g.nombre_programa)}</h4><div class="meta">Eliminada: ${new Date(g.fecha_eliminacion).toLocaleDateString('es-EC')} · Salida original: ${new Date(g.fecha_salida+'T00:00:00').toLocaleDateString('es-EC')}</div>
        <div class="acciones"><button onclick="restaurarGrupo('${g.id}')">Restaurar</button><button onclick="eliminarGrupoDefinitivo('${g.id}')" style="color:var(--critico);">Eliminar definitivo</button></div></div>`).join('')}
      ${filas.length>0 ? '<button class="btn" style="margin-top:12px;" onclick="vaciarPapeleraGrupos()">Vaciar papelera completa</button>' : ''}
      <button class="btn fantasma no-print" style="margin-top:12px;" onclick="cerrarModal()">Cerrar</button>
    </div></div>`;
}

function rankearPorConfianza(lista){
  return [...lista].sort((a,b) => {
    const ca = (RANGO_CONFIANZA[a.nivel_confianza] ?? 0) - (RANGO_CONFIANZA[b.nivel_confianza] ?? 0);
    if(ca !== 0) return -ca;
    const va = (RANGO_VERIFICACION[a.estado_verificacion] ?? -1) - (RANGO_VERIFICACION[b.estado_verificacion] ?? -1);
    return -va;
  });
}

// Selección del usuario en "Sugerido para ti" (checkboxes) y caché de los
// objetos completos para poder pasarlos tal cual a "Diseñar Programa".
let sugSeleccion = { hoteles:[], restaurantes:[], transportes:[], atractivos:[], guias:[] };
let sugCache = { hoteles:{}, restaurantes:{}, transportes:{}, atractivos:{}, guias:{} };

function toggleSugSeleccion(clave, id, marcado){
  if(marcado){
    const item = sugCache[clave][id];
    if(item && !sugSeleccion[clave].some(x => x.id === id)) sugSeleccion[clave].push(item);
  } else {
    sugSeleccion[clave] = sugSeleccion[clave].filter(x => x.id !== id);
  }
  const el = document.getElementById('sug-contador-seleccion');
  if(el){
    const total = Object.values(sugSeleccion).reduce((n,arr) => n+arr.length, 0);
    el.textContent = total ? `${total} elemento(s) seleccionados para el programa.` : 'Nada seleccionado todavía — marca las casillas de lo que quieras incluir.';
  }
}

    supabaseFetch('proveedor', `select=id,nombre_comercial,canton_id,provincia_id,nivel_confianza,estado_verificacion,especialidad,rango_precio_texto&provincia_id=${enLista}&tipo_proveedor_id=eq.${await idTipoProveedor('Restaurante')}&activo=eq.true`),

  ]);

  let sugSeccionContador = 0;
  // Un solo grupo (lista plana, tope=N) o varios (uno por provincia, mismo
  // tope aplicado dentro de cada provincia) según cuántas provincias eligió.
  const grupoHtml = (clave, lista, render, tope) => {
    const ordenado = rankearPorConfianza(lista);
    ordenado.forEach(item => { sugCache[clave][item.id] = item; });
    const visibles = ordenado.slice(0, tope);
    const ocultos = ordenado.slice(tope);
    sugSeccionContador++;

      <div style="padding:8px 10px;border:1px solid var(--linea);border-radius:6px;display:flex;gap:8px;align-items:flex-start;min-width:0;">
        <input type="checkbox" style="margin-top:3px;flex-shrink:0;" onchange="toggleSugSeleccion('${clave}','${item.id}', this.checked)">

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 10px;">${visibles.map(fila).join('')}</div>

  };

  const seccion = (titulo, clave, r, render, tope=3, avisoFiltroExtra='') => {
    if(!r.ok) return `<div class="ticket"><b>${titulo}</b><div class="hueco">Error consultando Supabase: ${r.motivo}</div></div>`;

      const mensaje = avisoFiltroExtra
        ? `Hay proveedores de este tipo en la(s) provincia(s) elegida(s), pero ninguno calza con el filtro "${avisoFiltroExtra}". Prueba quitando ese filtro.`

    if(provIds.length <= 1){
      return `<div class="ticket" style="cursor:default;">

    }
    // Varias provincias: subagrupar, una sub-sección por provincia (pedido de Héctor, ronda 8 — antes salían todas mezcladas).
    const porProvincia = {};
    r.data.forEach(item => { (porProvincia[item.provincia_id] ||= []).push(item); });
    const subgrupos = provIds
      .filter(pid => porProvincia[pid]?.length)
      .map(pid => `
        <div style="margin-top:10px;padding-top:8px;">
          <div style="font-size:12px;font-weight:600;color:var(--oro);text-transform:uppercase;letter-spacing:.03em;">${sugProvincias[pid] || 'Provincia'} <span class="sub" style="font-weight:400;text-transform:none;">(${porProvincia[pid].length})</span></div>
          ${grupoHtml(clave, porProvincia[pid], render, tope)}

      .join('');
    return `<div class="ticket" style="cursor:default;">
      <b>${titulo}</b> <span class="sub" style="font-size:12px;">(${r.data.length} encontrados en ${Object.keys(porProvincia).length} provincia(s))</span>
      ${subgrupos}
    </div>`;
  };

  cont.innerHTML = `
    <div style="display:grid;gap:14px;">
      <div id="sug-seccion-hospedaje">${seccion('🏨 Hospedaje', 'hoteles', rHotel, p => `
        <div style="font-weight:600;">${escapeHtml(p.nombre_comercial)}</div>
        <div class="ticket-meta">${sugCategoriasHotel[p.categoria_hotel_id] || 'sin categoría registrada'} ${p.rango_precio_texto ? '· '+p.rango_precio_texto : ''} ${badgeConfianza(p.nivel_confianza)}</div>`,
        3, categoriaId ? `Categoría de hotel: ${sugCategoriasHotel[categoriaId] || ''}` : '')}</div>
      ${seccion('🍽️ Gastronomía', 'restaurantes', rRest, p => `
        <div style="font-weight:600;">${escapeHtml(p.nombre_comercial)}</div>
        <div class="ticket-meta">${p.especialidad || 'especialidad no registrada'} ${badgeConfianza(p.nivel_confianza)}</div>`)}
      ${seccion('📍 Atractivos', 'atractivos', rAtr, a => `
        <div style="font-weight:600;">${escapeHtml(a.nombre)}</div>
        <div class="ticket-meta">${a.tarifa_adulto != null ? money(a.tarifa_adulto)+' adulto' : 'tarifa no confirmada'} ${a.duracion_visita_min ? '· ~'+a.duracion_visita_min+' min visita' : ''} ${badgeConfianza(a.nivel_confianza)}</div>`,
        5, interesId ? `Tipo de turismo: ${sugTiposTurismo[interesId] || ''}` : '')}
      ${seccion('🚌 Transporte', 'transportes', rTrans, p => `
        <div style="font-weight:600;">${escapeHtml(p.nombre_comercial)}</div>
        <div class="ticket-meta">${p.tipo_transporte || 'tipo no registrado'} ${p.capacidad_texto ? '· '+p.capacidad_texto : ''} ${badgeConfianza(p.nivel_confianza)}</div>`)}
      ${seccion('🧑‍🏫 Guías', 'guias', rGuia, g => `
        <div style="font-weight:600;">${escapeHtml(g.nombre)}</div>
        <div class="ticket-meta">${g.tipo_guia || 'tipo no registrado'} ${g.idiomas ? '· '+g.idiomas : ''} ${badgeConfianza(g.nivel_confianza)}</div>`)}
    </div>
    <div style="margin-top:16px;padding:14px 16px;background:var(--papel-2);border:1px solid var(--linea);border-radius:var(--radius);">
      <div id="sug-contador-seleccion" style="font-size:13px;margin-bottom:10px;">Nada seleccionado todavía — marca las casillas de lo que quieras incluir en el programa.</div>

function armarProgramaDesdeSugerido(provIds){
  const total = Object.values(sugSeleccion).reduce((n,arr) => n+arr.length, 0);
  if(total === 0){ alert('Selecciona al menos un hotel, restaurante, atractivo, transporte o guía antes de armar el programa.'); return; }

  const dias = document.getElementById('sug-dias')?.value || '1';
  const nombre = sugProvincias[provIds[0]];

  cambiarVista('disenador');
  document.getElementById('tab-disenador').classList.add('activo');
  document.getElementById('tab-sugerido').classList.remove('activo');

  setTimeout(() => {
    // Corregido (11-ago sesión 4, obs. 8/11 de cambios_tur.docx): estos flags
    // globales ("congelado a mano") y los campos de precio final quedaban con
    // el valor de la ÚLTIMA edición manual de OTRO programa — Héctor veía
    // precios como $156/$81/$81 en un programa recién armado desde Sugerido
    // que nunca los había escrito. Se limpian aquí para que el programa
    // nuevo siempre arranque con el precio recalculado desde cero.
    window._pxDirty = {adulto:false, nino:false, te:false};
    window._alimentacionDirty = false;
    window._guiaDirty = false;
    ['dis-precio-pax','dis-precio-pax-nino','dis-precio-pax-te'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });

    const selDias = document.getElementById('dis-dias');
    if(selDias){ selDias.value = dias; actualizarNoches(); actualizarVisibilidadRuta(); }

    const selProv = document.getElementById('dis-provincia');
    if(selProv && nombre){ selProv.value = nombre; selProv.dispatchEvent(new Event('change')); }

    componentesElegidos = {
      hoteles: sugSeleccion.hoteles.map(h => ({...h, categoriaEtiqueta: sugCategoriasHotel[h.categoria_hotel_id] || '', diaDesde:1, diaHasta:parseInt(dias,10)||1, incluyeDesayuno:true})),
      restaurantes: [...sugSeleccion.restaurantes],
      transportes: [...sugSeleccion.transportes],
      atractivos: [...sugSeleccion.atractivos],
      guias: [...sugSeleccion.guias],
    };
    renderChipsSeleccionados();
    generarItinerarioBasicoDesdeSugerido(parseInt(dias,10)||1);
    recalcularCosteo();
    sugerirNombrePrograma();
  }, 250);
}

// Antes de esta función, al "Armar programa" desde Sugerido para ti no se
// transfería ningún itinerario (Héctor, 31-jul) — solo los componentes.
// Esto arma un borrador de itinerario repartiendo atractivos y
// restaurantes entre los días disponibles, para que Diseñar Programa no
// arranque vacío. Todo queda editable después.
function generarItinerarioBasicoDesdeSugerido(dias){
  itinerarioActual = [];
  const atractivos = [...sugSeleccion.atractivos];
  const restaurantes = [...sugSeleccion.restaurantes];
  const hayHotel = sugSeleccion.hoteles.length > 0;
  let hora = '08:00';
  for(let dia=1; dia<=dias; dia++){
    if(dia===1){
      itinerarioActual.push({dia, hora, actividad:'Punto de encuentro', duracion:0, traslado:15, tipo:'Inicio de tour'});
      hora = sumarMinutos(hora, 15);
    }
    const restauranteDia = restaurantes[(dia-1) % restaurantes.length];
    if(restauranteDia){
      itinerarioActual.push({dia, hora, actividad:restauranteDia.nombre_comercial, duracion:45, traslado:15, tipo:'Comida'});
      hora = sumarMinutos(hora, 60);
    }
    // Hasta 2 atractivos por día, repartidos en orden entre los elegidos.
    for(let n=0; n<2; n++){
      const idxA = (dia-1)*2 + n;
      if(idxA < atractivos.length){
        itinerarioActual.push({dia, hora, actividad:atractivos[idxA].nombre, duracion:90, traslado:15, tipo:'Actividad'});
        hora = sumarMinutos(hora, 105);
      }
    }
    if(hayHotel && dia < dias){
      itinerarioActual.push({dia, hora, actividad:'Retorno al hotel', duracion:0, traslado:0, tipo:'Alojamiento'});
    }
    if(dia===dias){
      itinerarioActual.push({dia, hora, actividad:'Fin del recorrido', duracion:0, traslado:0, tipo:'Fin de tour'});
    }
    hora = '08:00';
  }
  renderItinerario();
}

// PERSONALIZACIÓN DE MARCA (WHITE-LABEL) — para licencias comerciales.
// El licenciatario puede reemplazar el nombre, logo, colores y datos de
// contacto sin tocar el código. Se guarda en la tabla `agencia` de
// Supabase (fila propia de cada agencia, sesión 23/26) para que el tema
// y el encabezado de los vouchers viajen con la cuenta a cualquier
// dispositivo; localStorage se usa solo como caché instantáneo y
// respaldo si no hay conexión.
// ============================================================
const TEMA_DEFECTO = {
  nombre:'SMTRE',
  basalto:'#1E2A2A',
  basalto2:'#27403C',
  oro:'#C79A3E',
  grana:'#B5654F',
  paramo:'#5B8C6B',
  logoUrl:'',
  // Sesión 26: datos de contacto por agencia, para que el encabezado del
  // voucher impreso (encabezadoEmpresa) muestre la marca real de quien
  // esté usando la licencia, no siempre la de Héctor (hallazgo de la
  // auditoría de vouchers: antes el encabezado leía de empresa_config,
  // una sola fila global compartida por todas las agencias).
  direccion:'',
  telefono:'',
  email:'',
  sitioWeb:'',
};
const TEMA_STORAGE_KEY = 'smtre_tema_marca';

function aplicarTema(t){
  const raiz = document.documentElement.style;
  raiz.setProperty('--basalto', t.basalto);
  raiz.setProperty('--basalto-2', t.basalto2);
  raiz.setProperty('--oro', t.oro);
  raiz.setProperty('--grana', t.grana);
  raiz.setProperty('--paramo', t.paramo);
  const marca = document.getElementById('marca-nombre');
  if(marca) marca.innerHTML = `${t.logoUrl ? `<img src="${escapeHtml(t.logoUrl)}" alt="" style="height:22px;vertical-align:middle;margin-right:6px;border-radius:3px;">` : ''}${escapeHtml(t.nombre || TEMA_DEFECTO.nombre)}`;
  document.title = `Cotizador de Turismo — ${t.nombre || TEMA_DEFECTO.nombre}`;
}

function cargarTemaCache(){
  try{
    const guardado = localStorage.getItem(TEMA_STORAGE_KEY);
    if(guardado) aplicarTema({...TEMA_DEFECTO, ...JSON.parse(guardado)});
  }catch(e){ console.error('No se pudo leer el tema en caché:', e); }
}

async function cargarTemaSupabase(){
  if(!SUPABASE_ACTIVO) return;
  try{
    const s = obtenerSesion();
    if(!s?.agencia_id){
      // Sin sesión o sin agencia asignada todavía: se queda con el tema
      // en caché local (o el de por defecto), sin intentar sincronizar.
      return;
    }
    const r = await supabaseFetch('agencia', `select=nombre,logo_url,color_primario,color_primario_claro,color_acento,color_secundario,color_exito,direccion,telefono,email,sitio_web&id=eq.${s.agencia_id}`);
    if(r.ok && r.data[0]){
      const e = r.data[0];
      const t = {
        nombre: e.nombre || TEMA_DEFECTO.nombre,
        basalto: e.color_primario || TEMA_DEFECTO.basalto,
        basalto2: e.color_primario_claro || TEMA_DEFECTO.basalto2,
        oro: e.color_acento || TEMA_DEFECTO.oro,
        grana: e.color_secundario || TEMA_DEFECTO.grana,
        paramo: e.color_exito || TEMA_DEFECTO.paramo,
        logoUrl: e.logo_url || '',
        direccion: e.direccion || '',
        telefono: e.telefono || '',
        email: e.email || '',
        sitioWeb: e.sitio_web || '',
      };
      if([e.nombre,e.color_primario,e.color_primario_claro,e.color_acento,e.color_secundario,e.color_exito,e.logo_url,e.direccion,e.telefono,e.email,e.sitio_web].some(v=>v)){
        aplicarTema(t);
        localStorage.setItem(TEMA_STORAGE_KEY, JSON.stringify(t));
      }
    }
  }catch(e){ console.error('No se pudo sincronizar el tema con Supabase:', e); }
}

async function buscarProveedorExistente(){
  const cont = document.getElementById('bp-resultados');
  const texto = document.getElementById('bp-nombre').value.trim();
  const tipoFiltro = document.getElementById('bp-tipo').value;
  // Obs.5 (sesión 25): antes exigía texto; ahora una búsqueda en blanco
  // lista todos los registros (del tipo elegido, o de los 3 grupos si
  // "Todos"), con un límite por tabla más alto para poder navegar el
  // catálogo sin tener que recordar el nombre exacto.
  const enBlanco = !texto;
  const limite = enBlanco ? 30 : 15;
  cont.innerHTML = `<div style="font-size:12px;color:var(--tinta-suave);">${enBlanco ? 'Listando…' : 'Buscando…'}</div>`;
  const q = encodeURIComponent(texto);
  const filtroNombre = campo => enBlanco ? '' : `&${campo}=ilike.*${q}*`;
  const tareas = [];
  if(tipoFiltro==='todos' || ['hotel','restaurante','transporte'].includes(tipoFiltro)){
    tareas.push(supabaseFetch('proveedor', `select=id,nombre_comercial,ciudad,nivel_confianza,descripcion,cat_tipo_proveedor(nombre)${filtroNombre('nombre_comercial')}&order=nombre_comercial&limit=${limite}`)
      .then(r => (r.ok?r.data:[]).map(x => ({tabla:'proveedor', id:x.id, nombre:x.nombre_comercial, tipo_label:x.cat_tipo_proveedor?.nombre||'Proveedor', ciudad:x.ciudad, nivel_confianza:x.nivel_confianza, tiene_descripcion: !!x.descripcion}))));
  }
  if(tipoFiltro==='todos' || tipoFiltro==='atractivo'){
    tareas.push(supabaseFetch('atractivo', `select=id,nombre,parroquia,nivel_confianza,descripcion${filtroNombre('nombre')}&order=nombre&limit=${limite}`)
      .then(r => (r.ok?r.data:[]).map(x => ({tabla:'atractivo', id:x.id, nombre:x.nombre, tipo_label:'Atractivo', ciudad:x.parroquia, nivel_confianza:x.nivel_confianza, tiene_descripcion: !!x.descripcion}))));
  }
  if(tipoFiltro==='todos' || tipoFiltro==='guia'){
    tareas.push(supabaseFetch('guia', `select=id,nombre,ciudad,nivel_confianza,descripcion${filtroNombre('nombre')}&order=nombre&limit=${limite}`)
      .then(r => (r.ok?r.data:[]).map(x => ({tabla:'guia', id:x.id, nombre:x.nombre, tipo_label:'Guía', ciudad:x.ciudad, nivel_confianza:x.nivel_confianza, tiene_descripcion: !!x.descripcion}))));
  }
  const listas = await Promise.all(tareas);
  const resultados = listas.flat();
  if(resultados.length === 0){ cont.innerHTML = '<div style="font-size:12px;color:var(--tinta-suave);">Sin resultados.</div>'; return; }
  const aviso = enBlanco ? `<div style="font-size:11px;color:var(--tinta-suave);margin-bottom:8px;">Mostrando hasta ${limite} por tipo — escribe parte del nombre para acotar más.</div>` : '';
  cont.innerHTML = aviso + resultados.map(r => `
    <div style="padding:8px 10px;border:1px solid var(--linea);border-radius:5px;margin-bottom:6px;cursor:pointer;font-size:13px;" onclick='abrirEditorProveedorExistente(${JSON.stringify(r.tabla)}, ${JSON.stringify(r.id)})'>
      <b>${r.nombre}</b> — ${r.tipo_label}${r.ciudad?' · '+r.ciudad:''}<br>
      <span style="font-size:11px;color:var(--tinta-suave);">Confianza: ${r.nivel_confianza||'sin definir'} · ${r.tiene_descripcion?'ya tiene descripción':'sin descripción todavía'}</span>
    </div>`).join('');
}

// Todas las columnas usadas aquí están verificadas contra el esquema
// real de Supabase (list_tables, sesión 26) — ninguna es inventada.
function campoTextoMeta(col, label, valor, ancho){
  return `<div class="campo${ancho?' campo-ancho':''}"><label style="font-size:11px;">${label}</label><input type="text" data-col="${col}" data-tipo="text" value="${(valor||'').toString().replace(/"/g,'&quot;')}"></div>`;

function campoTextareaMeta(col, label, valor){
  return `<div class="campo campo-ancho"><label style="font-size:11px;">${label}</label><textarea data-col="${col}" data-tipo="text" rows="2" style="width:100%;font-size:12px;">${valor||''}</textarea></div>`;
}
function campoNumMeta(col, label, valor, esEntero){
  const num = v => (v===null||v===undefined) ? '' : v;
  return `<div class="campo"><label style="font-size:11px;">${label}</label><input type="number" step="${esEntero?'1':'0.01'}" min="0" data-col="${col}" data-tipo="${esEntero?'int':'num'}" value="${num(valor)}"></div>`;
}
function campoBoolMeta(col, label, valor){
  return `<label style="display:inline-flex;align-items:center;gap:4px;font-size:11px;margin:4px 12px 4px 0;"><input type="checkbox" data-col="${col}" data-tipo="bool" ${valor?'checked':''}> ${label}</label>`;
}
function campoFechaMeta(col, label, valor){
  return `<div class="campo"><label style="font-size:11px;">${label}</label><input type="date" data-col="${col}" data-tipo="text" value="${valor||''}"></div>`;

function valorNumEdicion(id){
  const el = document.getElementById(id);
  if(!el) return undefined;
  const v = el.value.trim();
  return v === '' ? null : (parseFloat(v) || null);
}

async function guardarDescripcionExistente(){
  const estado = document.getElementById('ep-estado');
  const tabla = document.getElementById('ep-tabla').value;
  const id = document.getElementById('ep-id').value;
  const campoNombre = tabla === 'proveedor' ? 'nombre_comercial' : 'nombre';
  const campoCiudad = tabla === 'atractivo' ? 'parroquia' : 'ciudad';
  const cuerpo = {
    [campoNombre]: document.getElementById('ep-nombre').value.trim() || null,
    [campoCiudad]: document.getElementById('ep-ciudad').value.trim() || null,
    telefono: document.getElementById('ep-telefono').value.trim() || null,
    estado_verificacion: document.getElementById('ep-estado-verif').value,
    descripcion: document.getElementById('ep-descripcion').value.trim() || null,
    nivel_confianza: document.getElementById('ep-confianza').value,
    fuentes_consultadas: document.getElementById('ep-fuentes').value.trim() || null,
    notas: document.getElementById('ep-notas').value.trim() || null,
  };
  // campos de tarifa: solo se incluyen si el input existe en el formulario actual
  const subcategoria = document.getElementById('ep-subcategoria');
  if(subcategoria) cuerpo.subcategoria = subcategoria.value.trim() || null;
  [
    ['ep-tarifa-adulto','tarifa_adulto'], ['ep-tarifa-nino','tarifa_nino'], ['ep-tarifa-3ra','tarifa_tercera_edad'],
    ['ep-tarifa-guia-fullday','tarifa_full_day'], ['ep-tarifa-guia-mediodia','tarifa_medio_dia'], ['ep-tarifa-guia-tour','tarifa_tour'], ['ep-tarifa-guia-dia','tarifa_dia'],
    ['ep-tarifa','tarifa_temporada_baja'], ['ep-tarifa-simple','tarifa_hab_simple'], ['ep-tarifa-doble','tarifa_hab_doble'], ['ep-tarifa-triple','tarifa_hab_triple'], ['ep-tarifa-cuadruple','tarifa_hab_cuadruple'], ['ep-tarifa-familiar','tarifa_hab_familiar'],
    ['ep-tarifa-desayuno','tarifa_desayuno'], ['ep-tarifa-almuerzo','tarifa_almuerzo'], ['ep-tarifa-cena','tarifa_cena'], ['ep-tarifa-alacarta','tarifa_alacarta'],
    ['ep-tarifa-fullday','tarifa_full_day'], ['ep-tarifa-mediodia','tarifa_medio_dia'], ['ep-tarifa-tour','tarifa_tour'], ['ep-tarifa-dia','tarifa_dia'],
  ].forEach(([elId, columna]) => {
    const v = valorNumEdicion(elId);
    if(v !== undefined) cuerpo[columna] = v;
  });
  // Obs.5 extendido (sesión 26): campos de metadatos de cola larga,
  // recogidos genéricamente vía data-col/data-tipo (ver camposMetadatosEdicionHTML).
  // Funciona aunque el <details> esté colapsado — el DOM conserva los valores.
  document.querySelectorAll('#ep-meta-cont [data-col]').forEach(el => {
    const col = el.dataset.col;
    const tipo = el.dataset.tipo;
    if(tipo === 'bool'){
      cuerpo[col] = el.checked;
    } else if(tipo === 'num' || tipo === 'int'){
      const v = el.value.trim();
      const n = v === '' ? null : (tipo === 'int' ? parseInt(v,10) : parseFloat(v));
      cuerpo[col] = (n === null || Number.isNaN(n)) ? null : n;
    } else {
      cuerpo[col] = el.value.trim() || null;
    }
  });
  estado.textContent = 'Guardando…';
  try{
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=eq.${id}`, {
      method:'PATCH',
      headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${authToken()}`, 'Content-Type':'application/json', Prefer:'return=minimal'},
      body: JSON.stringify(cuerpo)
    });
    if(resp.ok){
      estado.innerHTML = '<span style="color:var(--tinta-suave);">Guardado ✓</span>';
    } else {
      const datos = await resp.json().catch(()=>null);
      estado.innerHTML = `<span style="color:var(--critico);">No se pudo guardar: ${(datos && (datos.message||datos.error)) || 'HTTP '+resp.status}</span>`;
    }
  }catch(e){
    estado.innerHTML = `<span style="color:var(--critico);">Error de red: ${e.message}</span>`;
  }
}

async function guardarNuevoProveedor(){

  const verificado = document.getElementById('np-verificado').checked;

    ciudad: document.getElementById('np-ciudad').value.trim(),
    telefono: document.getElementById('np-telefono').value.trim(),

  let tabla, cuerpo;
  const descripcionTexto = document.getElementById('np-descripcion')?.value.trim() || null;

    if(descripcionTexto){ cuerpo.descripcion = descripcionTexto; cuerpo.nivel_confianza = descripcionConfianza || base.nivel_confianza; if(descripcionFuentes) cuerpo.fuentes_consultadas = descripcionFuentes; }
  } else if(tipo === 'guia'){

      tarifa_dia: parseFloat(document.getElementById('np-tarifa-guia-dia')?.value || '0') || null,
    };
    if(descripcionTexto){ cuerpo.descripcion = descripcionTexto; cuerpo.nivel_confianza = descripcionConfianza || base.nivel_confianza; if(descripcionFuentes) cuerpo.fuentes_consultadas = descripcionFuentes; }
  } else {
    tabla = 'proveedor';

    cuerpo = {...base, nombre_comercial: nombre, tipo_proveedor_id: await idTipoProveedor(tipoNombre)};
    if(descripcionTexto){
      cuerpo.descripcion = descripcionTexto;
      cuerpo.nivel_confianza = descripcionConfianza || base.nivel_confianza;
      if(descripcionFuentes) cuerpo.fuentes_consultadas = descripcionFuentes;
    }
    if(tipo === 'hotel'){
      cuerpo.categoria_hotel_id = await idCategoriaHotel(document.getElementById('np-categoria').value);
      cuerpo.subcategoria = document.getElementById('np-subcategoria')?.value.trim() || null;
      cuerpo.tarifa_temporada_baja = parseFloat(document.getElementById('np-tarifa')?.value || '0') || null;
      cuerpo.tarifa_hab_simple = parseFloat(document.getElementById('np-tarifa-simple')?.value || '0') || null;
      cuerpo.tarifa_hab_doble = parseFloat(document.getElementById('np-tarifa-doble')?.value || '0') || null;
      cuerpo.tarifa_hab_triple = parseFloat(document.getElementById('np-tarifa-triple')?.value || '0') || null;
      cuerpo.tarifa_hab_cuadruple = parseFloat(document.getElementById('np-tarifa-cuadruple')?.value || '0') || null;
      cuerpo.tarifa_hab_familiar = parseFloat(document.getElementById('np-tarifa-familiar')?.value || '0') || null;
    } else if(tipo === 'restaurante'){
      cuerpo.subcategoria = document.getElementById('np-subcategoria')?.value.trim() || null;
      cuerpo.tarifa_desayuno = parseFloat(document.getElementById('np-tarifa-desayuno')?.value || '0') || null;
      cuerpo.tarifa_almuerzo = parseFloat(document.getElementById('np-tarifa-almuerzo')?.value || '0') || null;
      cuerpo.tarifa_cena = parseFloat(document.getElementById('np-tarifa-cena')?.value || '0') || null;
      cuerpo.tarifa_alacarta = parseFloat(document.getElementById('np-tarifa-alacarta')?.value || '0') || null;
    } else if(tipo === 'transporte'){
      cuerpo.subcategoria = document.getElementById('np-subcategoria')?.value.trim() || null;
      cuerpo.tarifa_full_day = parseFloat(document.getElementById('np-tarifa-fullday')?.value || '0') || null;
      cuerpo.tarifa_medio_dia = parseFloat(document.getElementById('np-tarifa-mediodia')?.value || '0') || null;
      cuerpo.tarifa_tour = parseFloat(document.getElementById('np-tarifa-tour')?.value || '0') || null;
      cuerpo.tarifa_dia = parseFloat(document.getElementById('np-tarifa-dia')?.value || '0') || null;
    }
  }

  try{
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}`, {
      method:'POST',
      headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${authToken()}`, 'Content-Type':'application/json', Prefer:'return=representation'},
      body: JSON.stringify(cuerpo)
    });
    const datos = await resp.json().catch(()=>null);
    if(resp.ok){
      estado.textContent = `Guardado como "${nombre}" (${verificado?'VERIFICADO':'PARCIAL'}). Ya está disponible en las búsquedas de todas las licencias que usen esta base.`;
    } else {
      // No adivino más allá de esto: si algún nombre de columna no coincide
      // con el esquema real de Supabase, este es el error exacto que
      // devuelve la base — hace falta ajustar el nombre de esa columna.
      estado.innerHTML = `<span style="color:var(--critico);">No se pudo guardar: ${(datos && (datos.message||datos.error)) || 'HTTP '+resp.status}</span>`;
    }
  }catch(e){
    estado.innerHTML = `<span style="color:var(--critico);">Error de red: ${e.message}</span>`;
  }
}


async function abrirEditorMarca(){
  let actual = {...TEMA_DEFECTO};
  try{
    const guardado = localStorage.getItem(TEMA_STORAGE_KEY);
    if(guardado) actual = {...actual, ...JSON.parse(guardado)};
  }catch(e){}
  // Sesión 29: la caché local puede estar vacía o desactualizada (p.ej.
  // en una ventana de incógnito nueva, o si cargarTemaSupabase() todavía
  // no terminaba cuando se abrió este editor) mientras que en Supabase sí
  // hay datos guardados — el editor mostraba campos vacíos aunque el
  // encabezado del voucher sí los mostraba bien. Se refresca en vivo
  // contra la tabla `agencia` antes de precargar el formulario, así el
  // editor siempre parte de la fuente real, no de una copia local.
  if(SUPABASE_ACTIVO){
    try{
      const s = obtenerSesion();
      if(s?.agencia_id){
        const r = await supabaseFetch('agencia', `select=nombre,logo_url,color_primario,color_primario_claro,color_acento,color_secundario,color_exito,direccion,telefono,email,sitio_web&id=eq.${s.agencia_id}`);

            ...actual,
            nombre: e.nombre || actual.nombre,
            basalto: e.color_primario || actual.basalto,
            basalto2: e.color_primario_claro || actual.basalto2,
            oro: e.color_acento || actual.oro,
            grana: e.color_secundario || actual.grana,
            paramo: e.color_exito || actual.paramo,
            logoUrl: e.logo_url || actual.logoUrl,
            direccion: e.direccion || '',
            telefono: e.telefono || '',
            email: e.email || '',
            sitioWeb: e.sitio_web || '',

    </div>`;

  const modal = document.getElementById('tema-modal');

  modal.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:60;display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this) cerrarTemaModal()">

      ${campo('tema-nombre','Nombre de marca', actual.nombre, 'text')}
      <div style="margin-bottom:14px;">
        <label for="tema-logo" style="font-size:13px;color:var(--tinta);display:block;margin-bottom:4px;">Logo</label>

        <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
          <input id="tema-logo-archivo" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="font-size:12px;flex:1;">

        <button class="btn-mini" style="margin-top:6px;" onclick="detectarColoresDeLogo()">🎨 Usar los colores del logo</button>

// Obs. 3 de cambios_tur.docx (11-ago sesión 4): antes el mensaje de estado
// del modal "Personalizar marca" era texto gris pequeño, fácil de no ver —
// Héctor reportó que "Subir" y "Usar los colores del logo" no parecían
// hacer nada, cuando en realidad sí mostraban el resultado/error, solo que
// pasaba desapercibido. Ahora se pinta con fondo de color según sea error
// o éxito, para que sea imposible no notarlo.
function fijarEstadoTema(el, texto){
  if(!el) return;
  el.textContent = texto;
  const negativo = /no se pudo|falta|sin conexión|primero (elige|pega)/i.test(texto);
  const neutro = /guardando…|subiendo archivo…|extrayendo colores…/i.test(texto);
  el.style.background = neutro ? '#f0eee8' : (negativo ? '#fbe7e4' : '#e8f3ec');
  el.style.color = neutro ? 'var(--tinta-suave)' : (negativo ? '#B23B2E' : '#2F6B4F');
}
async function guardarTema(){
  const t = {
    nombre: document.getElementById('tema-nombre').value.trim() || TEMA_DEFECTO.nombre,
    logoUrl: document.getElementById('tema-logo').value.trim(),
    basalto: document.getElementById('tema-basalto').value,
    basalto2: document.getElementById('tema-basalto2').value,
    oro: document.getElementById('tema-oro').value,
    grana: document.getElementById('tema-grana').value,
    paramo: document.getElementById('tema-paramo').value,
    direccion: document.getElementById('tema-direccion')?.value.trim() || '',
    telefono: document.getElementById('tema-telefono')?.value.trim() || '',
    email: document.getElementById('tema-email')?.value.trim() || '',
    sitioWeb: document.getElementById('tema-sitioweb')?.value.trim() || '',
  };
  aplicarTema(t);
  try{ localStorage.setItem(TEMA_STORAGE_KEY, JSON.stringify(t)); }
  catch(e){ console.error('No se pudo guardar el tema en caché local:', e); }

  const estado = document.getElementById('tema-estado');
  if(!SUPABASE_ACTIVO){
    if(estado) fijarEstadoTema(estado, 'Guardado en este navegador (sin conexión a Supabase).');
    return;
  }
  try{
    const s = obtenerSesion();
    if(!s?.agencia_id){
      if(estado) fijarEstadoTema(estado, 'Guardado en este navegador. Tu cuenta no tiene una agencia asignada todavía, así que no se pudo sincronizar con Supabase — pídele al administrador que te asigne una en "Usuarios".');
      return;
    }
    const cuerpo = {
      nombre: t.nombre,
      logo_url: t.logoUrl,
      color_primario: t.basalto,
      color_primario_claro: t.basalto2,
      color_acento: t.oro,
      color_secundario: t.grana,
      color_exito: t.paramo,
      direccion: t.direccion || null,
      telefono: t.telefono || null,
      email: t.email || null,
      sitio_web: t.sitioWeb || null,
    };
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/agencia?id=eq.${s.agencia_id}`, {method:'PATCH', headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${authToken()}`,'Content-Type':'application/json',Prefer:'return=minimal'}, body:JSON.stringify(cuerpo)});
    if(resp.ok){
      if(estado) fijarEstadoTema(estado, 'Sincronizado con Supabase — se verá igual en cualquier dispositivo de esta cuenta.');
    } else {
      if(estado) fijarEstadoTema(estado, 'Guardado en este navegador; falló la sincronización con Supabase (revisa que tu rol tenga permiso para editar tu agencia).');
    }
  }catch(e){
    console.error('No se pudo sincronizar el tema con Supabase:', e);
    if(estado) fijarEstadoTema(estado, 'Guardado en este navegador; falló la sincronización con Supabase.');
  }
}

// Sube el logo como archivo (en vez de pegar una URL) a Supabase Storage.
// Requiere un bucket PÚBLICO llamado "marca-logos" ya creado en el proyecto
// (Dashboard → Storage → New bucket → nombre "marca-logos" → Public bucket
// activado). Si el bucket no existe, se avisa exactamente qué falta —
// nunca se inventa que subió si no subió.
const BUCKET_LOGOS = 'marca-logos';
async function subirLogoArchivo(){
  const input = document.getElementById('tema-logo-archivo');
  const estado = document.getElementById('tema-estado');
  const archivo = input?.files?.[0];
  if(!archivo){ if(estado) fijarEstadoTema(estado, 'Primero elige un archivo de imagen.'); return; }
  if(!SUPABASE_ACTIVO){ if(estado) fijarEstadoTema(estado, 'Sin conexión a Supabase — no se puede subir el archivo (solo URL funciona sin conexión).'); return; }
  if(archivo.size > 2*1024*1024){ if(estado) fijarEstadoTema(estado, 'El archivo pesa más de 2MB — usa una imagen más liviana.'); return; }

  if(estado) fijarEstadoTema(estado, 'Subiendo archivo…');
  const ext = (archivo.name.split('.').pop() || 'png').toLowerCase();
  const nombreArchivo = `logo-${Date.now()}.${ext}`;
  try{
    const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET_LOGOS}/${nombreArchivo}`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization:`Bearer ${authToken()}`,
        'Content-Type': archivo.type || 'application/octet-stream',
        'x-upsert': 'true',
      },
      body: archivo,
    });
    if(resp.ok){
      const urlPublica = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_LOGOS}/${nombreArchivo}`;
      document.getElementById('tema-logo').value = urlPublica;
      if(estado) fijarEstadoTema(estado, 'Archivo subido — extrayendo colores…');
      detectarColoresDeLogo();
    } else if(resp.status === 404 || resp.status === 400){
      if(estado) fijarEstadoTema(estado, `No se pudo subir: falta crear el bucket público "${BUCKET_LOGOS}" en Supabase (Dashboard → Storage → New bucket → marca "Public bucket"). Mientras tanto puedes pegar una URL directamente.`);
    } else {
      if(estado) fijarEstadoTema(estado, `No se pudo subir el archivo (código ${resp.status}). Puedes pegar una URL directamente mientras tanto.`);
    }
  }catch(e){
    console.error('Error subiendo logo a Supabase Storage:', e);
    if(estado) fijarEstadoTema(estado, 'No se pudo subir el archivo (error de red). Puedes pegar una URL directamente mientras tanto.');
  }
}

// Intenta leer el color dominante del logo para sugerir el color de acento.
// Muchos sitios de imágenes bloquean la lectura de píxeles entre dominios
// (CORS) — si eso pasa, avisamos en vez de fallar en silencio; nunca se
// inventa un color si no se pudo leer la imagen real.
function detectarColoresDeLogo(){
  const url = document.getElementById('tema-logo').value.trim();
  const estado = document.getElementById('tema-estado');
  if(!url){ if(estado) fijarEstadoTema(estado, 'Primero pega la URL del logo o sube un archivo.'); return; }
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 60; canvas.height = 60;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 60, 60);
      const datos = ctx.getImageData(0, 0, 60, 60).data;
      const conteo = {};
      for(let i=0; i<datos.length; i+=4){
        const [r,g,b,a] = [datos[i],datos[i+1],datos[i+2],datos[i+3]];
        if(a < 200) continue; // ignora transparencia
        if(r>240 && g>240 && b>240) continue; // ignora blanco de fondo
        if(r<15 && g<15 && b<15) continue; // ignora negro puro de fondo
        const clave = `${Math.round(r/16)*16},${Math.round(g/16)*16},${Math.round(b/16)*16}`;
        conteo[clave] = (conteo[clave]||0) + 1;
      }
      const ordenados = Object.entries(conteo).sort((a,b)=>b[1]-a[1]).map(([k])=>k.split(',').map(Number));
      if(!ordenados.length){ if(estado) fijarEstadoTema(estado, 'El logo parece ser solo blanco/negro/transparente — no hay un color dominante claro que sugerir.'); return; }
      const distancia = (c1,c2) => Math.sqrt((c1[0]-c2[0])**2 + (c1[1]-c2[1])**2 + (c1[2]-c2[2])**2);
      const dominantes = [ordenados[0]];
      for(const c of ordenados.slice(1)){
        if(dominantes.every(d => distancia(d,c) > 60)){ dominantes.push(c); if(dominantes.length >= 2) break; }
      }
      const aHex = ([r,g,b]) => '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
      const aplicados = [];
      document.getElementById('tema-oro').value = aHex(dominantes[0]);
      aplicados.push('acento');
      if(dominantes[1]){ document.getElementById('tema-grana').value = aHex(dominantes[1]); aplicados.push('secundario'); }
      // No se tocan los fondos oscuros (basalto/basalto2) a propósito: un color
      // del logo ahí podría romper el contraste del texto blanco del navbar.
      if(estado) fijarEstadoTema(estado, `Colores del logo aplicados a: ${aplicados.join(' y ')} (${dominantes.map(aHex).join(', ')}). Ajusta a mano si no son los que quieres, y presiona "Guardar".`);
    }catch(err){
      if(estado) fijarEstadoTema(estado, 'No se pudo leer el color del logo: el sitio donde está alojado bloquea la lectura entre dominios (CORS). Sube el logo a un servicio que lo permita, o ajusta los colores a mano.');
    }
  };
  img.onerror = () => { if(estado) fijarEstadoTema(estado, 'No se pudo cargar esa URL de imagen.'); };
  img.src = url;
}

async function restaurarTema(){
  try{ localStorage.removeItem(TEMA_STORAGE_KEY); }catch(e){}
  aplicarTema(TEMA_DEFECTO);
  const estado = document.getElementById('tema-estado');
  if(SUPABASE_ACTIVO){
    try{
      // Sesión 26 (corrección de bug encontrado en la auditoría): esto
      // seguía restaurando la tabla vieja `empresa_config` (una sola fila
      // global) en vez de la fila de `agencia` del usuario conectado —
      // quedó desactualizado desde que sesión 23 pasó la marca a ser por
      // agencia. Ahora sigue el mismo patrón que guardarTema().
      const s = obtenerSesion();
      if(s?.agencia_id){
        // agencia.nombre es NOT NULL — no se restaura a "vacío" (borraría la
        // identidad de la agencia en el resto del sistema), solo se limpian
        // logo, colores y contacto.
        const cuerpo = {logo_url:null, color_primario:null, color_primario_claro:null, color_acento:null, color_secundario:null, color_exito:null, direccion:null, telefono:null, email:null, sitio_web:null};
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/agencia?id=eq.${s.agencia_id}`, {method:'PATCH', headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${authToken()}`,'Content-Type':'application/json',Prefer:'return=minimal'}, body:JSON.stringify(cuerpo)});
        if(estado) fijarEstadoTema(estado, resp.ok ? 'Restaurado por defecto y sincronizado con Supabase.' : 'Restaurado en este navegador; falló la sincronización con Supabase.');
      } else if(estado){
        fijarEstadoTema(estado, 'Restaurado en este navegador. Tu cuenta no tiene una agencia asignada, así que no había nada que sincronizar.');
      }
    }catch(e){ console.error('No se pudo restaurar el tema en Supabase:', e); }
  }
  setTimeout(cerrarTemaModal, SUPABASE_ACTIVO ? 900 : 0);
}

cargarTemaCache();
cargarTemaSupabase();
