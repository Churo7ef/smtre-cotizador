<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<!-- Sesión 21 (31-ago-2026): CSP vía meta tag, pendiente de la auditoría de
     sesión 20. Restringe a qué dominios se puede conectar/cargar recursos
     (Supabase propio + Google Fonts), bloquea <object>/<embed> y cambios de
     <base>/envío de formularios fuera del propio archivo.
     LIMITACIÓN CONOCIDA: script-src necesita 'unsafe-inline' porque toda la
     app usa un único bloque de JavaScript inline y cientos de atributos
     onclick/onchange — no es un CSP que por sí solo bloquee ejecución de
     JavaScript inyectado vía XSS, solo reduce a dónde puede exfiltrar datos
     o qué puede cargar. Y 'frame-ancestors' (protección contra clickjacking) NO funciona puesto
     por <meta> — la especificación exige que venga como cabecera HTTP real,
     así que sigue dependiendo del hosting final (mismo punto ciego que ya
     señalaba la auditoría de sesión 20). -->
<!-- Sesión 22 (1-sep-2026): CSP ampliado para permitir el SDK de Sentry
     (monitoreo de errores) — se agregó browser.sentry-cdn.com a script-src
     y el dominio de ingesta del proyecto a connect-src. Ver también el
     bloque de Sentry.init() antes de </head>. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://browser.sentry-cdn.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://zbwgpytiuxkhbtpxrqsd.supabase.co https://api.qrserver.com; connect-src 'self' https://zbwgpytiuxkhbtpxrqsd.supabase.co https://o4512012850233344.ingest.us.sentry.io https://browser.sentry-cdn.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Cotizador de Turismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --basalto:#1E2A2A;
    --basalto-2:#27403C;
    --papel:#FAF9F5;
    --papel-2:#EFEDE7;
    --grana:#B5654F;
    --grana-2:#8F4F3D;
    --paramo:#5B8C6B;
    --oro:#C79A3E;
    --tinta:#1A1A1A;
    --tinta-suave:#5C5C58;
    --linea:#E3E1DA;
    --critico:#B0433A;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--basalto);
    color:var(--papel);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--oro);color:var(--tinta);}

  .app{
    display:grid;
    grid-template-columns: 360px 1fr;
    min-height:100vh;
  }
  @media (max-width: 880px){
    .app{grid-template-columns: 1fr;}
  }

  /* ---------- HEADER / MASTHEAD ---------- */
  .masthead{
    grid-column:1/-1;
    padding:28px 32px 20px;
    border-bottom:1px solid rgba(250,249,245,0.14);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .masthead .brand{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.01em;
  }
  .masthead .brand small{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--oro);
    margin-top:2px;
  }
  .masthead .estado{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:rgba(250,249,245,0.6);
    text-align:right;
    line-height:1.5;
  }
  .masthead .estado b{color:var(--papel);}

  .tabs{display:flex;gap:8px;order:3;flex-basis:100%;margin-top:4px;}
  @media (min-width:881px){.tabs{flex-basis:auto;order:0;margin-top:0;}}
  .tab-btn{
    background:transparent;border:1px solid rgba(250,249,245,0.28);color:rgba(250,249,245,0.75);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;
    padding:7px 14px;border-radius:var(--radius);cursor:pointer;
  }
  .tab-btn.activo{background:var(--oro);border-color:var(--oro);color:var(--tinta);font-weight:600;}
  .tab-btn:hover:not(.activo){border-color:var(--oro);color:var(--oro);}

  /* Menús desplegables agrupados de la barra superior (sesión 26) */
  .tabs-dropdown{position:relative;}
  .tabs-dropdown > .tab-btn .caret{font-size:9px;margin-left:3px;opacity:0.7;}
  .tabs-dropdown-panel{
    display:none;flex-direction:column;gap:3px;
    position:absolute;top:calc(100% + 6px);left:0;
    background:var(--basalto-2);border:1px solid rgba(250,249,245,0.18);
    border-radius:var(--radius);min-width:220px;padding:6px;z-index:90;
    box-shadow:0 10px 28px rgba(0,0,0,0.4);
  }
  .tabs-dropdown.abierto .tabs-dropdown-panel{display:flex;}
  .tabs-dropdown-panel .tab-btn{width:100%;text-align:left;}

  /* ---------- COMPONENTES COMPARTIDOS (usados por Diseñar Programa) ---------- */
  .chip{
    border:1px solid var(--linea);border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer;
    background:#fff;user-select:none;
  }
  .chip.on{background:var(--paramo);border-color:var(--paramo);color:#fff;}
  .cobertura-aviso{
    background:#FBEAE6;border:1px solid var(--critico);color:var(--grana-2);
    padding:14px 16px;border-radius:var(--radius);font-size:13.5px;line-height:1.55;margin-bottom:20px;
  }
  .hueco{color:var(--critico);font-style:italic;}

  /* ---------- DISEÑADOR DE PROGRAMA ---------- */
  .dis-grid{display:grid;grid-template-columns:1fr 380px;gap:28px;align-items:start;}
  @media (max-width:1000px){.dis-grid{grid-template-columns:1fr;}}
  .dis-seccion{background:var(--papel-2);border:1px solid var(--linea);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .dis-seccion h2{font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:0.1em;color:var(--tinta-suave);margin:0 0 12px;}
  .fila-itin{display:grid;grid-template-columns:55px 70px 1fr 90px 90px 130px 30px;gap:6px;align-items:center;margin-bottom:6px;}
  .fila-itin-card{border:1px solid var(--linea);border-radius:var(--radius);padding:8px 9px;margin-bottom:8px;background:var(--basalto-2);}
  .fila-itin-top{display:grid;grid-template-columns:44px 56px 78px 84px 1fr 66px 66px 50px 26px;gap:6px;align-items:end;margin-bottom:6px;}
  .fila-itin-top .campo-mini{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .fila-itin-top .campo-mini label{font-size:10px;font-weight:600;letter-spacing:0.02em;color:rgba(250,249,245,0.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fila-itin-bottom{display:flex;gap:6px;align-items:center;}
  .fila-itin-bottom input[type="text"]{flex:1;}
  .fila-itin-card input, .fila-itin-card select, .fila-itin-top input, .fila-itin-top select{padding:7px 8px;font-size:13px;border:1px solid var(--linea);border-radius:var(--radius);width:100%;color:var(--tinta);background:var(--papel);}
  .fila-itin-top .badge-fecha{font-size:10.5px;font-weight:600;color:var(--oro);background:var(--basalto);border:1px solid var(--linea);border-radius:var(--radius);padding:6px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fila-itin-top .badge-fecha.vacia{visibility:hidden;}
  .fila-itin input, .fila-itin select{padding:6px 7px;font-size:12.5px;border:1px solid var(--linea);border-radius:var(--radius);width:100%;}
  .fila-itin .quitar{background:none;border:none;color:var(--critico);cursor:pointer;font-size:16px;}
  .lista-editable{display:flex;flex-direction:column;gap:6px;}
  .item-editable{display:flex;gap:6px;align-items:center;}
  .item-editable input{flex:1;padding:6px 8px;font-size:13px;border:1px solid var(--linea);border-radius:var(--radius);}
  .item-editable .quitar{background:none;border:none;color:var(--critico);cursor:pointer;font-size:16px;flex-shrink:0;}
  .btn-mini{background:var(--paramo);color:#fff;border:none;padding:6px 12px;font-size:12px;border-radius:var(--radius);cursor:pointer;}
  .tarjeta-programa{border:1px solid var(--linea);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;background:#fff;}
  .tarjetas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-items:start;}
  .tarjetas-grid .tarjeta-programa{margin-bottom:0;}
  .tarjeta-programa h4{font-family:'Fraunces',serif;font-size:16px;margin:0 0 4px;}
  .tarjeta-programa .meta{font-size:12px;color:var(--tinta-suave);margin-bottom:8px;}
  .tarjeta-programa .acciones{display:flex;gap:6px;flex-wrap:wrap;}
  .tarjeta-programa .acciones button{font-size:11.5px;padding:5px 10px;border-radius:var(--radius);border:1px solid var(--linea);background:#fff;cursor:pointer;}
  .tarjeta-programa .acciones button:hover{border-color:var(--grana);color:var(--grana);}
  .progreso-barra{background:var(--linea);border-radius:20px;height:8px;overflow:hidden;margin:6px 0;}
  .progreso-fill{background:var(--paramo);height:100%;transition:width .2s;}
  .badge-estado{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:10px;font-weight:600;}
  .badge-estado.abierto{background:#DCEEE1;color:var(--paramo);}
  .badge-estado.completo{background:#F2E6C9;color:#8A6A2E;}
  .badge-estado.cerrado{background:#E4E4E4;color:#555;}
  .badge-estado.cancelado{background:#FBEAE6;color:var(--grana-2);}
  .tabla-reservas{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;}
  .tabla-reservas th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--tinta-suave);border-bottom:1px solid var(--linea);padding:4px 6px;}
  .tabla-reservas td{padding:5px 6px;border-bottom:1px solid var(--linea);}
  .doc-print{background:#fff;color:var(--tinta);border:1px solid var(--tinta);padding:30px;max-width:820px;margin:0 auto;}
  .doc-print h1{font-family:'Fraunces',serif;font-size:24px;margin:0 0 4px;}
  .doc-print .dia-titulo{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin:16px 0 6px;border-bottom:1px solid var(--linea);padding-bottom:4px;}
  .doc-print .hora-item{font-size:13px;margin-bottom:4px;display:flex;gap:10px;}
  .doc-print .hora-item .h{font-family:'IBM Plex Mono',monospace;color:var(--tinta-suave);width:48px;flex-shrink:0;}
  .doc-print .firma-linea{margin-top:50px;border-top:1px solid var(--tinta);padding-top:6px;width:280px;font-size:12px;}
  /* Sesión 27 (pendiente #3 del handoff 26): reduce cortes feos de página en
     PDFs largos (programas de varios días). html2pdf.js respeta estas reglas
     CSS gracias a pagebreak.mode incluir 'css'. No elimina el riesgo al
     100% (una tabla más alta que una página siempre se corta en algún punto),
     pero evita que el título de un día quede solo al final de una página con
     su contenido en la siguiente, y evita que una fila de tabla se parta a
     la mitad. */
  #doc-editable-area table, #doc-editable-area tr{page-break-inside:avoid;break-inside:avoid;}
  #doc-editable-area .dia-titulo{page-break-after:avoid;break-after:avoid;page-break-inside:avoid;break-inside:avoid;}


  /* ---------- RAIL: LISTA DE PROGRAMAS ---------- */
  .rail{
    background:var(--basalto);
    border-right:1px solid rgba(250,249,245,0.14);
    padding:20px 16px 40px;
    overflow-y:auto;
    max-height:calc(100vh - 96px);
  }
  .rail-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:rgba(250,249,245,0.55);
    padding:4px 8px 12px;
  }
  .ticket{
    background:var(--basalto-2);
    border:1px solid rgba(250,249,245,0.1);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
    position:relative;
  }
  .ticket:hover{border-color:var(--oro);}
  .ticket.activo{border-color:var(--oro); background:var(--basalto-2);}
  .ticket.bloqueado{opacity:0.62;}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ticket-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--oro);
    letter-spacing:0.04em;
  }
  .ticket-nombre{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:600;
    line-height:1.25;
    margin-top:3px;
  }
  .ticket-meta{
    font-size:11.5px;
    color:rgba(250,249,245,0.55);
    margin-top:6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .sello-mini{
    width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--oro);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;font-weight:600;color:var(--oro);
    flex-shrink:0;
  }
  .ticket.bloqueado .sello-mini{border-color:var(--critico);color:var(--critico);}

  /* ---------- MAIN: COTIZADOR ---------- */
  .main{
    padding:32px 40px 60px;
    background:var(--papel);
    color:var(--tinta);
    overflow-y:auto;
    max-height:calc(100vh - 96px);
  }
  .vacio{
    height:100%;min-height:400px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--tinta-suave);
    text-align:center;
  }
  .vacio .glifo{font-family:'Fraunces',serif;font-size:56px;color:var(--linea);margin-bottom:6px;}

  .panel-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:2px solid var(--tinta);
    padding-bottom:18px;margin-bottom:24px;flex-wrap:wrap;gap:16px;
  }
  .panel-header h1{
    font-family:'Fraunces',serif;font-size:30px;font-weight:700;margin:0 0 6px;
    line-height:1.1;
  }
  .panel-header .sub{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--tinta-suave);
  }

  .sello{
    width:88px;height:88px;border-radius:50%;
    border:2.5px solid var(--oro);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    position:relative;
    flex-shrink:0;
  }
  .sello::before{
    content:'';position:absolute;inset:5px;border:1px solid var(--oro);border-radius:50%;
  }
  .sello .num{font-size:26px;font-weight:700;color:var(--grana);}
  .sello .etq{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:0.08em;color:var(--tinta-suave);text-transform:uppercase;}
  .sello.bloqueado{border-color:var(--critico);}
  .sello.bloqueado::before{border-color:var(--critico);}
  .sello.bloqueado .num{color:var(--critico);}

  .aviso-critico{
    background:#FBEAE6;border:1px solid var(--critico);color:var(--grana-2);
    padding:14px 16px;border-radius:var(--radius);font-size:13.5px;line-height:1.5;
    margin-bottom:24px;
  }
  .aviso-critico b{color:var(--critico);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  @media (max-width:700px){.grid-2{grid-template-columns:1fr;}}

  .bloque{margin-bottom:28px;}
  .bloque h2{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-transform:uppercase;
    letter-spacing:0.12em;color:var(--tinta-suave);margin:0 0 12px;
    border-bottom:1px solid var(--linea);padding-bottom:6px;
  }

  .campo{margin-bottom:14px;}
  .campo label{
    display:block;font-size:12px;color:var(--tinta-suave);margin-bottom:5px;
    font-weight:500;
  }
  .campo input, .campo select{
    width:100%;padding:9px 11px;font-family:'Inter',sans-serif;font-size:14.5px;
    border:1px solid var(--linea);border-radius:var(--radius);background:#fff;color:var(--tinta);
  }
  .campo input:focus, .campo select:focus{outline:2px solid var(--paramo);outline-offset:1px;}

  /* Pedido de Héctor (ronda 10): los .campo ocupaban todo el ancho de la
     columna aunque el valor fuera corto ("2", "Azuay", "09"), desperdiciando
     espacio. Estas clases agrupan varios campos cortos en una misma fila,
     cada uno con el ancho mínimo que necesita su contenido, y siguen
     apilándose en móvil/columnas angostas. */
  .fila-compacta{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end;}
  .fila-compacta > .campo{flex:1 1 170px;margin-bottom:14px;min-width:0;}
  .fila-compacta > .campo.campo-corto{flex:0 1 92px;}
  .fila-compacta > .campo.campo-medio{flex:1 1 130px;}
  .fila-compacta > .campo.campo-ancho{flex:2 1 220px;}

  .precio-caja{
    background:var(--basalto);color:var(--papel);
    padding:18px 20px;border-radius:var(--radius);
  }
  .precio-caja .fila{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;}
  .precio-caja .fila.fila-3col{display:grid;grid-template-columns:1fr auto 75px;gap:10px;align-items:baseline;}
  .precio-caja .fila.fila-3col span:nth-child(2){font-family:'IBM Plex Mono',monospace;text-align:right;}
  .precio-caja .fila.fila-3col span:nth-child(3){font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--tinta-suave);font-size:12px;}
  .precio-caja .fila.total{
    border-top:1px solid rgba(250,249,245,0.25);margin-top:8px;padding-top:12px;
    font-family:'Fraunces',serif;font-size:20px;font-weight:700;
  }
  .precio-caja .fila span:last-child{font-family:'IBM Plex Mono',monospace;}
  .precio-caja .nota{font-size:11px;color:rgba(250,249,245,0.55);margin-top:10px;line-height:1.5;}

  .btn{
    background:var(--grana);color:var(--papel);border:none;
    padding:12px 22px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    border-radius:var(--radius);cursor:pointer;letter-spacing:0.01em;
    transition:background .15s ease;
  }
  .btn:hover{background:var(--grana-2);}
  .btn:disabled{background:var(--linea);color:var(--tinta-suave);cursor:not-allowed;}
  .btn.fantasma{background:transparent;border:1px solid var(--tinta);color:var(--tinta);}
  .btn.fantasma:hover{background:var(--tinta);color:var(--papel);}

  /* ---------- VOUCHER GENERADO ---------- */
  .voucher{
    margin-top:28px;border:1.5px solid var(--tinta);border-radius:var(--radius);
    padding:26px 28px;background:#fff;position:relative;
  }
  .voucher-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:1px dashed var(--linea);padding-bottom:14px;margin-bottom:16px;
  }
  .voucher-top .codigo{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tinta-suave);}
  .voucher h3{font-family:'Fraunces',serif;font-size:20px;margin:2px 0 0;}
  .voucher-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:13.5px;margin-bottom:16px;}
  .voucher-grid .k{color:var(--tinta-suave);}
  .voucher-total{
    background:var(--papel-2);padding:14px 16px;border-radius:var(--radius);
    display:flex;justify-content:space-between;align-items:center;
  }
  .voucher-total .cifra{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--grana);}
  .voucher-firma{margin-top:20px;font-size:11px;color:var(--tinta-suave);font-family:'IBM Plex Mono',monospace;}

  @media print{
    .rail, .masthead, .btn.fantasma, .no-print{display:none !important;}
    .main{max-height:none;overflow:visible;padding:0;}
    body{background:#fff;}
    .app{display:block;}
  }
</style>
<!-- Sesión 26: librerías para exportar Excel real (.xlsx, no CSV) y PDF
     real de los vouchers, pedidas por Héctor tras la auditoría de costeo/
     vouchers. Sesión 27: se agregó el hash SRI de SheetJS 0.18.5, calculado
     (SHA-512) sobre dist/xlsx.full.min.js del paquete oficial `xlsx@0.18.5`
     publicado en el registro de npm — cdnjs sirve ese mismo build, así que
     debería coincidir byte a byte, pero no se pudo verificar descargando
     directamente desde cdnjs.cloudflare.com (dominio no accesible desde
     este entorno). Si el Excel deja de exportarse tras esta actualización,
     lo más probable es un choque de SRI: hay que abrir la consola del
     navegador (buscará un error de "Failed to find a valid digest") y, si
     aparece, quitar el atributo integrity de esta línea como solución
